schema @link(url: "https://specs.apollo.dev/federation/v2.14", import: ["@key"]) {
  query: Query
  mutation: Mutation
}

type Item @key(fields: "id") {
  id: ID!
  item2s: [Item2!]!
}

type Item2 @key(fields: "id") {
  createdAt: String!
  id: ID!
  item: Item!
  itemId: ID!
  name: String!
}

type Item2SearchHit {
  createdAt: String!
  id: ID!
  itemId: ID!
  name: String!
}

type Mutation {
  createItem2(itemId: ID!, name: String!): Item2!
  deleteItem2(id: ID!): Boolean!
  updateItem2(id: ID!, name: String!): Item2!
}

type Query {
  item2(id: ID!): Item2
  item2s: [Item2!]!
  search(query: String!): [Item2SearchHit!]!
}