schema @link(url: "https://specs.apollo.dev/federation/v2.14", import: []) {
  query: Query
  mutation: Mutation
}

type AuthPayload {
  accessToken: String!
  idToken: String!
  """
  True when the account has a temporary/first-login password that must be changed before the employee can use the portal (see FEAT-5).
  """
  mustChangePassword: Boolean!
  refreshToken: String!
}

type LogoutPayload {
  message: String!
  success: Boolean!
}

type Mutation {
  logout(accessToken: String!): LogoutPayload!
  register(email: String!, password: String!): RegisterPayload!
  signIn(email: String!, password: String!): AuthPayload!
}

type Query {
  health: Boolean!
}

type RegisterPayload {
  message: String!
  success: Boolean!
}
