schema @link(url: "https://specs.apollo.dev/federation/v2.14", import: []) {
  mutation: Mutation
}

type AuthPayload {
  accessToken: String!
  idToken: String!
  refreshToken: String!
}

type LogoutPayload {
  message: String!
  success: Boolean!
}

type Mutation {
  login(email: String!, password: String!): AuthPayload!
  logout(accessToken: String!): LogoutPayload!
  register(email: String!, password: String!): RegisterPayload!
}

type RegisterPayload {
  message: String!
  success: Boolean!
}
