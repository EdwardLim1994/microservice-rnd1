schema @link(url: "https://specs.apollo.dev/federation/v2.14", import: []) {
  mutation: Mutation
}

type AuthPayload {
  accessToken: String!
  idToken: String!
  refreshToken: String!
}

type Mutation {
  login(email: String!, password: String!): AuthPayload!
  signOut(refreshToken: String!): Boolean!
  signUp(input: SignUpInput!): SignUpResult!
}

input SignUpInput {
  email: String!
  name: String
  password: String!
  username: String!
}

type SignUpResult {
  email: String!
  id: ID!
  username: String!
}
