schema @link(url: "https://specs.apollo.dev/federation/v2.14", import: []) {
  mutation: Mutation
}

type AuthTokens {
  accessToken: String!
  expiresIn: Int!
  idToken: String
  refreshToken: String
  tokenType: String!
}

type Mutation {
  signIn(password: String!, username: String!): AuthTokens!
  signOut(refreshToken: String!): Boolean!
  signUp(input: SignUpInput!): SignUpResult!
}

input SignUpInput {
  email: String!
  name: String
  password: String!
  username: String!
}

type SignUpResult {
  email: String!
  id: ID!
  username: String!
}