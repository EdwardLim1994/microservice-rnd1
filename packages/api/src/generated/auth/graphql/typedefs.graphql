schema @link(url: "https://specs.apollo.dev/federation/v2.14", import: []) {
  mutation: Mutation
}

type AuthTokens {
  accessToken: String!
  expiresIn: Int!
  idToken: String
  refreshToken: String
  tokenType: String!
}

type Mutation {
  register(email: String!, password: String!): RegisterResult!
  signIn(password: String!, username: String!): AuthTokens!
  signOut(refreshToken: String!): Boolean!
}

type RegisterResult {
  message: String!
  success: Boolean!
}