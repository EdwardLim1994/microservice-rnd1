services:
  zap:
    image: zaproxy/zap-stable:latest
    container_name: zap
    command: zap-webswing.sh
    ports:
      - "8092:8080"
    networks:
      - zap
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.zap.rule=Host(`zap.localhost`)
      - traefik.http.routers.zap.middlewares=admin-auth
      - traefik.http.services.zap.loadbalancer.server.port=8080

networks:
  zap:
    driver: bridge
  # Empty here on purpose — real definition lives in services/traefik/docker-compose.yml (see
  # that file's own comment on this pattern, mirroring services/vault's "adminer" reference).
  traefik:
