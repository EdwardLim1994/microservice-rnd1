sonar.projectKey=EdwardLim1994_microservice-rnd1
sonar.organization=edwardlim1994
sonar.exclusions=packages/api/src/generated/**/*,servers/*/generated/**/*,apps/servers/*/generated/**/*
# apps/servers/*/generated/**/* is Prisma's generated client output under apps/servers (see
# servers/*/generated/**/* is Prisma's own generated client output (see
# packages/server/CLAUDE.md's Database section) — same "generated-only, never hand-edited"
# category as packages/api/src/generated above, just produced by Prisma's codegen instead of
# APIGenerator's. Excluded from scanning entirely, not just coverage, for the same reason.
# packages/script/src/release/** is release-automation tooling, not part of any server's runtime
# path — untested pre-existing debt, tracked separately from this release's actual coverage.
# frontends/*/tests/**/*.setup.ts is test infrastructure (rstest environment setup, e.g. the
# localStorage polyfill in a frontend's tests/rstest.setup.ts) rather than application code —
# rstest's own coverage config already only instruments src/, so these never appear in the lcov
# report at all; without this exclusion Sonar reports that absence as 0% instead of "not
# applicable", tanking new-code coverage on any PR that touches a setup file.
# turbo/generators/** is `turbo gen` scaffolding tooling (plop actions/prompts) — same category as
# packages/script/src/release above: no test runner wired up (not a workspace, not in any
# rstest.config.ts), untested pre-existing debt, not part of any server's runtime path.
sonar.coverage.exclusions=packages/api/src/generated/**/*,packages/script/src/release/**/*,frontends/*/tests/**/*.setup.ts,turbo/generators/**/*,apps/servers/*/index.ts,apps/servers/*/prisma.config.ts,apps/servers/*/src/app.ts,apps/servers/*/src/configs/**/*
sonar.cpd.exclusions=packages/api/src/generated/**/*
# No coverage report existed anywhere in CI before this — every touched line always showed 0%
# "New Code Coverage", regardless of real test coverage. Wires rstest's istanbul-lcov output
# (packages/server, packages/script, servers/auth — see each package's rstest.config.ts) into the
# scan so real coverage is reported instead.
sonar.javascript.lcov.reportPaths=packages/server/coverage/lcov.info,packages/script/coverage/lcov.info,servers/auth/coverage/lcov.info