# Every apps/servers/* chart shares this namespace — matches how every services/* chart shares
# "infra". A sibling "server-infra" namespace (Postgres/Redis/etc., Terraform-applied) exists too
# — see the "database" extension generator for how a server's own infra chart wires into it.
namespace: server-apps

# Dev default: one pod is enough for local iteration. values-prod.yaml layers on top for a real
# deploy — matches services/cert-manager-config/helm's values.yaml/values-prod.yaml pattern
# (`helm upgrade -f values.yaml -f values-prod.yaml`).
replicas: 1

# Where <name>-infra's Postgres actually lives — every hostname this chart's own
# templates reference for it has to be the fully-qualified cross-namespace form
# (<name>-db.{{ .Values.infraNamespace }}.svc.cluster.local), not the bare in-namespace
# name that would work if everything shared one chart/namespace.
infraNamespace: server-infra
