{{- $dbSecret := lookup "v1" "Secret" .Release.Namespace "server1-grpc-db-secret" }}
{{- $dbPassword := randAlphaNum 32 }}
{{- if $dbSecret }}
{{- $dbPassword = index $dbSecret.data "password" | b64dec }}
{{- else if .Values.dbPassword }}
# Tilt override (see Tiltfile's set=["dbPassword=..."]) — `lookup` above always returns nothing
# under Tilt's own "offline-only" helm() (no live cluster access at all), so without this, every
# single Tiltfile reconcile would mint a *new* random password here while server1-grpc-db's own pod
# (fixed at its last boot) keeps whatever it already has. A real `helm install`/Terraform never
# sets this, so it still gets a real random password there, correctly reused via `lookup` on
# every later `helm upgrade`.
{{- $dbPassword = .Values.dbPassword }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server1-grpc-db
  namespace: {{ .Values.namespace }}
  labels:
    app: server1-grpc-db
spec:
  # Always 1 — a second replica would each get its own volume and diverge into two separate
  # databases, not a real HA setup. Local/testing Postgres, same scope as every other
  # single-instance infra chart in this repo.
  replicas: 1
  selector:
    matchLabels:
      app: server1-grpc-db
  template:
    metadata:
      labels:
        app: server1-grpc-db
    spec:
      # Postgres's image runs as a non-root uid (999) — matches every other bundled-Postgres
      # chart in this repo (see services/authentik/helm/values.yaml's volumePermissions comment)
      # so the default root-owned volume is actually writable by it.
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:15.3-alpine
          # wal_level=logical + a replication slot/sender — required for Debezium Server's
          # pgoutput plugin to stream this database's WAL at all. Args only (no `command:`
          # override) so docker-entrypoint.sh's init logic still runs.
          args:
            - "-c"
            - "wal_level=logical"
            - "-c"
            - "max_replication_slots=4"
            - "-c"
            - "max_wal_senders=4"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: myuser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: server1-grpc-db-secret
                  key: password
            - name: POSTGRES_DB
              value: server1-grpc
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "myuser", "-d", "server1-grpc"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 15
            periodSeconds: 20
        # Sidecar, not a separate Deployment — connects over localhost inside the same pod's
        # network namespace, so it needs no Service of its own and can't outlive the Postgres
        # it's scraping. Scraped by Prometheus's own static_configs (see
        # services/monitoring/config/prometheus.yml) via this Deployment's Service on the
        # "metrics" port below.
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          env:
            # POSTGRES_PASSWORD must come first — k8s only expands $(VAR) references against
            # env vars already defined earlier in this same list.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: server1-grpc-db-secret
                  key: password
            - name: DATA_SOURCE_NAME
              value: postgresql://myuser:$(POSTGRES_PASSWORD)@localhost:5432/server1-grpc?sslmode=disable
          ports:
            - name: metrics
              containerPort: 9187
      # ponytail: emptyDir, not a PersistentVolumeClaim — this is a per-server dev/test database,
      # losing data on pod restart is fine. Switch to a PVC (see git history's
      # templates/database/helm/postgres-pvc.yaml for the old shape) if that stops being true.
      volumes:
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: server1-grpc-db
  namespace: {{ .Values.namespace }}
  labels:
    app: server1-grpc-db
spec:
  # ClusterIP — the app chart's own Deployment/migrate Job (a different namespace now, see
  # server1-grpc-app's own values.yaml infraNamespace), Vault (services/vault, its own database
  # secrets engine config), and Prometheus (a different namespace, scraping "metrics" below) all
  # reach this cross-namespace via its fully-qualified DNS name.
  type: ClusterIP
  selector:
    app: server1-grpc-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
    - name: metrics
      port: 9187
      targetPort: metrics

---
# The Postgres superuser's own password — read by the postgres container above and by
# db-provision-job.yaml's vault write database/config/... (admin creds Vault uses to mint leaf
# roles). Randomly generated on first `helm install` (see the `lookup`/`randAlphaNum` block at
# the top of this file) and kept stable across every later `helm upgrade` — `lookup` reads this
# same Secret's already-set password back instead of minting a fresh one on every render, which
# would otherwise silently break Postgres/Vault's already-established credential each upgrade.
# Only works against a real cluster: `helm template`/`--dry-run` always see `lookup` return
# nothing, so those always take the "generate new" branch instead — expected, not a bug.
apiVersion: v1
kind: Secret
metadata:
  name: server1-grpc-db-secret
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  password: {{ $dbPassword | b64enc }}
