# One Debezium Server process captures server1-grpc-db only — not a shared Kafka Connect cluster
# (see root CLAUDE.md's CDC note). Lives in server1-grpc's own infra chart, next to db.yaml, as
# its own Deployment so it restarts/redeploys independently.
apiVersion: v1
kind: ConfigMap
metadata:
  name: server1-grpc-debezium-config
  namespace: {{ .Values.namespace }}
data:
  application.properties: |
    debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
    debezium.source.plugin.name=pgoutput
    # Underscore, not "server1-grpc" (the server's own hyphenated name): a replication slot name
    # is restricted by Postgres to [a-zA-Z0-9_]+ (rejected outright, no quoting escape hatch),
    # and an unquoted publication name with a hyphen fails to parse in the initContainer's raw
    # CREATE PUBLICATION SQL below (parsed as subtraction) — confirmed the hard way after the
    # server1 -> server1-grpc rename.
    debezium.source.slot.name=server1_grpc_debezium
    debezium.source.publication.name=server1_grpc_debezium
    debezium.source.database.hostname=server1-grpc-db
    debezium.source.database.port=5432
    debezium.source.database.user=myuser
    # ${DB_PASSWORD} — Quarkus/MicroProfile Config's own env var substitution (Debezium Server is
    # built on Quarkus), not Handlebars/Helm templating. Reads the Deployment's DB_PASSWORD env
    # var (below) at container start, rather than this file re-deriving server1-grpc-db-secret's
    # password itself — that Secret's value is only decided once, in db.yaml's own
    # lookup/randAlphaNum block; a second independent lookup here (a different template file,
    # rendered in the same Helm pass) could return empty and mint a *different* random password
    # than db.yaml already assigned to the running Postgres.
    debezium.source.database.password=${DB_PASSWORD}
    debezium.source.database.dbname=server1-grpc
    debezium.source.table.include.list=public.Item
    debezium.source.topic.prefix=server1-grpc
    debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
    debezium.source.database.history.file.filename=/debezium/data/history.dat
    debezium.sink.type=kafka
    debezium.sink.kafka.producer.bootstrap.servers=kafka.infra.svc.cluster.local:9092
    debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
    debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server1-grpc-debezium
  namespace: {{ .Values.namespace }}
  labels:
    app: server1-grpc-debezium
spec:
  # Always 1 — a replication slot is single-consumer; a second replica would just fight the
  # first one over the same slot.
  replicas: 1
  selector:
    matchLabels:
      app: server1-grpc-debezium
  template:
    metadata:
      labels:
        app: server1-grpc-debezium
    spec:
      # Creates the publication pgoutput needs (Debezium creates the replication slot itself but
      # not this) — deliberately NOT a docker-entrypoint-initdb.d script on server1-grpc-db's own
      # Postgres container: initdb scripts run once, at Postgres's very first boot, before the
      # app chart's server1-grpc-migrate Job (a different chart/namespace now, Tilt-owned) has
      # any chance to create the Item table, so `CREATE PUBLICATION ... FOR TABLE` there fails
      # every time against a table that doesn't exist yet. Runs here instead, guarded idempotent
      # (checks pg_publication first) since this Deployment restarts — if this chart (Terraform)
      # applies before the app chart's migrate Job (Tilt) has ever run, this initContainer just
      # crash-loops until the table shows up, no explicit cross-chart ordering needed.
      # Double-quoted "Item" below, not bare item: the Prisma model has no @@map, so Prisma keeps
      # its exact model-name casing ("Item") as the real Postgres table name — an unquoted
      # identifier folds to lowercase and silently stops matching it.
      initContainers:
        - name: create-publication
          image: postgres:15.3-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: server1-grpc-db-secret
                  key: password
          command:
            - sh
            - -c
            - |
              set -e
              until pg_isready -h server1-grpc-db -p 5432 -U myuser; do sleep 2; done
              EXISTS=$(psql -h server1-grpc-db -U myuser -d server1-grpc -tAc \
                "SELECT 1 FROM pg_publication WHERE pubname = 'server1_grpc_debezium'")
              if [ "$EXISTS" != "1" ]; then
                psql -h server1-grpc-db -U myuser -d server1-grpc -c \
                  "CREATE PUBLICATION server1_grpc_debezium FOR TABLE public.\"Item\";"
              fi
      containers:
        - name: debezium-server
          image: debezium/server:2.7.3.Final
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: server1-grpc-db-secret
                  key: password
          volumeMounts:
            - name: config
              mountPath: /debezium/conf
            # ponytail: emptyDir offset/history storage — restart replays from the last
            # committed Kafka offset via the slot, fine for dev. Switch to a PVC if a pod
            # restart losing in-flight (uncommitted) position ever actually matters.
            - name: data
              mountPath: /debezium/data
      volumes:
        - name: config
          configMap:
            name: server1-grpc-debezium-config
        - name: data
          emptyDir: {}
