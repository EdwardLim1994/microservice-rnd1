# Own namespace, separate from server1-grpc's app chart (server1-grpc-app) — this chart is
# deploy-once (Terraform-applied), the app chart is Tilt-iterated. See root-level comment in
# apps/terraform/main.tf for why both namespaces are created there, not by either chart.
namespace: server1-grpc-infra

# Where the app chart's own Deployment/Secret live — db-provision-job.yaml/redis-provision-job.yaml
# patch DATABASE_URL/REDIS_URL and roll the Deployment there on every credential rotation, so this
# chart's own ServiceAccount needs a Role/RoleBinding scoped into that namespace too, not just its
# own. See those templates' own header comments for the full cross-namespace RBAC shape.
appNamespace: server1-grpc-app

# Empty by default — db.yaml's Postgres superuser password falls back to a `lookup` of the
# already-set value (real `helm install`/Terraform) or a fresh `randAlphaNum` on first install.
# Tilt's own helm() has no live cluster access at all, so `lookup` always returns nothing there —
# set this via Tiltfile's set=["dbPassword=..."] to get a value that stays stable across every
# Tilt reconcile instead of drifting on every single one. The app chart's own values.yaml must be
# given the exact same override (its own bootstrap Secret construction does the same lookup
# against THIS chart's Secret, in THIS chart's namespace) — see that chart's values.yaml.
dbPassword: ""

# See helm/templates/db-provision-job.yaml + helm/files/db-provision.sh — the Vault dynamic
# Postgres role minted for the app's own Deployment.
dbProvision:
  # How often the CronJob re-mints creds. Keep this comfortably inside defaultTtl (a 6h poll
  # against a 24h TTL means several missed runs in a row before a lease is ever actually at risk
  # of expiring) — this is what keeps a long-running pod's DB credential from expiring out from
  # under it in both dev and prod (dev-mode Vault also loses all lease state on every restart).
  schedule: "0 */6 * * *"
  defaultTtl: "24h"
  maxTtl: "720h"

# Empty by default — redis.yaml's admin password falls back to a `lookup` of the already-set
# value (real `helm install`/Terraform) or a fresh `randAlphaNum` on first install. Same Tilt
# override reasoning as dbPassword above.
redisPassword: ""

# See helm/templates/redis-provision-job.yaml + helm/files/redis-provision.sh — the Vault
# dynamic Redis ACL user minted for the app's own Deployment. Same shape as dbProvision.
redisProvision:
  schedule: "0 */6 * * *"
  defaultTtl: "24h"
  maxTtl: "720h"
