apiVersion: v1
kind: ConfigMap
metadata:
  name: server2-graphql-graphql-env
  namespace: {{ .Values.namespace }}
data:
  GRAPHQL_PORT: "4002"
  SERVER2_GRPC_ADDRESS: server2-grpc.server-apps.svc.cluster.local:5002
  OTEL_SERVICE_NAME: server2-graphql
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.infra.svc.cluster.local:4317

---
# Stable in-cluster DNS (server2-graphql, or server2-graphql.{{ .Values.namespace }}.svc.cluster.local
# from another namespace) — for the Apollo Router supergraph's routing_url once this subgraph is
# registered (see appendSupergraphSubgraph), or for manual testing — nothing else in this chart
# provides one.
apiVersion: v1
kind: Service
metadata:
  name: server2-graphql
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: server2-graphql
  ports:
    - name: graphql
      port: 4002
      targetPort: 4002
    - name: healthcheck
      port: 9000
      targetPort: 9000
