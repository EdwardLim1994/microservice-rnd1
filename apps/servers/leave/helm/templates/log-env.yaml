apiVersion: v1
kind: ConfigMap
metadata:
  name: leave-log-env
  namespace: {{ .Values.namespace }}
data:
  OTEL_SERVICE_NAME: leave
  # Fully-qualified — services/kafka lives in the "infra" namespace, a different one than this
  # server's own "server-apps". LoggerPlugin
  # (packages/server) reads this to publish every log.info()/warn()/error() call onto Kafka's
  # shared "log-events" topic — see LoggerPlugin's own header comment for why this exists
  # alongside, not instead of, Alloy's container-log tailing. No consumer currently reads this
  # topic (the previous one, apps/servers/log-collector, was removed).
  KAFKA_BROKERS: kafka.infra.svc.cluster.local:9092
