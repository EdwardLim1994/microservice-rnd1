syntax = "proto3";

package leave;

import "google/protobuf/timestamp.proto";

enum LeaveType {
  ANNUAL = 0;
  SICK = 1;
  UNPAID = 2;
}

enum LeaveStatus {
  PENDING = 0;
  APPROVED = 1;
  REJECTED = 2;
}

message LeaveRequest {
  string id = 1;
  string employee_id = 2;
  LeaveType leave_type = 3;
  google.protobuf.Timestamp start_date = 4;
  google.protobuf.Timestamp end_date = 5;
  int32 days = 6;
  LeaveStatus status = 7;
  // Days that exceeded balance and were converted to unpaid leave
  int32 unpaid_days = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message LeaveBalance {
  string employee_id = 1;
  int32 annual_remaining = 2;
  int32 sick_remaining = 3;
}

message SubmitLeaveRequest {
  string employee_id = 1;
  LeaveType leave_type = 2;
  google.protobuf.Timestamp start_date = 3;
  google.protobuf.Timestamp end_date = 4;
}

message SubmitLeaveResponse {
  LeaveRequest leave_request = 1;
  LeaveBalance balance = 2;
}

message ReviewLeaveRequest {
  string leave_request_id = 1;
  string reviewer_id = 2;
  LeaveStatus decision = 3;
}

message ReviewLeaveResponse {
  LeaveRequest leave_request = 1;
}

message GetLeaveBalanceRequest {
  string employee_id = 1;
}

message ListLeaveRequestsRequest {
  optional string employee_id = 1;
  optional string reviewer_id = 2;
  optional LeaveStatus status = 3;
  optional int32 page = 4;
  optional int32 page_size = 5;
}

message ListLeaveRequestsResponse {
  repeated LeaveRequest leave_requests = 1;
  int32 total = 2;
}

// Used by payroll to compute monthly deductions
message GetUnpaidLeaveDaysRequest {
  string employee_id = 1;
  int32 year = 2;
  int32 month = 3;
}

message GetUnpaidLeaveDaysResponse {
  string employee_id = 1;
  int32 unpaid_days = 2;
}

service LeaveService {
  rpc SubmitLeave(SubmitLeaveRequest) returns (SubmitLeaveResponse);
  rpc ReviewLeave(ReviewLeaveRequest) returns (ReviewLeaveResponse);
  rpc GetLeaveBalance(GetLeaveBalanceRequest) returns (LeaveBalance);
  rpc ListLeaveRequests(ListLeaveRequestsRequest) returns (ListLeaveRequestsResponse);
  rpc GetUnpaidLeaveDays(GetUnpaidLeaveDaysRequest) returns (GetUnpaidLeaveDaysResponse);
}
