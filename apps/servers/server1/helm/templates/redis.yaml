apiVersion: apps/v1
kind: Deployment
metadata:
  name: server1-redis
  labels:
    app: server1-redis
spec:
  # Always 1 — dev cache, not HA. Same scope as server1-db.
  replicas: 1
  selector:
    matchLabels:
      app: server1-redis
  template:
    metadata:
      labels:
        app: server1-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: server1-redis
  labels:
    app: server1-redis
spec:
  type: ClusterIP
  selector:
    app: server1-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis

---
# Consumed via envFrom by this chart's own deployment.yaml. Bun's RedisClient() reads REDIS_URL
# when constructed with no args (see RedisPlugin.createBunRedisClient).
apiVersion: v1
kind: ConfigMap
metadata:
  name: server1-redis-env
data:
  REDIS_URL: redis://server1-redis:6379
