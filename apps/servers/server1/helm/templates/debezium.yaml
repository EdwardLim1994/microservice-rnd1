# One Debezium Server process captures server1-db only — not a shared Kafka Connect cluster
# (see root CLAUDE.md's CDC note). Lives in server1's own chart, next to db.yaml, but as its own
# Deployment so it restarts/redeploys independently of the app container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: server1-debezium-config
  namespace: {{ .Values.namespace }}
data:
  application.properties: |
    debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
    debezium.source.plugin.name=pgoutput
    debezium.source.slot.name=server1_debezium
    debezium.source.publication.name=server1_debezium
    debezium.source.database.hostname=server1-db
    debezium.source.database.port=5432
    debezium.source.database.user=myuser
    # ${DB_PASSWORD} — Quarkus/MicroProfile Config's own env var substitution (Debezium Server is
    # built on Quarkus), not Handlebars/Helm templating. Reads the Deployment's DB_PASSWORD env
    # var (below) at container start, rather than this file re-deriving server1-db-secret's
    # password itself — that Secret's value is only decided once, in db.yaml.hbs's own
    # lookup/randAlphaNum block; a second independent lookup here (a different template file,
    # rendered in the same Helm pass) could return empty and mint a *different* random password
    # than db.yaml.hbs already assigned to the running Postgres.
    debezium.source.database.password=${DB_PASSWORD}
    debezium.source.database.dbname=server1
    debezium.source.table.include.list=public.Item
    debezium.source.topic.prefix=server1
    debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
    debezium.source.database.history.file.filename=/debezium/data/history.dat
    debezium.sink.type=kafka
    debezium.sink.kafka.producer.bootstrap.servers=kafka.infra.svc.cluster.local:9092
    debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
    debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server1-debezium
  namespace: {{ .Values.namespace }}
  labels:
    app: server1-debezium
spec:
  # Always 1 — a replication slot is single-consumer; a second replica would just fight the
  # first one over the same slot.
  replicas: 1
  selector:
    matchLabels:
      app: server1-debezium
  template:
    metadata:
      labels:
        app: server1-debezium
    spec:
      # Creates the publication pgoutput needs (Debezium creates the replication slot itself but
      # not this) — deliberately NOT a docker-entrypoint-initdb.d script on server1-db's own
      # Postgres container: initdb scripts run once, at Postgres's very first boot, before
      # server1-migrate (a separate k8s Job) has any chance to create the Item table, so
      # `CREATE PUBLICATION ... FOR TABLE` there fails every time against a table that doesn't
      # exist yet. Runs here instead, after server1-migrate is guaranteed done (see the
      # Tiltfile's own resource_deps=["server1-db", "server1-migrate"] on this Deployment) —
      # guarded idempotent (checks pg_publication first) since this Deployment restarts.
      # Double-quoted "Item" below, not bare item: the Prisma model has no @@map, so Prisma keeps
      # its exact model-name casing ("Item") as the real Postgres table name — an unquoted
      # identifier folds to lowercase and silently stops matching it.
      initContainers:
        - name: create-publication
          image: postgres:15.3-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: server1-db-secret
                  key: password
          command:
            - sh
            - -c
            - |
              set -e
              until pg_isready -h server1-db -p 5432 -U myuser; do sleep 2; done
              EXISTS=$(psql -h server1-db -U myuser -d server1 -tAc \
                "SELECT 1 FROM pg_publication WHERE pubname = 'server1_debezium'")
              if [ "$EXISTS" != "1" ]; then
                psql -h server1-db -U myuser -d server1 -c \
                  "CREATE PUBLICATION server1_debezium FOR TABLE public.\"Item\";"
              fi
      containers:
        - name: debezium-server
          image: debezium/server:2.7.3.Final
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: server1-db-secret
                  key: password
          volumeMounts:
            - name: config
              mountPath: /debezium/conf
            # ponytail: emptyDir offset/history storage — restart replays from the last
            # committed Kafka offset via the slot, fine for dev. Switch to a PVC if a pod
            # restart losing in-flight (uncommitted) position ever actually matters.
            - name: data
              mountPath: /debezium/data
      volumes:
        - name: config
          configMap:
            name: server1-debezium-config
        - name: data
          emptyDir: {}
