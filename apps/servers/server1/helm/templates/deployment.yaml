apiVersion: apps/v1
kind: Deployment
metadata:
  name: server1
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server1
  template:
    metadata:
      labels:
        app: server1
    spec:
      initContainers:
        - name: wait-for-server1-db
          image: postgres:15.3-alpine
          command: ["sh", "-c", "until pg_isready -h server1-db -p 5432 -U myuser; do sleep 2; done"]
        - name: wait-for-server1-redis
          image: redis:7-alpine
          command: ["sh", "-c", "until redis-cli -h server1-redis -p 6379 ping; do sleep 2; done"]
      containers:
        - name: server1
          image: server1:latest
          envFrom:
            - configMapRef:
                name: server1-env
            - secretRef:
                name: server1-secret
            - secretRef:
                name: server1-redis-secret
