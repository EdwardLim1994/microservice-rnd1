apiVersion: apps/v1
kind: Deployment
metadata:
  name: server1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server1
  template:
    metadata:
      labels:
        app: server1
    spec:
      containers:
        - name: server1
          image: server1:latest
          envFrom:
            - configMapRef:
                name: server1-env
            - configMapRef:
                name: server1-redis-env
