# Shared "server-apps" namespace — every server's app chart lands here (see
# apps/servers/Tiltfile's own Namespace declaration), separate from "server-infra"
# (postgres/Vault provisioning, Terraform-applied once). This chart is just the app
# Deployment/Service (+ its migrate Job), Tilt-iterated on every `tilt up`.
namespace: server-apps

# Where server2-grpc-infra's Postgres actually lives — every hostname this chart's own
# templates reference for it has to be the fully-qualified cross-namespace form
# (server2-grpc-db.{{ .Values.infraNamespace }}.svc.cluster.local), not the bare in-namespace
# name that worked back when everything shared one chart/namespace.
infraNamespace: server-infra

# Bootstrap-only password override, empty by default — env.yaml's server2-grpc-secret
# (DATABASE_URL) falls back to a `lookup` of server2-grpc-infra's real password Secret
# (cross-namespace — Helm's `lookup` takes an explicit namespace argument, not just the
# release's own). Tilt's own helm() has no live cluster access at all, so that `lookup` always
# returns nothing there — this chart's own Tiltfile instead reads the real, Terraform-generated
# password straight from the (already Terraform-applied) cluster via `kubectl get secret` and
# passes it as this override, since there's no fixed literal to fall back to (unlike a
# Tilt-only dev password, server2-grpc-infra's is a real random value minted by Terraform).
dbPassword: ""

# Dev default: one pod is enough for Tilt-driven local iteration. values-prod.yaml layers on
# top for a real deploy (`helm upgrade -f values.yaml -f values-prod.yaml`).
replicas: 1
