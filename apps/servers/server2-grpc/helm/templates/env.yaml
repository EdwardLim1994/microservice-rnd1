{{- $dbSecret := lookup "v1" "Secret" .Values.infraNamespace "server2-grpc-db-secret" }}
{{- $dbPassword := "" }}
{{- if $dbSecret }}
{{- $dbPassword = index $dbSecret.data "password" | b64dec }}
{{- else }}
{{- $dbPassword = .Values.dbPassword }}
{{- end }}
# Consumed via envFrom by this chart's own deployment.yaml and by server2-grpc-migrate below.
# DB_HOST/DB_PORT/DB_NAME only — DATABASE_URL itself lives in server2-grpc-secret (below), not
# here, since it holds Vault-minted credentials rather than a static value safe for a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: server2-grpc-env
  namespace: {{ .Values.namespace }}
data:
  # Fully-qualified — server2-grpc-db lives in server2-grpc-infra now, a different namespace.
  DB_HOST: server2-grpc-db.{{ .Values.infraNamespace }}.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: server2-grpc
  OTEL_SERVICE_NAME: server2-grpc
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.infra.svc.cluster.local:4317

---
# DATABASE_URL for the app's own Deployment (envFrom secretRef) — starts out pointing at
# server2-grpc-infra's real superuser creds (read via cross-namespace `lookup`, see the top of
# this file) so the app can still boot before server2-grpc-infra's db-provision-job.yaml
# post-install hook has run once; that hook immediately overwrites this key with Vault-minted
# leaf creds and rolls the Deployment. See that Job for the whole rotation story, and this
# chart's own values.yaml for why $dbPassword's fallback branch (Tilt, offline template) has to
# be kept in sync with server2-grpc-infra's own dbPassword override.
#
# ponytail: Tilt re-renders this Secret (guessed superuser creds, not the current Vault-minted
# ones) on every reconcile that touches this chart's own template files — server2-grpc-infra's
# db-provision-job only re-patches it on ITS OWN Terraform apply or its 6h CronJob, not on every
# `tilt up`. If DATABASE_URL looks stale after editing a chart template (not app code — that
# path uses live_update, never touches this file), manually re-run the provision Job:
# `kubectl create job --from=cronjob/server2-grpc-db-provision server2-grpc-db-provision-manual -n server-infra`
apiVersion: v1
kind: Secret
metadata:
  name: server2-grpc-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: postgresql://myuser:{{ $dbPassword }}@server2-grpc-db.{{ .Values.infraNamespace }}.svc.cluster.local:5432/server2-grpc

---
apiVersion: batch/v1
kind: Job
metadata:
  # A Job's spec is immutable, and ttlSecondsAfterFinished (below) only deletes it *after* it
  # finishes — a re-trigger issued while a still-in-flight Job from a previous run is retrying
  # (backoffLimit) still needs it deleted first (`kubectl delete job server2-grpc-migrate`), or
  # the apply fails trying to update a field it can't change in place. Doesn't come up in the
  # normal case (Job already finished and TTL-cleaned itself up by the time you re-trigger).
  name: server2-grpc-migrate
  namespace: {{ .Values.namespace }}
  labels:
    app: server2-grpc-migrate
spec:
  # backoffLimit is a safety net for transient failures after Postgres is up — the
  # initContainer below is what guards the fresh-cluster race: Postgres's readinessProbe gates
  # whether its Service has any endpoints at all, so without it, connections here fail outright
  # (no queueing) and can exhaust these retries before Postgres's first-time initdb finishes.
  backoffLimit: 6
  # Runs once — Prisma's own migration-history table already makes re-runs a no-op, but the
  # point here is Job hygiene: without this, a completed Job sits around forever (immutable spec,
  # blocks any future `kubectl apply`/Tilt reconcile of the same name until manually deleted).
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app: server2-grpc-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Fully-qualified — server2-grpc-db lives in server2-grpc-infra now, a different
        # namespace than this Job's own.
        - name: wait-for-server2-grpc-db
          image: postgres:15.3-alpine
          command: ["sh", "-c", "until pg_isready -h server2-grpc-db.{{ .Values.infraNamespace }}.svc.cluster.local -p 5432 -U myuser; do sleep 2; done"]
      containers:
        - name: migrate
          image: server2-grpc-migrate
          env:
            # Fully-qualified — server2-grpc-db lives in server2-grpc-infra now.
            - name: DATABASE_URL
              value: postgresql://myuser:{{ $dbPassword }}@server2-grpc-db.{{ .Values.infraNamespace }}.svc.cluster.local:5432/server2-grpc
