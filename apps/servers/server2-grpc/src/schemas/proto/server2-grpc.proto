syntax = "proto3";

package server2_grpc;

message Item2 {
  string id = 1;
  string name = 2;
  string itemId = 3;
  string createdAt = 4;
}

message GetItem2Request {
  string id = 1;
}

message CreateItem2Request {
  string name = 1;
  string itemId = 2;
}

message UpdateItem2Request {
  string id = 1;
  string name = 2;
}

message DeleteItem2Request {
  string id = 1;
}

message DeleteItem2Response {
  bool success = 1;
}

message ListItem2sRequest {
}

message ListItem2sResponse {
  repeated Item2 item2s = 1;
}

// itemId here is server1's Item id — lists every Item2 that belongs to that Item, backing the
// federated Item.item2s field (see server2-graphql's Item2GraphqlRouter).
message ListItem2sByItemRequest {
  string itemId = 1;
}

service Item2Service {
  rpc GetItem2 (GetItem2Request) returns (Item2);
  rpc CreateItem2 (CreateItem2Request) returns (Item2);
  rpc UpdateItem2 (UpdateItem2Request) returns (Item2);
  rpc DeleteItem2 (DeleteItem2Request) returns (DeleteItem2Response);
  rpc ListItem2s (ListItem2sRequest) returns (ListItem2sResponse);
  rpc ListItem2sByItem (ListItem2sByItemRequest) returns (ListItem2sResponse);
}
