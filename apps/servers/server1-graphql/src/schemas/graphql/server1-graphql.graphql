extend schema @link(url: "https://specs.apollo.dev/federation/v2.14", import: ["@key"])

type Item @key(fields: "id") {
  id: ID!
  name: String!
  createdAt: String!
}

type Query {
  item(id: ID!): Item
  items: [Item!]!
}

type Mutation {
  createItem(name: String!): Item!
  updateItem(id: ID!, name: String!): Item!
  deleteItem(id: ID!): Boolean!
}
