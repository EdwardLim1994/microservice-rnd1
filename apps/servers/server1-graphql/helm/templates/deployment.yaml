apiVersion: apps/v1
kind: Deployment
metadata:
  name: server1-graphql
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: server1-graphql
  template:
    metadata:
      labels:
        app: server1-graphql
    spec:
      containers:
        - name: server1-graphql
          image: server1-graphql:latest
          ports:
            - containerPort: 4001
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: server1-graphql-env

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: server1-graphql-env
  namespace: {{ .Values.namespace }}
data:
  GRAPHQL_PORT: "4001"
  OTEL_SERVICE_NAME: server1-graphql
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.infra.svc.cluster.local:4317
  # Fully-qualified, even though server1-grpc shares this same "server-apps" namespace now — a
  # bare "server1-grpc" would resolve fine too, but the FQDN form stays unambiguous if that ever
  # changes again.
  ITEM_GRPC_ADDRESS: server1-grpc.server-apps.svc.cluster.local:5001

---
# Stable in-cluster DNS for anything that needs to reach this gateway directly (Apollo Router's
# supergraph once server1-graphql is registered there, or manual testing via port-forward).
apiVersion: v1
kind: Service
metadata:
  name: server1-graphql
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: server1-graphql
  ports:
    - name: graphql
      port: 4001
      targetPort: 4001
    - name: healthcheck
      port: 9000
      targetPort: 9000
