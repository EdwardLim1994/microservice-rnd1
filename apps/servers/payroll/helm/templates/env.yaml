{{- $dbSecret := lookup "v1" "Secret" .Values.infraNamespace "payroll-db-secret" }}
{{- $dbPassword := "" }}
{{- if $dbSecret }}
{{- $dbPassword = index $dbSecret.data "password" | b64dec }}
{{- end }}
# Consumed via envFrom by this chart's own deployment.yaml and by payroll-migrate below.
# DB_HOST/DB_PORT/DB_NAME only — DATABASE_URL itself lives in payroll-secret (below), not
# here, since it holds a real credential and belongs in a Secret, not a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: payroll-env
  namespace: {{ .Values.namespace }}
data:
  # Fully-qualified — payroll-db lives in payroll-infra now, a different namespace.
  DB_HOST: payroll-db.{{ .Values.infraNamespace }}.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: payroll

---
# DATABASE_URL for the app's own Deployment (envFrom secretRef) — built directly from
# payroll-infra's own static superuser password (read via cross-namespace `lookup`, see the
# top of this file). Static for the life of the deploy, same as every other DB credential in
# this repo (see services/terraform/variables.tf's authentik_postgres_password) — no rotation,
# no separate provisioning Job needed.
apiVersion: v1
kind: Secret
metadata:
  name: payroll-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: postgresql://myuser:{{ $dbPassword }}@payroll-db.{{ .Values.infraNamespace }}.svc.cluster.local:5432/payroll

---
apiVersion: batch/v1
kind: Job
metadata:
  # A Job's spec is immutable, and ttlSecondsAfterFinished (below) only deletes it *after* it
  # finishes — a re-trigger issued while a still-in-flight Job from a previous run is retrying
  # (backoffLimit) still needs it deleted first (`kubectl delete job payroll-migrate`), or
  # the apply fails trying to update a field it can't change in place. Doesn't come up in the
  # normal case (Job already finished and TTL-cleaned itself up by the time you re-trigger).
  name: payroll-migrate
  namespace: {{ .Values.namespace }}
  labels:
    app: payroll-migrate
spec:
  # backoffLimit is a safety net for transient failures after Postgres is up (migration
  # conflicts, brief network blips) — the initContainer below (wired by
  # DatabaseGenerator.ts's injectDatabaseEnvYaml action) is what actually guards the
  # fresh-cluster race: Postgres's own readinessProbe gates whether its Service has any
  # endpoints at all, so without it, connections here fail outright (no queueing) and can
  # exhaust these retries before Postgres's first-time initdb ever finishes.
  backoffLimit: 6
  # Runs once — Prisma's own migration-history table already makes re-runs a no-op, but the
  # point here is Job hygiene: without this, a completed Job sits around forever (immutable spec,
  # blocks any future `kubectl apply`/`helm upgrade` of the same name until manually deleted).
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app: payroll-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-payroll-db
          image: postgres:15.3-alpine
          command: ["sh", "-c", "until pg_isready -h payroll-db.{{ .Values.infraNamespace }}.svc.cluster.local -p 5432 -U myuser; do sleep 2; done"]
          resources:
            limits:
              memory: 64Mi
      containers:
        - name: migrate
          image: payroll-migrate
          resources:
            limits:
              memory: 256Mi
          env:
            # Fully-qualified — payroll-db lives in payroll-infra now.
            - name: DATABASE_URL
              value: postgresql://myuser:{{ $dbPassword }}@payroll-db.{{ .Values.infraNamespace }}.svc.cluster.local:5432/payroll
