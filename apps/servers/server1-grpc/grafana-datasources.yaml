apiVersion: 1

# Direct query access (SQL Explore / Redis command console in Grafana), separate from the
# postgres-exporter/redis-exporter Prometheus metrics already wired in
# apps/servers/server1-grpc-infra/helm/templates/db.yaml/redis.yaml — this lets you run ad-hoc
# queries against the actual data, not just point-in-time gauges.
#
# ponytail: password values below are stale placeholders, not live credentials — since
# server1-grpc-infra split out into its own Terraform-applied chart, its superuser/admin
# passwords are real random values generated at `terraform apply` time
# (apps/servers/server1-grpc-infra/helm/templates/db.yaml's `randAlphaNum 32`), not a fixed
# literal this file can hardcode anymore (the old same-chart Tiltfile literal these used to match
# no longer exists). Explore/command-console access here will 401 until fixed. Upgrade path: turn
# this file into a Helm template with a `lookup` into server1-grpc-infra's own
# server1-grpc-db-secret/server1-grpc-redis-admin-secret (same pattern as
# apps/servers/server1-grpc/helm/templates/env.yaml), or pull the password from Vault directly.
datasources:
  - name: server1-grpc Postgres
    uid: server1-grpc-postgres
    # Canonical plugin id, not the deprecated "postgres" alias — provisioning with the alias
    # resolves fine for display/queries but leaves the resource client (table/schema dropdown in
    # the query builder) unwired, "[plugin.notImplemented] method not implemented".
    type: grafana-postgresql-datasource
    access: proxy
    url: server1-grpc-db.server1-grpc-infra.svc.cluster.local:5432
    database: server1-grpc
    user: myuser
    editable: false
    jsonData:
      sslmode: disable
      postgresVersion: 1500
    secureJsonData:
      password: server1-grpc-tilt-local-dev-db-password

  - name: server1-grpc Redis
    uid: server1-grpc-redis
    # Requires the redis-datasource plugin (not built into Grafana core, unlike postgres) — see
    # grafana-statefulset.yaml's GF_INSTALL_PLUGINS.
    type: redis-datasource
    access: proxy
    url: redis://server1-grpc-redis.server1-grpc-infra.svc.cluster.local:6379
    editable: false
    jsonData:
      client: standalone
    secureJsonData:
      password: server1-grpc-tilt-local-dev-redis-password
