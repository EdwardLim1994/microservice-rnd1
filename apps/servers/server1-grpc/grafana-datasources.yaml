apiVersion: 1

# Direct query access (SQL Explore / Redis command console in Grafana), separate from the
# postgres-exporter/redis-exporter Prometheus metrics already wired in db.yaml/redis.yaml — this
# lets you run ad-hoc queries against the actual data, not just point-in-time gauges. Password
# values here match this repo's own established dev-secret convention (see e.g.
# services/authentik/helm/values.yaml's *OidcClientSecret comments): plain, duplicated by hand,
# fine for local dev — must match this server's own Tiltfile `set=["dbPassword=...",
# "redisPassword=..."]` literals, which are each role's stable superuser/admin password (not the
# Vault-rotated leaf creds db-provision-job.yaml/redis-provision-job.yaml mint for the app's own
# DATABASE_URL/REDIS_URL — those rotate, this doesn't).
datasources:
  - name: server1-grpc Postgres
    uid: server1-grpc-postgres
    # Canonical plugin id, not the deprecated "postgres" alias — provisioning with the alias
    # resolves fine for display/queries but leaves the resource client (table/schema dropdown in
    # the query builder) unwired, "[plugin.notImplemented] method not implemented".
    type: grafana-postgresql-datasource
    access: proxy
    url: server1-grpc-db.servers.svc.cluster.local:5432
    database: server1-grpc
    user: myuser
    editable: false
    jsonData:
      sslmode: disable
      postgresVersion: 1500
    secureJsonData:
      password: server1-grpc-tilt-local-dev-db-password

  - name: server1-grpc Redis
    uid: server1-grpc-redis
    # Requires the redis-datasource plugin (not built into Grafana core, unlike postgres) — see
    # grafana-statefulset.yaml's GF_INSTALL_PLUGINS.
    type: redis-datasource
    access: proxy
    url: redis://server1-grpc-redis.servers.svc.cluster.local:6379
    editable: false
    jsonData:
      client: standalone
    secureJsonData:
      password: server1-grpc-tilt-local-dev-redis-password
