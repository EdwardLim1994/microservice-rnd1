# Shared "server-apps" namespace — every server's app chart lands here (see
# apps/servers/Tiltfile's own Namespace declaration), separate from "server-infra"
# (postgres/redis/debezium/Vault provisioning, Terraform-applied once). This chart is just the
# app Deployment/Service (+ its migrate Job), Tilt-iterated on every `tilt up`. See
# apps/terraform/main.tf for why both namespaces are created there, not by either chart.
namespace: server-apps

# Where server1-grpc-infra's Postgres/Redis actually live — every hostname this chart's own
# templates reference for them has to be the fully-qualified cross-namespace form
# (server1-grpc-db.{{ .Values.infraNamespace }}.svc.cluster.local), not the bare in-namespace
# name that worked back when everything shared one chart/namespace.
infraNamespace: server-infra

# Bootstrap-only password overrides, empty by default — env.yaml's server1-grpc-secret/
# server1-grpc-redis-secret (DATABASE_URL/REDIS_URL) fall back to a `lookup` of
# server1-grpc-infra's real password Secrets (cross-namespace — Helm's `lookup` takes an explicit
# namespace argument, not just the release's own). Tilt's own helm() has no live cluster access
# at all, so `lookup` always returns nothing there — set these via Tiltfile's
# set=["dbPassword=...", "redisPassword=..."] to the exact same literals server1-grpc-infra's own
# db.yaml/redis.yaml use, or every Tilt-triggered re-render of this chart resets
# DATABASE_URL/REDIS_URL to a guessed value that doesn't match the real Postgres/Redis password.
dbPassword: ""
redisPassword: ""

# Dev default: one pod is enough for Tilt-driven local iteration. values-prod.yaml layers on
# top for a real deploy (`helm upgrade -f values.yaml -f values-prod.yaml`).
replicas: 1
