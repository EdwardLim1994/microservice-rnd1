apiVersion: apps/v1
kind: Deployment
metadata:
  name: server1-grpc
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server1-grpc
  template:
    metadata:
      labels:
        app: server1-grpc
    spec:
      initContainers:
        # Fully-qualified, not bare "server1-grpc-db"/"server1-grpc-redis" — both live in
        # server-infra now, a different namespace than this Deployment's own.
        - name: wait-for-server1-grpc-db
          image: postgres:15.3-alpine
          command: ["sh", "-c", "until pg_isready -h server1-grpc-db.{{ .Values.infraNamespace }}.svc.cluster.local -p 5432 -U myuser; do sleep 2; done"]
        - name: wait-for-server1-grpc-redis
          image: redis:7-alpine
          command: ["sh", "-c", "until redis-cli -h server1-grpc-redis.{{ .Values.infraNamespace }}.svc.cluster.local -p 6379 ping; do sleep 2; done"]
      containers:
        - name: server1-grpc
          image: server1-grpc:latest
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: server1-grpc-env
            - secretRef:
                name: server1-grpc-secret
            - secretRef:
                name: server1-grpc-redis-secret

---
# Stable in-cluster DNS (server1-grpc.server-apps.svc.cluster.local, or bare "server1-grpc"
# from within this same namespace) for other servers — e.g. server1-graphql's gRPC client, now
# using the fully-qualified form since it lives in a different namespace ("servers") — to reach
# this Deployment's gRPC port.
apiVersion: v1
kind: Service
metadata:
  name: server1-grpc
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: server1-grpc
  ports:
    - name: grpc
      port: 5001
      targetPort: 5001
