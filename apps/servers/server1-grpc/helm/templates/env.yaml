{{- $dbSecret := lookup "v1" "Secret" .Values.infraNamespace "server1-grpc-db-secret" }}
{{- $dbPassword := "" }}
{{- if $dbSecret }}
{{- $dbPassword = index $dbSecret.data "password" | b64dec }}
{{- else }}
{{- $dbPassword = .Values.dbPassword }}
{{- end }}
{{- $redisSecret := lookup "v1" "Secret" .Values.infraNamespace "server1-grpc-redis-admin-secret" }}
{{- $redisPassword := "" }}
{{- if $redisSecret }}
{{- $redisPassword = index $redisSecret.data "password" | b64dec }}
{{- else }}
{{- $redisPassword = .Values.redisPassword }}
{{- end }}
# Consumed via envFrom by this chart's own deployment.yaml and by server1-grpc-migrate below.
# DB_HOST/DB_PORT/DB_NAME only — DATABASE_URL itself lives in server1-grpc-secret (below), not
# here, since it holds Vault-minted credentials rather than a static value safe for a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: server1-grpc-env
  namespace: {{ .Values.namespace }}
data:
  # Fully-qualified — server1-grpc-db lives in server-infra now, a different namespace.
  DB_HOST: server1-grpc-db.{{ .Values.infraNamespace }}.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: server1-grpc
  GRPC_PORT: "5001"
  OTEL_SERVICE_NAME: server1-grpc
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.infra.svc.cluster.local:4317
  # services/kafka + services/apicurio-registry (see services/kafka/helm/templates/kafka-ui.yaml
  # for the same host convention) — producer only, no KAFKA_GROUP_ID needed.
  KAFKA_BROKERS: kafka.infra.svc.cluster.local:9092
  KAFKA_CLIENT_ID: server1-grpc
  SCHEMA_REGISTRY_URL: http://apicurio-registry.infra.svc.cluster.local:8080/apis/ccompat/v7

---
# DATABASE_URL for the app's own Deployment (envFrom secretRef) — starts out pointing at
# server-infra's real superuser creds (read via cross-namespace `lookup`, see the top of
# this file) so the app can still boot before server-infra's db-provision-job.yaml
# post-install hook has run once; that hook immediately overwrites this key with Vault-minted
# leaf creds and rolls the Deployment. See that Job for the whole rotation story, and this
# chart's own values.yaml for why $dbPassword's fallback branch (Tilt, offline template) has to
# be kept in sync with server-infra's own dbPassword override.
#
# ponytail: Tilt re-renders this Secret (guessed superuser creds, not the current Vault-minted
# ones) on every reconcile that touches this chart's own template files — server-infra's
# db-provision-job only re-patches it on ITS OWN Terraform apply or its 6h CronJob, not on every
# `tilt up`. If DATABASE_URL/REDIS_URL look stale after editing a chart template (not app code —
# that path uses live_update, never touches this file), manually re-run the provision Job:
# `kubectl create job --from=cronjob/server1-grpc-db-provision server1-grpc-db-provision-manual -n server-infra`
# (swap in redis-provision for REDIS_URL). Upgrade path if this bites often: move the rotation
# trigger to something that watches this Secret instead of Helm hooks.
apiVersion: v1
kind: Secret
metadata:
  name: server1-grpc-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: postgresql://myuser:{{ $dbPassword }}@server1-grpc-db.{{ .Values.infraNamespace }}.svc.cluster.local:5432/server1-grpc

---
# REDIS_URL for the app's own Deployment (envFrom secretRef) — same bootstrap-then-rotate story
# as server1-grpc-secret above, via server-infra's redis-provision-job.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: server1-grpc-redis-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  REDIS_URL: redis://default:{{ $redisPassword }}@server1-grpc-redis.{{ .Values.infraNamespace }}.svc.cluster.local:6379

---
apiVersion: batch/v1
kind: Job
metadata:
  # A Job's spec is immutable, and ttlSecondsAfterFinished (below) only deletes it *after* it
  # finishes — a re-trigger issued while a still-in-flight Job from a previous run is retrying
  # (backoffLimit) still needs it deleted first (`kubectl delete job server1-grpc-migrate`), or
  # the apply fails trying to update a field it can't change in place. Doesn't come up in the
  # normal case (Job already finished and TTL-cleaned itself up by the time you re-trigger).
  name: server1-grpc-migrate
  namespace: {{ .Values.namespace }}
  labels:
    app: server1-grpc-migrate
spec:
  # Postgres's own readinessProbe gates whether its Service has any endpoints at all — until it
  # does, connections here just fail outright rather than queueing, so this Job relies on
  # backoffLimit's retries (with backoff) rather than an initContainer wait-loop.
  backoffLimit: 6
  # Runs once — Prisma's own migration-history table already makes re-runs a no-op, but the
  # point here is Job hygiene: without this, a completed Job sits around forever (immutable spec,
  # blocks any future `kubectl apply`/Tilt reconcile of the same name until manually deleted).
  # 60s is enough to `kubectl logs`/`get pods` it right after triggering; the k8s TTL controller
  # (always-on since 1.23, no feature gate needed) deletes the Job *and* its Pod once that
  # elapses.
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app: server1-grpc-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: server1-grpc-migrate
          env:
            # Fully-qualified — server1-grpc-db lives in server-infra now.
            - name: DATABASE_URL
              value: postgresql://myuser:{{ $dbPassword }}@server1-grpc-db.{{ .Values.infraNamespace }}.svc.cluster.local:5432/server1-grpc
