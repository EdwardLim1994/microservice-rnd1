services:
  docs:
    build:
      context: ../..
      dockerfile: apps/docs/Dockerfile
    container_name: docs_web
    ports:
      - "4321:4321"
    networks:
      - traefik
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.docs.rule=Host(`docs.localhost`)
      - traefik.http.services.docs.loadbalancer.server.port=4321

networks:
  # Empty here on purpose — real definition lives in services/traefik/docker-compose.yml; Compose
  # merges same-named top-level networks across every file pulled in by the root
  # docker-compose.yml's `include:`, same pattern as every other routed service (e.g.
  # services/vault/docker-compose.yml's own "traefik" redeclaration).
  traefik:
