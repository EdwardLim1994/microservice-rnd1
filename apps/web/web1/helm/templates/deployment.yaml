apiVersion: apps/v1
kind: Deployment
metadata:
  name: web1
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: web1
  template:
    metadata:
      labels:
        app: web1
    spec:
      containers:
        - name: web1
          image: web1:latest
          ports:
            - containerPort: {{ .Values.port }}
          {{- if .Values.publicMfe1Url }}
          env:
            # Consumed by rsbuild.config.ts's Module Federation remotes — must be a URL the
            # *browser* can reach, not in-cluster DNS. Empty here (the default) falls back to
            # rsbuild.config.ts's own http://localhost:3001, which only works for a browser on
            # this same machine.
            - name: PUBLIC_MFE1_URL
              value: {{ .Values.publicMfe1Url | quote }}
          {{- end }}

---
# Stable in-cluster DNS (web1.apps.svc.cluster.local) for Traefik's Ingress below to route to.
apiVersion: v1
kind: Service
metadata:
  name: web1
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: web1
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
