# Every apps/web/* and apps/mfe/* chart shares this namespace (see apps/web/Tiltfile's own
# Namespace declaration) — matches apps/servers/*'s own "server-apps" namespace convention.
namespace: apps

# Dev default: Tilt builds the Dockerfile's "development" target (rsbuild dev server, port 3001
# — see rsbuild.config.ts). values-prod.yaml layers on top for the "production" target (nginx).
port: 3001

# Dev default: one pod is enough for Tilt-driven local iteration. values-prod.yaml layers on top
# for a real deploy — matches apps/servers/*'s own values.yaml/values-prod.yaml pattern.
replicas: 1
