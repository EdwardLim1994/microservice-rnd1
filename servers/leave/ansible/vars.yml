---
server_name: leave
# Reached from inside the "ansible" runner container (services/vault/docker-compose.yml), which
# shares the "vault" Docker network — NOT localhost:8200 (that's only reachable if you run
# ansible-playbook from the host directly, which this repo's `vault:provision` script doesn't do).
vault_addr: http://vault:8200
# Reached from inside the vault container itself (the database/config connection Vault makes is
# established by Vault's own server process, not by Ansible) — the Docker-network hostname/port,
# NOT localhost:5104 (that's only reachable from the host, not from another container).
db_host: leave-db
db_port: "5432"
db_name: leave
# The same Postgres superuser already scaffolded for leave-db (see this server's own
# docker-compose.yml) — Vault uses this as its own DB-admin connection when configuring
# database/config/leave-db. See services/vault/CLAUDE.md for why there's no separate
# Vault-only admin identity. Only the username/password are used from this (host:port here are
# irrelevant — see db_host/db_port above for the address Vault's connection actually uses).
db_admin_url: postgresql://myuser:mypassword@localhost:5104/leave
# Dev-mode root token (services/vault/.env.sample's VAULT_DEV_ROOT_TOKEN_ID) — override here if
# you changed it from the default.
vault_token: root
