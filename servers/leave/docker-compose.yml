services:
  leave:
    build:
      context: ../..
      dockerfile: servers/leave/Dockerfile
      args:
        BUN_TARGET: ${BUN_TARGET:-bun-linux-x64}
    container_name: leave_server
    env_file:
      - .env
    restart: unless-stopped
    environment:
      DB_HOST: leave-db
      DB_PORT: 5432
      DB_NAME: leave
      VAULT_ADDR: http://vault:8200
      VAULT_DB_ROLE: leave-role
    networks:
      - adminer
      - vault
      # Lets Apollo Router (services/apollo, on this same network) reach this container by its
      # service name — same reasoning as servers/auth/docker-compose.yml's own "graphql" entry.
      - graphql
    depends_on:
      leave-db:
        condition: service_healthy

  leave-migrate:
    build:
      context: ../..
      dockerfile: servers/leave/Dockerfile
      target: migrate
      args:
        BUN_TARGET: ${BUN_TARGET:-bun-linux-arm64}
    container_name: leave_migrate
    env_file:
      - .env
    environment:
      # .env's DATABASE_URL is host-side (localhost:5104, the published port) — overridden here
      # to the Docker-network address, same reason the main "leave" service overrides
      # DB_HOST/DB_PORT above. Without this, migrate always fails with "Can't reach database
      # server at `localhost:5104`" since localhost inside this container is itself, not leave-db.
      DATABASE_URL: postgresql://myuser:mypassword@leave-db:5432/leave
    networks:
      - adminer
    depends_on:
      leave-db:
        condition: service_healthy
    restart: "no"

  leave-db:
    image: postgres:15.3-alpine
    container_name: leave_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: leave
    ports:
      - "5104:5432"
    networks:
      - adminer
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d leave" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  vault:
  adminer:
  # Empty here on purpose — real definition lives in services/apollo/docker-compose.yml (see
  # servers/auth/docker-compose.yml's own comment on this pattern).
  graphql:
