version: v2

clean: true

plugins:
  - local: protoc-gen-ts_proto
    out: ../../packages/api/src/generated/test1/proto/
    opt:
      - outputServices=grpc-js
      - esModuleInterop=true
      - useOptionals=messages
      - stringEnums=true
      - outputTypeRegistry=true
  # @bufbuild/protobuf (protobuf-es) output — used only for messages going through the
  # Confluent Schema Registry, whose ProtobufSerializer/Deserializer require this codegen's
  # DescMessage reflection metadata. ts-proto's plain interfaces don't carry that.
  - local: protoc-gen-es
    out: ../../packages/api/src/generated/test1/protobufes/
    opt:
      - target=ts

inputs:
  - directory: ./src/schemas/proto/
