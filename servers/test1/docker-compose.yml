services:
  test1:
    build:
      context: ../..
      dockerfile: servers/test1/Dockerfile
      args:
        BUN_TARGET: ${BUN_TARGET:-bun-linux-x64}
    container_name: test1_server
    env_file:
      - .env
    # .env is written for host-based `bun run dev` (localhost:<mapped-port> addresses) — inside
    # this container, `localhost` means the container itself, not the kafka/test1-db/vault/
    # schema-registry containers. These override .env's copies with the Docker-network service
    # hostnames (only reachable because of the `networks:` below), same pattern as
    # frontends/mfe1/docker-compose.yml's PUBLIC_GRAPHQL_URL override for its own host-vs-Docker
    # split. KAFKA_BROKERS specifically: port 9092 (not 29092) — 29092/PLAINTEXT_HOST is only
    # advertised as "localhost:29092" for host clients; 9092/PLAINTEXT is advertised as
    # "kafka:9092", which only resolves for another container on the `kafka` network like this
    # one, not from the host (see services/kafka/docker-compose.yml's listener comments).
    environment:
      KAFKA_BROKERS: kafka:9092
      DB_HOST: test1-db
      DB_PORT: "5432"
      VAULT_ADDR: http://vault:8200
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - kafka
      - adminer
      # Lets this container reach the vault service by hostname — see
      # services/vault/docker-compose.yml's own network declaration.
      - vault
      # Lets Apollo Router (services/apollo, on this same network) reach this container by its
      # service name — see services/apollo/src/config/supergraph.yaml's routing_url comment for
      # why that value has to match whatever's actually running test1 (host `bun run dev` vs this
      # container) and needs to be kept in sync when you switch between them.
      - graphql
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      test1-db:
        condition: service_healthy
    restart: unless-stopped

  test1-migrate:
    build:
      context: ../..
      dockerfile: servers/test1/Dockerfile
      target: migrate
      args:
        BUN_TARGET: ${BUN_TARGET:-bun-linux-arm64}
    container_name: test1_migrate
    env_file:
      - .env
    # Same host-vs-Docker split as `test1` above — .env's DATABASE_URL points at localhost:5101
    # (host dev), which doesn't resolve inside this container.
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@test1-db:5432/test1
    networks:
      - adminer
    depends_on:
      test1-db:
        condition: service_healthy
    restart: "no"

  test1-db:
    image: postgres:15.3-alpine
    container_name: test1_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: test1
    ports:
      - "5101:5432"
    networks:
      - adminer
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d test1" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  adminer:
  # Empty here on purpose — the "real" definitions (driver: bridge) live in
  # services/kafka/docker-compose.yml and services/apollo/docker-compose.yml respectively;
  # Compose merges same-named top-level networks across every file pulled in by the root
  # docker-compose.yml's `include:`, same convention frontends/mfe1/docker-compose.yml follows
  # for its own `graphql` network reference.
  kafka:
  graphql:
  vault:
