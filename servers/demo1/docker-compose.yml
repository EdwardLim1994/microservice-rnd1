services:
  demo1:
    build:
      context: ../..
      dockerfile: servers/demo1/Dockerfile
    container_name: demo1_server
    ports:
      - "4001:4001"
      - "5001:5001"
      # environment:
      # Internal Docker-network listener (matches KAFKA_ADVERTISED_LISTENERS) — not
      # localhost:29092, which inside this container would mean itself, not the kafka service.
      # KAFKA_BROKERS: kafka:9092
    env_file:
      - .env
    networks:
      - graphql
      - kafka
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    restart: unless-stopped

networks:
  graphql:
  kafka:
