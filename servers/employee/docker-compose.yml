services:
  employee:
    build:
      context: ../..
      dockerfile: servers/employee/Dockerfile
      args:
        BUN_TARGET: ${BUN_TARGET:-bun-linux-x64}
    container_name: employee_server
    env_file:
      - .env
    restart: unless-stopped
    environment:
      DB_HOST: employee-db
      DB_PORT: 5432
      DB_NAME: employee
      VAULT_ADDR: http://vault:8200
      VAULT_DB_ROLE: employee-role
      AUTHENTIK_URL: http://authentik-server:9000
    networks:
      - adminer
      - vault
      - authentik
      # Lets Apollo Router (services/apollo, on this same network) reach this container by its
      # service name — same reasoning as servers/auth/docker-compose.yml's own "graphql" entry.
      - graphql
    depends_on:
      employee-db:
        condition: service_healthy
      authentik-server:
        condition: service_healthy

  employee-migrate:
    build:
      context: ../..
      dockerfile: servers/employee/Dockerfile
      target: migrate
      args:
        BUN_TARGET: ${BUN_TARGET:-bun-linux-arm64}
    container_name: employee_migrate
    env_file:
      - .env
    environment:
      # .env's DATABASE_URL is host-side (localhost:5101, the published port — see
      # servers/employee/CLAUDE.md's Prisma CLI note) — overridden here to the Docker-network
      # address, same reason the main "employee" service overrides DB_HOST/DB_PORT above. Without
      # this, migrate always fails with "Can't reach database server at `localhost:5101`" since
      # localhost inside this container is itself, not employee-db.
      DATABASE_URL: postgresql://myuser:mypassword@employee-db:5432/employee
    networks:
      - adminer
    depends_on:
      employee-db:
        condition: service_healthy
    restart: "no"

  employee-db:
    image: postgres:15.3-alpine
    container_name: employee_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: employee
    ports:
      - "5101:5432"
    networks:
      - adminer
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d employee" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  vault:
  adminer:
  authentik:
  # Empty here on purpose — real definition lives in services/apollo/docker-compose.yml (see
  # servers/auth/docker-compose.yml's own comment on this pattern).
  graphql:
