replicaCount: 1

image:
  app:
    repository: employee
    tag: local
  migrate:
    repository: employee-migrate
    tag: local
  pullPolicy: IfNotPresent

# Defaults match GraphqlGenerator/GrpcGenerator's DEFAULT_GRAPHQL_PORT/DEFAULT_GRPC_PORT (4001,
# 5001) — but those generators auto-increment past ports already used by other servers'
# .env.sample, so if this isn't the first server generated, update these to match whatever
# GRAPHQL_PORT/GRPC_PORT actually landed in this server's .env.sample once you add drivers via
# `turbo gen`. Fresh (no drivers added yet), nothing listens on either port — the Deployment's
# readiness/liveness probes won't pass until a driver is added.
ports:
  graphql: 4001
  grpc: 5001

# Self-contained Postgres for this server alone (postgres-deployment.yaml/-pvc.yaml/
# -service.yaml) — mirrors docker-compose.yml's employee-db, not a shared cluster-wide
# database the way Kafka/Schema Registry are. Deliberately plain env-var credentials, no
# Secret — matches this chart's existing simplicity level; revisit if this ever needs to be
# more than a local/demo deployment. Also doubles as Vault's own DB-admin credential (see
# services/vault/CLAUDE.md) — no separate Vault-only identity.
postgres:
  image: postgres:15.3-alpine
  user: myuser
  password: mypassword
  database: employee
  storageSize: 1Gi

# In-cluster Vault (services/vault/helm, shared "infra" namespace) — see
# services/vault/CLAUDE.md for the dynamic-credential provisioning this depends on.
vault:
  addr: http://vault.infra.svc.cluster.local:8200
  dbRole: employee-role
  # Filled in manually after running services/vault/ansible's provisioning role against
  # the in-cluster Vault — Vault-issued, not knowable at `turbo gen` time.
  roleId: ""
  secretId: ""
