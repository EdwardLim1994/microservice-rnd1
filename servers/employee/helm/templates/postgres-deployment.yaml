apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "server.fullname" . }}-postgres
  labels:
    {{- include "server.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  # Always 1 — a second replica would each get its own PVC mount (ReadWriteOnce) and diverge into
  # two separate databases, not a real HA setup. This is a local/demo single-instance Postgres,
  # same scope as docker-compose.yml's <name>-db.
  replicas: 1
  selector:
    matchLabels:
      {{- include "server.labels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "server.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              # Ephemeral (node-local) scratch space — separate from the PVC's own storageSize
              # (see values.yaml's postgres.storageSize), which already bounds the actual data
              # directory.
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              # Postgres requires its data directory to be empty or already-initialized — a raw
              # PVC mount at the volume root can contain a `lost+found` directory (ext4/some CSI
              # drivers create one automatically), which trips Postgres's "directory not empty"
              # initdb check. subPath scopes the mount to a subdirectory instead, sidestepping it.
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "server.fullname" . }}-postgres
