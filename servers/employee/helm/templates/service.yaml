apiVersion: v1
kind: Service
metadata:
  name: {{ include "server.fullname" . }}
  labels:
    {{- include "server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "server.labels" . | nindent 4 }}
  ports:
    - name: graphql
      port: {{ .Values.ports.graphql }}
      targetPort: graphql
    - name: grpc
      port: {{ .Values.ports.grpc }}
      targetPort: grpc
