apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "server.fullname" . }}
  labels:
    {{- include "server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "server.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "server.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.app.repository }}:{{ .Values.image.app.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: graphql
              containerPort: {{ .Values.ports.graphql }}
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
          envFrom:
            - configMapRef:
                name: {{ include "server.fullname" . }}-config
          # tcpSocket, not an HTTP path — no health endpoint exists in packages/server today (see
          # packages/server/CLAUDE.md). Won't pass until a driver listens on the graphql port —
          # see values.yaml's ports comment.
          readinessProbe:
            tcpSocket:
              port: graphql
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: graphql
            initialDelaySeconds: 10
            periodSeconds: 20
