apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "server.fullname" . }}-config
  labels:
    {{- include "server.labels" . | nindent 4 }}
data:
  # Read by src/app.ts's driver entries once GraphQL/gRPC are added via `turbo gen`
  # (`Number(import.meta.env.GRAPHQL_PORT)` / `GRPC_PORT`) — sourced from .Values.ports so the
  # container's actual listen port, this ConfigMap, the Deployment's containerPort, and the
  # Service's targetPort all stay in sync from one place (values.yaml) instead of four.
  GRAPHQL_PORT: {{ .Values.ports.graphql | quote }}
  GRPC_PORT: {{ .Values.ports.grpc | quote }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  KAFKA_CLIENT_ID: {{ .Values.kafka.clientId | quote }}
  SCHEMA_REGISTRY_URL: {{ .Values.schemaRegistry.url | quote }}
  KAFKA_GROUP_ID: {{ .Values.kafka.groupId | quote }}
