apiVersion: v1
kind: Service
metadata:
  name: {{ include "server.fullname" . }}-postgres
  labels:
    {{- include "server.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  # ClusterIP — only this server's own app pod and the migration Job need to reach this, both
  # in-cluster (unlike the app's own graphql/grpc Service, nothing browser- or host-facing needs
  # this).
  type: ClusterIP
  selector:
    {{- include "server.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
