apiVersion: v1
kind: Secret
metadata:
  name: {{ include "server.fullname" . }}-vault-secret
  labels:
    {{- include "server.labels" . | nindent 4 }}
stringData:
  # Filled in manually after running services/vault/ansible's provisioning role against the
  # in-cluster Vault (see values.yaml's vault.roleId/vault.secretId placeholders) — Vault-issued,
  # not knowable at `turbo gen` time.
  VAULT_ROLE_ID: {{ .Values.vault.roleId | quote }}
  VAULT_SECRET_ID: {{ .Values.vault.secretId | quote }}
