services:
  payroll:
    build:
      context: ../..
      dockerfile: servers/payroll/Dockerfile
      args:
        BUN_TARGET: ${BUN_TARGET:-bun-linux-x64}
    container_name: payroll_server
    env_file:
      - .env
    restart: unless-stopped
    environment:
      DB_HOST: payroll-db
      DB_PORT: 5432
      DB_NAME: payroll
      VAULT_ADDR: http://vault:8200
      VAULT_DB_ROLE: payroll-role
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      # .env has no default for this at all (EmployeeServiceClient falls back to
      # http://localhost:4001, the host-side `bun dev` convention) — overridden here to the
      # Docker-network address, same reasoning as DB_HOST/DB_PORT above. Reachable because
      # "employee" is also on the "graphql" network below.
      EMPLOYEE_GRAPHQL_URL: http://employee:4001
    networks:
      - adminer
      - vault
      - minio
      # Lets Apollo Router (services/apollo, on this same network) reach this container by its
      # service name — same reasoning as servers/auth/docker-compose.yml's own "graphql" entry.
      - graphql
    depends_on:
      payroll-db:
        condition: service_healthy

  payroll-migrate:
    build:
      context: ../..
      dockerfile: servers/payroll/Dockerfile
      target: migrate
      args:
        BUN_TARGET: ${BUN_TARGET:-bun-linux-arm64}
    container_name: payroll_migrate
    env_file:
      - .env
    environment:
      # .env's DATABASE_URL is host-side (localhost:5102, the published port) — overridden here
      # to the Docker-network address, same reason the main "payroll" service overrides
      # DB_HOST/DB_PORT above. Without this, migrate always fails with "Can't reach database
      # server at `localhost:5102`" since localhost inside this container is itself, not
      # payroll-db.
      DATABASE_URL: postgresql://myuser:mypassword@payroll-db:5432/payroll
    networks:
      - adminer
    depends_on:
      payroll-db:
        condition: service_healthy
    restart: "no"

  payroll-db:
    image: postgres:15.3-alpine
    container_name: payroll_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: payroll
    ports:
      - "5102:5432"
    networks:
      - adminer
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d payroll" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  vault:
  adminer:
  minio:
  # Empty here on purpose — real definition lives in services/apollo/docker-compose.yml (see
  # servers/auth/docker-compose.yml's own comment on this pattern).
  graphql:
