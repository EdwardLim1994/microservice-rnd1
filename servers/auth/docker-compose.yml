services:
  auth:
    build:
      context: ../..
      dockerfile: servers/auth/Dockerfile
      args:
        BUN_TARGET: ${BUN_TARGET:-bun-linux-x64}
    container_name: auth_server
    env_file:
      - .env
    # .env's AUTHENTIK_URL is localhost:9000 (host-side `bun dev` convention, same as e.g.
    # servers/test1's DB_HOST) — overridden here to the Docker-network hostname for the
    # containerized case, same pattern as DatabaseGenerator's wireDatabaseDockerCompose action.
    environment:
      AUTHENTIK_URL: http://authentik-server:9000
    restart: unless-stopped
    depends_on:
      authentik-server:
        condition: service_healthy
    networks:
      - authentik
      # Lets Apollo Router (services/apollo, on this same network) reach this container by its
      # service name — see services/apollo/src/config/supergraph.yaml's routing_url comment for
      # why that value has to match whatever's actually running auth (host `bun run dev` vs this
      # container) and needs to be kept in sync when you switch between them.
      - graphql

# Empty on purpose — the "real" definitions (driver: bridge) live in
# services/authentik/docker-compose.yml and services/apollo/docker-compose.yml respectively;
# Compose merges same-named top-level networks across every file pulled in by the root
# docker-compose.yml's `include:`, same convention servers/test1/docker-compose.yml follows for
# its own "adminer"/"vault"/"graphql" network references.
networks:
  authentik:
  graphql:
