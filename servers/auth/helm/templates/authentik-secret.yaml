apiVersion: v1
kind: Secret
metadata:
  name: {{ include "server.fullname" . }}-authentik-secret
  labels:
    {{- include "server.labels" . | nindent 4 }}
stringData:
  # Filled in manually after running `bun run auth:provision` against the in-cluster Authentik
  # (see values.yaml's authentik.oauthClientId/oauthClientSecret/apiToken placeholders) —
  # Authentik-issued, not knowable at `turbo gen` time.
  AUTHENTIK_OAUTH_CLIENT_ID: {{ .Values.authentik.oauthClientId | quote }}
  AUTHENTIK_OAUTH_CLIENT_SECRET: {{ .Values.authentik.oauthClientSecret | quote }}
  AUTHENTIK_API_TOKEN: {{ .Values.authentik.apiToken | quote }}
