replicaCount: 1

image:
  app:
    repository: auth
    tag: local
  pullPolicy: IfNotPresent

# Defaults match GraphqlGenerator/GrpcGenerator's DEFAULT_GRAPHQL_PORT/DEFAULT_GRPC_PORT (4001,
# 5001) — but those generators auto-increment past ports already used by other servers'
# .env.sample, so if this isn't the first server generated, update these to match whatever
# GRAPHQL_PORT/GRPC_PORT actually landed in this server's .env.sample once you add drivers via
# `turbo gen`. Fresh (no drivers added yet), nothing listens on either port — the Deployment's
# readiness/liveness probes won't pass until a driver is added.
ports:
  graphql: 4003
  grpc: 5001
