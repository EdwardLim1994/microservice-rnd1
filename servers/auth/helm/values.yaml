replicaCount: 1

image:
  app:
    repository: auth
    tag: local
  pullPolicy: IfNotPresent

# Defaults match GraphqlGenerator/GrpcGenerator's DEFAULT_GRAPHQL_PORT/DEFAULT_GRPC_PORT (4001,
# 5001) — but those generators auto-increment past ports already used by other servers'
# .env.sample, so if this isn't the first server generated, update these to match whatever
# GRAPHQL_PORT/GRPC_PORT actually landed in this server's .env.sample once you add drivers via
# `turbo gen`. Fresh (no drivers added yet), nothing listens on either port — the Deployment's
# readiness/liveness probes won't pass until a driver is added.
ports:
  graphql: 4003
  grpc: 5001

# In-cluster Authentik (services/authentik/helm, shared "infra" namespace) — see
# services/authentik/CLAUDE.md for the OAuth2 Provider/Application/service-account provisioning
# this depends on.
authentik:
  url: http://authentik-server.infra.svc.cluster.local:9000
  # Filled in manually after running `bun run auth:provision` against the in-cluster Authentik —
  # there's no in-cluster equivalent of that provisioning step yet (local docker-compose only, see
  # services/authentik/CLAUDE.md's known-limitations section), same as servers/test1's
  # vault.roleId/vault.secretId. Authentik-issued, not knowable at `turbo gen` time.
  oauthClientId: ""
  oauthClientSecret: ""
  apiToken: ""

# Vault-issued mTLS identity (see packages/server/CLAUDE.md's TLS section and
# services/vault/CLAUDE.md's PKI section) — same "filled in manually, not knowable at `turbo gen`
# time" shape as authentik.oauthClientId/oauthClientSecret above.
vault:
  addr: http://vault.infra.svc.cluster.local:8200
  tlsRole: auth-tls-role
  roleId: ""
  secretId: ""
