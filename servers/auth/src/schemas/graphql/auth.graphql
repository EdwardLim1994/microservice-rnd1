extend schema
	@link(url: "https://specs.apollo.dev/federation/v2.14", import: [])

type AuthPayload {
	accessToken: String!
	refreshToken: String!
	idToken: String!
}

type RegisterPayload {
	success: Boolean!
	message: String!
}

type Mutation {
	login(email: String!, password: String!): AuthPayload!
	register(email: String!, password: String!): RegisterPayload!
	signOut(refreshToken: String!): Boolean!
}
