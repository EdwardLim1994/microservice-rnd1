extend schema @link(url: "https://specs.apollo.dev/federation/v2.14", import: [])

type AuthTokens {
  accessToken: String!
  refreshToken: String
  idToken: String
  tokenType: String!
  expiresIn: Int!
}

type RegisterResult {
  success: Boolean!
  message: String!
}

type Mutation {
  register(email: String!, password: String!): RegisterResult!
  signIn(username: String!, password: String!): AuthTokens!
  signOut(refreshToken: String!): Boolean!
}
