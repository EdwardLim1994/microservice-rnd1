extend schema
	@link(url: "https://specs.apollo.dev/federation/v2.14", import: [])

type AuthTokens {
	accessToken: String!
	refreshToken: String
	idToken: String
	tokenType: String!
	expiresIn: Int!
}

type RegisterPayload {
	success: Boolean!
	message: String!
}

type Mutation {
	signIn(username: String!, password: String!): AuthTokens!
	register(email: String!, password: String!): RegisterPayload!
	signOut(refreshToken: String!): Boolean!
}
