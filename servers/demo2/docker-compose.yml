services:
  demo2:
    build:
      context: ../..
      dockerfile: servers/demo2/Dockerfile
      args:
        BUN_TARGET: ${BUN_TARGET:-bun-linux-arm64}
    container_name: demo2_server
    ports:
      - "4002:4002"
      - "5002:5002"
    # environment:
    #   # Internal Docker-network listener (matches KAFKA_ADVERTISED_LISTENERS) — not
    #   # localhost:29092, which inside this container would mean itself, not the kafka service.
    #   KAFKA_BROKERS: kafka:9092
    #   KAFKA_GROUP_ID: demo2-group
    env_file:
      - .env
    networks:
      - graphql
      - kafka
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    restart: unless-stopped

networks:
  graphql:
  kafka:
