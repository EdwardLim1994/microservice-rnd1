name: CD Hotfix

# Hotfix branches cut from main (not from any release branch — see CLAUDE.md's branching
# strategy) ship independently of any in-flight release: bump each touched app's patch version,
# build+push its image, and apply prod for just those apps. A hotfix may touch one or more
# deployable apps — most fix a single app, but a repo-wide sweep (e.g. a code-quality/security
# cleanup spanning several servers/frontends at once) legitimately touches more than one. This
# workflow fails loudly only if it touches zero, since that signals the branch isn't actually a
# hotfix.
on:
  push:
    branches:
      - "hotfix/**"

concurrency:
  group: cd-hotfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      apps: ${{ steps.hotfix.outputs.apps }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build --filter=script

      - name: Identify the touched apps
        id: touched
        run: |
          apps=$(bun ./scripts/release_manager.sh.ts touched-apps origin/main)
          count=$(echo "$apps" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "::error::Expected at least one deployable app touched by this hotfix, found 0"
            exit 1
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

      - name: Bump each touched app's patch version
        id: hotfix
        env:
          TOUCHED_APPS: ${{ steps.touched.outputs.apps }}
        run: |
          results="[]"
          for app in $(echo "$TOUCHED_APPS" | jq -r '.[]'); do
            result=$(bun ./scripts/release_manager.sh.ts hotfix "$app")
            results=$(echo "$results" | jq --argjson r "$result" '. + [$r]')
          done
          echo "apps=$(echo "$results" | jq -c '.')" >> "$GITHUB_OUTPUT"
          echo "summary=$(echo "$results" | jq -r '[.[] | "\(.name)@\(.version)"] | join(", ")')" >> "$GITHUB_OUTPUT"

      - name: Commit the version bumps
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore(hotfix): bump ${{ steps.hotfix.outputs.summary }} [skip ci]"

  build-and-push:
    needs: hotfix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.hotfix.outputs.apps) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Skip if no Dockerfile yet
        id: has_dockerfile
        run: |
          if [ -f "${{ matrix.app.path }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ matrix.app.name }} has no Dockerfile yet — skipping image build."
          fi

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.has_dockerfile.outputs.exists == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.has_dockerfile.outputs.exists == 'true'
        with:
          context: .
          file: ${{ matrix.app.path }}/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.app.name }}:${{ matrix.app.version }}

  terraform-apply-prod:
    needs: [hotfix, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: terraform init
        working-directory: terraform
        run: terraform init
        # Backend config supplied via -backend-config once bucket/region are decided — see
        # docs/ci-cd.md.

      - name: terraform apply (prod workspace, targeted to just the touched apps)
        # One apply, multiple -target/-var flags — not a matrix. Every touched app shares the
        # same terraform state file; parallel matrix jobs would race on the state lock instead
        # of composing cleanly the way build-and-push's independent per-app image builds do.
        working-directory: terraform
        env:
          TOUCHED_APPS: ${{ needs.hotfix.outputs.apps }}
        run: |
          targets=$(echo "$TOUCHED_APPS" | jq -r '[.[] | "-target=module.\(.name)"] | join(" ")')
          varArgs=$(echo "$TOUCHED_APPS" | jq -r '[.[] | "-var=\(.name)_app_image_tag=\(.version)"] | join(" ")')
          terraform workspace select -or-create prod
          terraform apply -auto-approve $targets $varArgs
