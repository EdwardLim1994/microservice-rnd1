name: CD Hotfix

# Hotfix branches cut from main (not from any release branch — see CLAUDE.md's branching
# strategy) ship independently of any in-flight release: bump the touched app's patch version,
# build+push its image, and apply prod for just that app. A hotfix is expected to touch exactly
# one deployable app; this workflow fails loudly if it touches zero or more than one, since that
# signals the branch isn't actually a hotfix (or is trying to bundle unrelated changes).
on:
  push:
    branches:
      - "hotfix/**"

concurrency:
  group: cd-hotfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      app_name: ${{ steps.hotfix.outputs.app_name }}
      version: ${{ steps.hotfix.outputs.version }}
      path: ${{ steps.hotfix.outputs.path }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build --filter=script

      - name: Identify the touched app
        id: touched
        run: |
          apps=$(bun ./scripts/release_manager.sh.ts touched-apps origin/main)
          count=$(echo "$apps" | jq 'length')
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one deployable app touched by this hotfix, found $count: $apps"
            exit 1
          fi
          echo "app_name=$(echo "$apps" | jq -r '.[0]')" >> "$GITHUB_OUTPUT"

      - name: Bump the app's patch version
        id: hotfix
        run: |
          result=$(bun ./scripts/release_manager.sh.ts hotfix "${{ steps.touched.outputs.app_name }}")
          echo "app_name=$(echo "$result" | jq -r '.name')" >> "$GITHUB_OUTPUT"
          echo "version=$(echo "$result" | jq -r '.version')" >> "$GITHUB_OUTPUT"
          echo "path=$(echo "$result" | jq -r '.path')" >> "$GITHUB_OUTPUT"

      - name: Commit the version bump
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore(hotfix): bump ${{ steps.hotfix.outputs.app_name }} to ${{ steps.hotfix.outputs.version }} [skip ci]"

  build-and-push:
    needs: hotfix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Skip if no Dockerfile yet
        id: has_dockerfile
        run: |
          if [ -f "${{ needs.hotfix.outputs.path }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ needs.hotfix.outputs.app_name }} has no Dockerfile yet — skipping image build."
          fi

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.has_dockerfile.outputs.exists == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.has_dockerfile.outputs.exists == 'true'
        with:
          context: .
          file: ${{ needs.hotfix.outputs.path }}/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ needs.hotfix.outputs.app_name }}:${{ needs.hotfix.outputs.version }}

  terraform-apply-prod:
    needs: [hotfix, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: terraform init
        working-directory: terraform
        run: terraform init
        # Backend config supplied via -backend-config once bucket/region are decided — see
        # docs/ci-cd.md.

      - name: terraform apply (prod workspace, targeted to this app only)
        working-directory: terraform
        run: |
          terraform workspace select -or-create prod
          terraform apply -auto-approve \
            -target="module.${{ needs.hotfix.outputs.app_name }}" \
            -var="${{ needs.hotfix.outputs.app_name }}_app_image_tag=${{ needs.hotfix.outputs.version }}"
