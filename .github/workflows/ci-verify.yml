name: CI Verify

# Required status check on every PR into any branch (feature -> story, story -> release,
# release -> main, hotfix -> main). Wire this up in GitHub branch protection rules once merged
# — that setting can't be expressed in this file. See docs/ci-cd.md.
on:
  pull_request:

concurrency:
  group: ci-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: `turbo`'s affected-package filter and our own touched-app detection
          # both diff against the PR base ref, which needs real commit history, not a shallow
          # clone.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint + format + test (affected packages only)
        run: |
          filter="...[origin/${{ github.event.pull_request.base.ref }}]"
          bun run check --filter="$filter"
          bun run test --filter="$filter"

      - name: Fail if check --write left uncommitted changes
        # packages' own "check"/"format" scripts run biome in --write mode (meant for local
        # dev, auto-fixing on save) — there's no separate non-mutating "check" variant defined
        # per-package today. Running it in CI still catches every violation; it just fixes them
        # instead of only reporting them, so a dirty tree after the step above IS the failure
        # signal. See docs/ci-cd.md's Known gaps section.
        run: git diff --exit-code --stat

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
