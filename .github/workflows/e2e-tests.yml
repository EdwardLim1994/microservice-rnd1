name: e2e Tests

# Required status check for user story branches — see .claude/SOP.md Phase 6, Gate 1.
on:
  push:
    branches:
      - 'us/**'

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Every .env below is throwaway, CI-run-scoped local dev config — generated here rather than
      # committed (they're gitignored everywhere else in this repo too) or read from repo secrets,
      # since nothing in this stack needs to persist or be shared beyond this one job run.
      - name: Generate throwaway env files for services/authentik and servers/auth
        run: |
          cat > services/authentik/.env <<EOF
          AUTHENTIK_SECRET_KEY=$(openssl rand -base64 60)
          AUTHENTIK_PG_USER=authentik
          AUTHENTIK_PG_PASSWORD=$(openssl rand -hex 16)
          AUTHENTIK_PG_DB=authentik
          AUTHENTIK_BOOTSTRAP_EMAIL=admin@localhost
          AUTHENTIK_BOOTSTRAP_PASSWORD=$(openssl rand -hex 16)
          AUTHENTIK_BOOTSTRAP_TOKEN=$(openssl rand -hex 32)
          EOF
          cp servers/auth/.env.sample servers/auth/.env
          cp services/apollo/.env.sample services/apollo/.env

      - name: Start Authentik
        run: |
          docker compose up -d authentik-postgresql authentik-redis
          docker compose up -d authentik-server authentik-worker
          timeout 120 bash -c 'until curl -sf http://localhost:9000/-/health/ready/ >/dev/null; do sleep 5; done'

      - name: Provision Authentik for servers/auth (OAuth2 client + enrollment flow + API token)
        run: |
          cd servers/auth
          bun run auth:provision

      - name: Build and start the auth server and Apollo Router
        run: |
          cd services/apollo
          bunx rover supergraph compose --config ./src/config/supergraph.yaml --output ./dist/supergraph.graphql --elv2-license=accept
          cd ../..
          docker compose up -d --build auth router
          timeout 60 bash -c 'until curl -sf -X POST http://localhost:4000/graphql -H "Content-Type: application/json" -d "{\"query\":\"{ __typename }\"}" >/dev/null; do sleep 5; done'

      - name: Install Playwright's Chromium
        run: cd frontends/mfe1 && bunx playwright install --with-deps chromium

      - name: Run e2e tests
        env:
          AUTHENTIK_URL: http://localhost:9000
        run: |
          export AUTHENTIK_API_TOKEN=$(grep AUTHENTIK_API_TOKEN servers/auth/.env | cut -d= -f2)
          cd frontends/mfe1
          bun run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa9 # v4.6.2
        with:
          name: playwright-report
          path: frontends/mfe1/playwright-report/
          retention-days: 7
