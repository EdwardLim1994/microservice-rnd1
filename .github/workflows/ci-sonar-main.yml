name: CI Sonar Main

# ci-verify.yml only scans on `pull_request` — main's own SonarCloud branch analysis never
# updates on its own merge, since every scan that ever ran was PR-context analysis of some
# feature/bugfix/hotfix branch, never main itself. This workflow closes that gap with a plain
# `push: main` trigger, re-running the scan (and the full, unfiltered test suite it needs for
# real coverage numbers) every time main actually changes.
#
# Deliberately a separate file from ci-verify.yml, not an added trigger on it: that workflow's
# concurrency group and its "affected packages only" test filter are both keyed off
# `github.event.pull_request.*`, which doesn't exist on a push event.
on:
  push:
    branches:
      - main

concurrency:
  group: ci-sonar-main
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Test every package (unfiltered — main's own analysis needs full coverage, not just what one PR touched)
        run: bun run test

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
