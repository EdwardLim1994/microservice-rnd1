name: CD Production

# Fires on every push to main. Most main pushes are NOT a release promotion (e.g. this very
# CI/CD setup landing on main, or any other direct main commit) — the promote job checks for
# release-manifest.json and no-ops cleanly if it's absent, so this workflow is safe to leave
# on a blanket `push: main` trigger rather than needing a separate tag event.
on:
  push:
    branches:
      - main

concurrency:
  group: cd-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      apps: ${{ steps.diff.outputs.apps }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check for a pending release manifest
        id: check
        run: |
          if [ -f release-manifest.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.check.outputs.present == 'true'
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile --ignore-scripts
        if: steps.check.outputs.present == 'true'
      - run: bun run build --filter=script
        if: steps.check.outputs.present == 'true'

      - name: Capture rc versions before promotion
        id: pre
        if: steps.check.outputs.present == 'true'
        run: echo "apps=$(jq -c '.apps' release-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Strip -rcN suffixes (promote to final versions)
        if: steps.check.outputs.present == 'true'
        run: bun run release:promote

      - name: Remove the now-stale manifest
        # release-manifest.json is a coordination artifact for one UAT cycle, not a permanent
        # record — leaving it on main would make the next `release:cut` (which refuses to run
        # if a manifest already exists) fail on the very next release branch. App/root
        # package.json versions are main's permanent source of truth going forward.
        if: steps.check.outputs.present == 'true'
        run: git rm -f release-manifest.json

      - name: Commit the promotion
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        if: steps.check.outputs.present == 'true'
        with:
          commit_message: "chore(release): promote to final version [skip ci]"

      - name: Pair each app's rc tag with its promoted final tag
        id: diff
        if: steps.check.outputs.present == 'true'
        run: |
          jq -c --argjson pre '${{ steps.pre.outputs.apps }}' -n '
            $pre | to_entries | map({
              name: .key,
              rcVersion: .value,
              finalVersion: (.value | sub("-rc[0-9]+$"; ""))
            })
          ' > /tmp/apps.json
          echo "apps=$(cat /tmp/apps.json)" >> "$GITHUB_OUTPUT"

      - name: No pending release — nothing to promote
        if: steps.check.outputs.present == 'false'
        run: echo "apps=[]" >> "$GITHUB_OUTPUT"
        id: empty

  retag-images:
    needs: promote
    if: needs.promote.outputs.apps != '[]' && needs.promote.outputs.apps != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJson(needs.promote.outputs.apps) }}
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote the last UAT-passing image, no rebuild
        # Retagging (not rebuilding) is deliberate: the exact image bytes that passed UAT at
        # `rcVersion` must be what goes to prod — a fresh `docker build` here could pick up a
        # different base-image patch version or dependency resolution and silently ship
        # something that was never actually tested.
        run: |
          docker buildx imagetools create \
            --tag ${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.app.name }}:${{ matrix.app.finalVersion }} \
            ${{ vars.DOCKERHUB_NAMESPACE }}/${{ matrix.app.name }}:${{ matrix.app.rcVersion }}

  terraform-apply-prod:
    needs: [promote, retag-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Build tfvars from the promoted versions
        run: |
          jq -n \
            --argjson apps '${{ needs.promote.outputs.apps }}' \
            '[$apps[] | {("\(.name)_app_image_tag"): .finalVersion}] | add' \
            > terraform/release.auto.tfvars.json
          cat terraform/release.auto.tfvars.json

      - name: terraform init
        working-directory: terraform
        run: terraform init
        # Backend config supplied via -backend-config once bucket/region are decided — see
        # docs/ci-cd.md.

      - name: terraform apply (prod workspace)
        working-directory: terraform
        run: |
          terraform workspace select -or-create prod
          terraform apply -auto-approve -var-file=release.auto.tfvars.json
