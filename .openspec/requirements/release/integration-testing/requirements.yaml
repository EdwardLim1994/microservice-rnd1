release: integration-testing
date: "2026-07-12"
releaseBranch: release/integration-testing
affectedSubgraphs:
  - auth

userStories:
  - id: US-01
    title: User Registration
    persona: A new user visiting the application for the first time
    goal: Create an account using email and password
    outcome: They have an account in authentik and can proceed to sign in
    labels:
      - authentication
      - registration
      - backend
      - frontend
      - e2e
    acceptanceCriteria:
      - A user can submit email and password and an account is created in authentik
      - Submitting a duplicate email returns a clear error message to the client
      - Submitting an empty email or password returns a client-side validation error before the mutation is called
      - The register mutation is accessible through Apollo Router, not by calling the auth subgraph directly
    e2eTestPlan:
      - id: E2E-US01-01
        scenario: Successful registration
        given: A user is on the register page
        when: They submit a valid email and password
        then: A success message is displayed and an account exists in authentik
      - id: E2E-US01-02
        scenario: Duplicate email
        given: A user is on the register page
        when: They submit an email that is already registered
        then: A duplicate email error message is displayed
      - id: E2E-US01-03
        scenario: Empty email field
        given: A user is on the register page
        when: They submit with an empty email field
        then: A validation error is shown and the mutation is not called
      - id: E2E-US01-04
        scenario: Empty password field
        given: A user is on the register page
        when: They submit with an empty password field
        then: A validation error is shown and the mutation is not called
    features:
      - id: FEAT-01
        title: Auth Register Mutation
        type: backend
        description: >
          Add a register(email, password) GraphQL mutation to the existing
          ./servers/auth service — do not scaffold a new service. servers/auth
          already exposes signIn/signUp/signOut against authentik (see its
          CLAUDE.md); replace its signUp mutation (which bypasses authentik's
          enrollment flow via direct Admin API calls) with register, driving
          authentik's real enrollment flow via the Flow Executor API instead, so
          email verification, captcha, and password policy stages are honoured.
          Follow the existing conventions in ./servers/auth and packages/server's
          AuthentikPlugin/AuthentikClient pattern.
        component: ./servers/auth
        claudeDesignURL: null
        uiInteractions: null
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - auth
        input: >
          mutation register(email: String!, password: String!): RegisterPayload
        output: >
          RegisterPayload { success: Boolean!, message: String! } on success;
          structured GraphQL error on failure
        edgeCases:
          - Authentik API is unreachable — return a service unavailable GraphQL error
          - Authentik returns a duplicate user error — surface as a user-facing duplicate email GraphQL error
          - Password does not meet authentik minimum policy — surface the policy error message from authentik
          - Empty or malformed email or password — reject at the resolver level before calling authentik
        integrationTestPlan:
          - id: INT-FEAT01-01
            scenario: Valid registration via Apollo Router
            description: Call register mutation via Apollo Router with valid email and password — expect { success true } and confirm user exists in authentik
          - id: INT-FEAT01-02
            scenario: Duplicate email via Apollo Router
            description: Call register mutation via Apollo Router with a duplicate email — expect a structured GraphQL error with a duplicate email message
          - id: INT-FEAT01-03
            scenario: Empty email via Apollo Router
            description: Call register mutation via Apollo Router with empty email — expect a GraphQL validation error
          - id: INT-FEAT01-04
            scenario: Empty password via Apollo Router
            description: Call register mutation via Apollo Router with empty password — expect a GraphQL validation error

      - id: FEAT-02
        title: Apollo Router Subgraph Wiring
        type: backend
        description: >
          Register the auth subgraph in the Apollo Router's existing supergraph
          config so that register, login, and logout mutations are routable through
          Apollo Router. The repo already has a pipeline for promoting subgraphs —
          read the existing config and pipeline before making changes and follow the
          established pattern exactly. This feature covers wiring for all three auth
          mutations, not just register.
        component: Apollo Router supergraph config
        claudeDesignURL: null
        uiInteractions: null
        responsiveBreakpoints: null
        graphqlChanges: false
        input: Auth subgraph URL and composed schema
        output: >
          Apollo Router correctly routes auth mutations to the auth subgraph.
          Mutations must be verified as reachable via the router.
        edgeCases:
          - Auth subgraph is down when Apollo Router starts — router should start but return an error on auth mutation calls
          - Schema composition fails due to type conflicts with other subgraphs — surface as a composition error and do not deploy
        integrationTestPlan:
          - id: INT-FEAT02-01
            scenario: Auth mutations reachable via Apollo Router
            description: Call each of register, login, logout via Apollo Router — expect each to reach the auth subgraph and return a valid response or structured error
          - id: INT-FEAT02-02
            scenario: Schema composition succeeds
            description: Run rover supergraph compose — expect exit code 0 with no type conflicts

      - id: FEAT-03
        title: Authentik Terraform and Helm Configuration
        type: backend
        description: >
          Read the existing Terraform and Helm files for authentik in the repo.
          If an OAuth2/OIDC application, client credentials (client ID and secret),
          enrollment flow, and authentication flow are not already defined, add the
          necessary Terraform resources. If they are already defined, read the
          existing values and use them as configuration for the auth service.
          The goal is for authentik to be fully configured and ready for the auth
          subgraph to call against, both locally and in Kubernetes. Do not recreate
          existing resources — use terraform import guidance if state conflicts arise.
          Ensure the client secret is stored in a Kubernetes secret or environment
          variable accessible to the auth subgraph.
        component: Terraform authentik provider resources; Helm values for authentik
        claudeDesignURL: null
        uiInteractions: null
        responsiveBreakpoints: null
        graphqlChanges: false
        input: Existing Terraform and Helm files in the repo
        output: >
          Authentik has a configured OAuth2/OIDC application, a client ID and secret
          accessible to the auth subgraph, an enrollment flow for registration, and
          an authentication flow for login and logout. Authentik is healthy and
          reachable both locally and in the Kubernetes cluster.
        edgeCases:
          - Terraform state conflicts with existing resources — do not recreate; provide terraform import guidance
          - Client secret not yet stored as a Kubernetes secret — create the appropriate secret manifest or reference
          - Authentik Helm deployment is not yet running in local environment — surface as a prerequisite and do not proceed with auth service calls until authentik is healthy
        integrationTestPlan:
          - id: INT-FEAT03-01
            scenario: Authentik OAuth2 application is reachable
            description: From the auth subgraph, call the authentik token endpoint using the configured client credentials — expect a valid response
          - id: INT-FEAT03-02
            scenario: Enrollment flow exists
            description: Confirm the enrollment flow slug is present in authentik — expect HTTP 200 on the flow endpoint
          - id: INT-FEAT03-03
            scenario: Authentication flow exists
            description: Confirm the authentication flow slug is present in authentik — expect HTTP 200 on the flow endpoint

      - id: FEAT-04
        title: Register UI
        type: frontend
        description: >
          A simple React page at /register with an email field, a password field,
          and a submit button. On submit, calls the register mutation via Apollo
          Router. Displays a success message on success and an error message on
          failure. No styling requirements beyond basic HTML usability. Use the
          existing React project structure in the monorepo — read the frontend
          project before scaffolding to follow established conventions.
        component: RegisterPage React component; React Router route /register
        claudeDesignURL: null
        input: User-entered email and password; form submit action
        output: >
          Success message rendered on screen on success.
          Error message rendered on screen on failure.
          No navigation on success.
        uiInteractions:
          - Empty field validation shown inline on submit attempt before mutation is called
          - Error message displayed below the form on API failure
          - Success message displayed on success
          - Loading state on the submit button while the mutation is in flight
        responsiveBreakpoints: inherit from existing frontend design system
        graphqlChanges: false
        edgeCases:
          - Apollo Router is unreachable — display a network error message
          - Mutation returns a GraphQL error — display the error message from the response
          - User submits with empty fields — show inline validation before calling the mutation
        integrationTestPlan:
          - id: INT-FEAT04-01
            scenario: Register page renders
            description: Navigate to /register — expect the email field, password field, and submit button to be present in the DOM
          - id: INT-FEAT04-02
            scenario: Empty field validation fires before mutation
            description: Submit the register form with empty fields — expect inline validation errors and confirm the mutation was not called

  - id: US-02
    title: User Sign In
    persona: A registered user returning to the application
    goal: Sign in with their email and password
    outcome: They receive a full token set stored in localStorage and are confirmed as authenticated
    labels:
      - authentication
      - login
      - backend
      - frontend
      - e2e
    acceptanceCriteria:
      - A registered user can sign in with correct credentials and receive a full token set (access, refresh, and ID token)
      - An incorrect password returns a clear error message to the client
      - A non-existent email returns a clear error message to the client
      - On successful login, the full token set is stored in localStorage
      - The login mutation is accessible through Apollo Router
    e2eTestPlan:
      - id: E2E-US02-01
        scenario: Successful sign in
        given: A registered user is on the sign-in page
        when: They submit correct credentials
        then: A success message is shown and localStorage contains the full token set under auth_access_token, auth_refresh_token, and auth_id_token
      - id: E2E-US02-02
        scenario: Incorrect password
        given: A user is on the sign-in page
        when: They submit an incorrect password
        then: A clear error message is displayed and localStorage is not written to
      - id: E2E-US02-03
        scenario: Non-existent email
        given: A user is on the sign-in page
        when: They submit an email that does not exist
        then: A clear error message is displayed and localStorage is not written to
      - id: E2E-US02-04
        scenario: Empty fields
        given: A user is on the sign-in page
        when: They submit with empty fields
        then: A validation error is shown and the mutation is not called
    features:
      - id: FEAT-05
        title: Login Mutation
        type: backend
        description: >
          Expose a login GraphQL mutation on the auth subgraph. Accept email and
          password, authenticate against authentik using the configured OAuth2/OIDC
          client credentials and authentication flow, and return the full token set
          on success. Implement on the same ./servers/auth service as FEAT-01,
          replacing its existing signIn mutation.
        component: ./servers/auth
        claudeDesignURL: null
        uiInteractions: null
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - auth
        input: >
          mutation login(email: String!, password: String!): AuthPayload
        output: >
          AuthPayload { accessToken: String!, refreshToken: String!, idToken: String! }
          on success; structured GraphQL error on failure
        edgeCases:
          - Authentik API is unreachable — return a service unavailable GraphQL error
          - Incorrect password — return an invalid credentials GraphQL error; do not distinguish between wrong password and wrong email in the client-facing message for security
          - Non-existent email — return the same invalid credentials error as incorrect password
          - Authentik returns an unexpected response shape — log the raw response server-side and return a generic server error to the client
        integrationTestPlan:
          - id: INT-FEAT05-01
            scenario: Valid login via Apollo Router
            description: Call login mutation via Apollo Router with valid credentials — expect a response containing accessToken, refreshToken, and idToken
          - id: INT-FEAT05-02
            scenario: Incorrect password via Apollo Router
            description: Call login mutation via Apollo Router with incorrect password — expect a structured GraphQL error with an invalid credentials message
          - id: INT-FEAT05-03
            scenario: Non-existent email via Apollo Router
            description: Call login mutation via Apollo Router with a non-existent email — expect a structured GraphQL error with an invalid credentials message
          - id: INT-FEAT05-04
            scenario: Empty fields via Apollo Router
            description: Call login mutation via Apollo Router with empty email and password — expect a GraphQL validation error

      - id: FEAT-06
        title: Sign In UI and Token Storage
        type: frontend
        description: >
          A simple React page at /login with an email field, a password field, and a
          submit button. On submit, calls the login mutation via Apollo Router. On
          success, stores the full token set in localStorage and displays a success
          message. On failure, displays an error message. No styling requirements
          beyond basic HTML usability.
        component: LoginPage React component; React Router route /login
        claudeDesignURL: null
        input: User-entered email and password; form submit action
        output: >
          On success: full token set written to localStorage keys auth_access_token,
          auth_refresh_token, auth_id_token; success message rendered.
          On failure: error message rendered; localStorage not written to.
        uiInteractions:
          - Empty field validation shown inline on submit attempt before mutation is called
          - Loading state on the submit button while the mutation is in flight
          - Error message displayed below the form on failure
          - Success message displayed on success
        responsiveBreakpoints: inherit from existing frontend design system
        graphqlChanges: false
        edgeCases:
          - Apollo Router is unreachable — display a network error message
          - Mutation returns a GraphQL error — display the error message from the response
          - localStorage is unavailable — catch the exception and display a storage error message
          - User submits with empty fields — show inline validation before calling the mutation
        integrationTestPlan:
          - id: INT-FEAT06-01
            scenario: Login page renders
            description: Navigate to /login — expect the email field, password field, and submit button to be present in the DOM
          - id: INT-FEAT06-02
            scenario: Empty field validation fires before mutation
            description: Submit the login form with empty fields — expect inline validation errors and confirm the mutation was not called

  - id: US-03
    title: User Sign Out
    persona: A signed-in user who wants to end their session
    goal: Sign out of the application
    outcome: Their localStorage is cleared and their session is fully invalidated in authentik via RP-initiated logout
    labels:
      - authentication
      - logout
      - backend
      - frontend
      - e2e
    acceptanceCriteria:
      - A signed-in user can sign out and their localStorage tokens are cleared
      - After sign out, the authentik session is fully invalidated server-side not just cleared locally
      - Attempting to sign out with an invalid or expired token returns a clear error message
      - The logout mutation is accessible through Apollo Router
    e2eTestPlan:
      - id: E2E-US03-01
        scenario: Successful sign out
        given: A signed-in user is on the sign-out page
        when: They click sign out
        then: localStorage is cleared and a success message is displayed
      - id: E2E-US03-02
        scenario: Session invalidated in authentik
        given: Authentik confirms the session is invalidated after logout
        when: The same token is used in a subsequent logout call
        then: An invalid or expired token error is returned
      - id: E2E-US03-03
        scenario: Malformed or missing token
        given: A user calls logout with a malformed or missing token
        when: The logout mutation is called
        then: A clear error message is returned and localStorage is cleared on the client regardless
    features:
      - id: FEAT-07
        title: Logout Mutation
        type: backend
        description: >
          Expose a logout GraphQL mutation on the auth subgraph. Accept the access
          token, perform a full RP-initiated logout against authentik to invalidate
          the server-side session and revoke the token, and return success or error.
          Implement on the same ./servers/auth service as FEAT-01, replacing its
          existing signOut mutation.
        component: ./servers/auth
        claudeDesignURL: null
        uiInteractions: null
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - auth
        input: >
          mutation logout(accessToken: String!): LogoutPayload
        output: >
          LogoutPayload { success: Boolean!, message: String! } on success;
          structured GraphQL error on failure
        edgeCases:
          - Authentik API is unreachable — return a service unavailable GraphQL error
          - Token is already expired or invalid — return a clear invalid token GraphQL error
          - Authentik returns an unexpected response on the logout call — log the raw response server-side and return a generic server error to the client
          - Empty token string passed — reject at the resolver level before calling authentik
        integrationTestPlan:
          - id: INT-FEAT07-01
            scenario: Valid logout via Apollo Router
            description: Call logout mutation via Apollo Router with a valid access token — expect { success true } and confirm the session is invalidated in authentik
          - id: INT-FEAT07-02
            scenario: Already-invalidated token via Apollo Router
            description: Call logout mutation via Apollo Router with an already-invalidated token — expect a structured GraphQL error with an invalid token message
          - id: INT-FEAT07-03
            scenario: Empty token via Apollo Router
            description: Call logout mutation via Apollo Router with empty token string — expect a GraphQL validation error
          - id: INT-FEAT07-04
            scenario: Malformed token via Apollo Router
            description: Call logout mutation via Apollo Router with a malformed token — expect a structured GraphQL error

      - id: FEAT-08
        title: Sign Out UI
        type: frontend
        description: >
          A simple React page at /logout with a sign-out button. On click, reads
          the access token from localStorage, calls the logout mutation via Apollo
          Router, clears all auth keys from localStorage on completion (regardless
          of mutation success or failure), and displays a success or error message.
          No styling requirements beyond basic HTML usability.
        component: LogoutPage React component; React Router route /logout
        claudeDesignURL: null
        input: Sign-out button click; access token read from localStorage auth_access_token
        output: >
          On success: auth_access_token, auth_refresh_token, auth_id_token removed
          from localStorage; success message rendered.
          On failure: error message rendered; localStorage still cleared on the
          client side regardless of backend response.
        uiInteractions:
          - Loading state on the sign-out button while the mutation is in flight
          - Success message displayed after localStorage is cleared
          - Error message displayed if the mutation fails; localStorage still cleared
        responsiveBreakpoints: inherit from existing frontend design system
        graphqlChanges: false
        edgeCases:
          - No token found in localStorage when sign out is clicked — skip the mutation call, clear localStorage anyway, display a message that the user was not signed in
          - Apollo Router is unreachable — clear localStorage anyway and display a network error message
          - Mutation returns a GraphQL error — clear localStorage anyway and display the error message
        integrationTestPlan:
          - id: INT-FEAT08-01
            scenario: Logout page renders
            description: Navigate to /logout — expect the sign-out button to be present in the DOM
          - id: INT-FEAT08-02
            scenario: localStorage cleared even on mutation failure
            description: With a token in localStorage, simulate a mutation failure — expect localStorage to be cleared regardless of the backend response
