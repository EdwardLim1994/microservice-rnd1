# Apollo Federation v2 SDL — auth-subgraph
# Release: v0.1.0
# Feature references: FEAT-5
# Implementation target: ./servers/auth-subgraph/src/schema/
#
# signIn and signOut already exist in the auth service and are untouched.
# This file adds only the changePassword mutation introduced by FEAT-5.
# The existing self-service signUp operation must be marked @inaccessible
# so Apollo Router never exposes it to external clients.

extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.0", import: [
    "@key", "@shareable", "@external",
    "@requires", "@provides", "@override", "@inaccessible"
  ])

"""
Result returned after a successful password change.
"""
type ChangePasswordResult {
  """
  True when the password was updated and mustChangePassword was cleared on
  the Authentik account.
  """
  success: Boolean!
}

extend type Mutation {
  """
  Changes the authenticated employee's password via Authentik and clears the
  mustChangePassword flag. Requires a valid JWT in the Authorization header.
  Returns UNAUTHENTICATED if currentPassword does not match.
  Returns BAD_USER_INPUT if newPassword is identical to currentPassword.
  """
  changePassword(
    "The employee's current password for verification."
    currentPassword: String!
    "The new password to set. Must differ from currentPassword."
    newPassword: String!
  ): ChangePasswordResult!
}
