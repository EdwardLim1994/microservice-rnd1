release: v0.1.0
chore: false

services:
  - name: auth
    type: grpc
    path: ./servers/auth
    subgraph: ./servers/auth-subgraph
    deploy: true

  - name: employee
    type: grpc
    path: ./servers/employee
    subgraph: ./servers/employee-subgraph
    deploy: true

  - name: leave
    type: grpc
    path: ./servers/leave
    subgraph: ./servers/leave-subgraph
    deploy: true

  - name: payslip
    type: grpc
    path: ./servers/payslip
    subgraph: ./servers/payslip-subgraph
    deploy: true

  - name: notification
    type: grpc
    path: ./servers/notification
    subgraph: ./servers/notification-subgraph
    deploy: true

  - name: cron
    type: grpc
    path: ./servers/cron
    subgraph: null
    deploy: true
    note: "Standalone long-running service. No subgraph. Exposes /health only."

  - name: hr-portal
    type: webapp
    path: ./apps/hr-portal
    deploy: true
