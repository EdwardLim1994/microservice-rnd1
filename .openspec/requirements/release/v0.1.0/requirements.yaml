---
release: v0.1.0
date: 2026-07-20
releaseBranch: release/v0.1.0
hotfix: false

affectedSubgraphs:
  - auth-subgraph
  - employee-subgraph
  - leave-subgraph
  - payslip-subgraph
  - notification-subgraph

userStories:

  - id: US-1
    title: HR Admin Employee Registration and Supervisor Assignment
    persona: HR Admin
    goal: Register new employees into the system and optionally assign a supervisor
    outcome: >
      A new Employee record and Authentik account are created with mustChangePassword
      true. A temporary password is returned to the HR Admin for manual delivery to
      the employee. Supervisor assignment is gated on the assignee having served 5+
      years, computed inline from createdAt at assignment time.
    labels:
      - user-story
      - e2e
    acceptanceCriteria:
      - HR Admin can register a new employee supplying firstName, lastName, gender,
        email, grossSalary, salaryPerDay, and an optional supervisorId
      - Registration creates an Employee record and an Authentik account in the
        employee Authentik group with mustChangePassword set to true; a temporary
        password is returned in the response
      - HR Admin can list all employees including resolved supervisor name
      - HR Admin can assign a supervisor to an employee; the system rejects the
        assignment if the target supervisor's createdAt is fewer than 5 years ago
      - A successful supervisor assignment updates Employee.supervisorId and updates
        the Authentik account group to supervisor
    e2eTestPlan:
      - id: E2E-1-1
        scenario: Successful employee registration
        given: HR Admin is authenticated
        when: HR Admin submits the Register Employee form with valid data
        then: >
          New employee appears in the employees table; result screen shows
          temporary password with a working copy button
      - id: E2E-1-2
        scenario: Supervisor assignment — eligible target
        given: An employee whose createdAt is more than 5 years ago exists
        when: HR Admin assigns that employee as supervisor for another employee
        then: The employee row in the table reflects the updated supervisor name
      - id: E2E-1-3
        scenario: Supervisor assignment — ineligible target
        given: An employee whose createdAt is fewer than 5 years ago exists
        when: HR Admin attempts to assign that employee as supervisor
        then: An error is returned and the assignment is not persisted
    features:

      - id: FEAT-1
        title: Register new employee
        type: fullstack
        description: >
          HR Admin submits a registration form. The employee service creates an
          Employee record, then calls the auth service to create an Authentik
          account in the employee group with mustChangePassword true. The generated
          temporary password is returned to the caller.
          Frontend: Register Employee modal — fields for full name, employee ID,
          gender, email, role dropdown (Employee / Supervisor / HR Admin), department,
          gross salary, salary per day, supervisor search with inline filtered list.
          On success shows result screen with temporary password and copy button.
        component: employee-subgraph.EmployeeService.RegisterEmployee
        input: firstName, lastName, gender, email, grossSalary, salaryPerDay, supervisorId (optional)
        output: Employee record + temporaryPassword string
        edgeCases:
          - Duplicate email must return CONFLICT error
          - Missing required fields must return BAD_USER_INPUT error
          - Auth service failure must roll back the Employee record (saga compensation)
          - supervisorId provided but not found must return NOT_FOUND error
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Register Employee button opens modal
          - Supervisor search filters the list of existing supervisors inline by name
          - Submit shows loading state (opacity 0.6, label "Submitting…")
          - On success form is replaced by result screen showing temporary password
          - Copy button writes password to clipboard and shows "Copied!" for 1.5 s
          - Done button closes modal and resets form state
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - employee-subgraph
          - auth-subgraph
        integrationTestPlan:
          - id: INT-1-1
            scenario: >
              POST registerEmployee mutation with valid input returns Employee record
              and non-empty temporaryPassword
          - id: INT-1-2
            scenario: >
              POST registerEmployee mutation with duplicate email returns CONFLICT error
          - id: INT-1-3
            scenario: >
              POST registerEmployee mutation with a missing required field returns
              BAD_USER_INPUT error

      - id: FEAT-2
        title: List employees
        type: fullstack
        description: >
          HR Admin views a table of all employees. The employee service returns all
          Employee records with supervisor name resolved via self-reference.
          Frontend: Employees page table — columns Employee ID, Name, Role, Department,
          Salary (formatted), Supervisor (em dash when none), Status badge.
        component: employee-subgraph.EmployeeService.ListEmployees
        input: none (HR Admin identity from JWT)
        output: List of Employee records with supervisor name resolved
        edgeCases:
          - No employees returns empty table body without error
          - Employee with no supervisor renders em dash in Supervisor column
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Table renders with horizontal scroll on overflow
          - Status badge — Active: #f0fdf4 background / #166534 text; Inactive: #f3f4f6 / #6b7280
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - employee-subgraph
        integrationTestPlan:
          - id: INT-1-4
            scenario: >
              GET employees query returns array of Employee objects with supervisor
              name resolved from supervisorId

      - id: FEAT-3
        title: Assign supervisor to employee
        type: fullstack
        description: >
          HR Admin assigns a supervisor to an existing employee. The employee service
          checks that the target supervisor's createdAt is at least 5 years before
          today (inline, no cron). On success, updates Employee.supervisorId and calls
          auth service to update the Authentik account group to supervisor.
          Frontend: supervisor search within Register Employee modal; also exposed as
          a standalone assign action on the employee table row.
        component: employee-subgraph.EmployeeService.AssignSupervisor
        input: employeeId, supervisorId
        output: Updated Employee record
        edgeCases:
          - Target has served fewer than 5 years — return INELIGIBLE error
          - employeeId or supervisorId not found — return NOT_FOUND error
          - employeeId and supervisorId are the same — return BAD_USER_INPUT error
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Supervisor search filters by name in real time
          - Selected supervisor is highlighted in the dropdown list
          - Ineligible assignment attempt shows error toast
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - employee-subgraph
          - auth-subgraph
        integrationTestPlan:
          - id: INT-1-5
            scenario: >
              POST assignSupervisor mutation with a supervisor whose createdAt is
              more than 5 years ago returns updated Employee record
          - id: INT-1-6
            scenario: >
              POST assignSupervisor mutation with a supervisor whose createdAt is
              fewer than 5 years ago returns INELIGIBLE error

  - id: US-2
    title: Employee Authentication
    persona: Employee
    goal: Sign in to the portal, change password on first login, and sign out
    outcome: >
      Employee accesses the portal using credentials supplied by HR Admin.
      When mustChangePassword is true on the Authentik account, the portal
      intercepts and renders a custom change-password screen before granting access.
      Employee can sign out to clear their session.
    labels:
      - user-story
      - e2e
    acceptanceCriteria:
      - Employee can sign in with email and password; the JWT groups claim determines role
      - When mustChangePassword is true the frontend redirects to a change-password
        screen built in the portal (not Authentik's UI) before entering the app
      - After a successful password change the employee lands on their role default page
      - Employee can sign out, clearing the session token
      - The public self-service sign-up endpoint is inaccessible via Apollo Router
        (marked @inaccessible in the auth subgraph schema)
    e2eTestPlan:
      - id: E2E-2-1
        scenario: Successful sign-in — existing password
        given: Employee has credentials and mustChangePassword is false
        when: Employee submits the login form
        then: Employee is redirected to their role-based default page
      - id: E2E-2-2
        scenario: First-time login — forced password change
        given: Employee has temporary credentials and mustChangePassword is true
        when: Employee submits the login form
        then: >
          Portal renders the change-password screen; after successful change,
          employee lands on their role-based default page
      - id: E2E-2-3
        scenario: Sign out
        given: Employee is authenticated
        when: Employee clicks Log Out in the profile dropdown
        then: Session is cleared and the login screen is shown
    features:

      - id: FEAT-4
        title: Sign in
        type: fullstack
        description: >
          Employee submits email and password. Auth service authenticates against
          Authentik and returns a JWT. The JWT groups claim (hr-admin / supervisor /
          employee) determines the user's role and default landing page. Backend is
          untouched — CI decides if fixes are needed.
          Frontend: login screen — email input, password input, role note ("Your role
          is determined automatically from your account"), Log In button, Forgot
          password link that navigates to the forgot-password flow.
        component: auth-subgraph.AuthService.SignIn
        input: email, password
        output: JWT access token, mustChangePassword boolean
        edgeCases:
          - Invalid credentials must return UNAUTHENTICATED error
          - Missing email or password must return BAD_USER_INPUT error
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Log In button submits the form
          - Forgot password link navigates to the forgot-password view
          - When signIn returns mustChangePassword true, redirect to change-password screen
          - On success redirect to role-based default page (HR Admin → Employees,
            Employee / Supervisor → Dashboard)
        responsiveBreakpoints: null
        graphqlChanges: false
        integrationTestPlan:
          - id: INT-2-1
            scenario: >
              POST signIn mutation with valid credentials returns a non-empty JWT
              and a mustChangePassword boolean

      - id: FEAT-5
        title: First-time forced password change
        type: fullstack
        description: >
          When signIn returns mustChangePassword true, the frontend renders a
          change-password screen. A new changePassword mutation is added to the auth
          subgraph; it calls Authentik's password change API and clears the
          mustChangePassword flag. On success the employee lands on their default page.
          Frontend: dedicated screen with current password, new password, and confirm
          new password fields. Confirm mismatch is validated client-side only.
        component: auth-subgraph.AuthService.ChangePassword
        input: currentPassword, newPassword (employee identity from JWT)
        output: success boolean
        edgeCases:
          - currentPassword mismatch must return UNAUTHENTICATED error
          - newPassword identical to currentPassword must return BAD_USER_INPUT error
          - Confirm new password mismatch is a client-side only validation
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Screen shown automatically after login when mustChangePassword is true
          - Confirm new password mismatch renders an inline client-side error
          - On success redirect to role-based default page
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - auth-subgraph
        integrationTestPlan:
          - id: INT-2-2
            scenario: >
              POST changePassword mutation with correct currentPassword and a valid
              differing newPassword returns success true and clears mustChangePassword

      - id: FEAT-6
        title: Sign out
        type: fullstack
        description: >
          Employee clicks Log Out. Auth service revokes the Authentik session token.
          Frontend clears local token state and redirects to the login screen.
          Backend is untouched — CI decides if fixes are needed.
        component: auth-subgraph.AuthService.SignOut
        input: JWT from Authorization header
        output: success boolean
        edgeCases:
          - Already-expired token must still return success (idempotent)
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Log Out in profile dropdown fires signOut mutation then clears client state
          - After signOut the login screen is shown and role / page state is reset
        responsiveBreakpoints: null
        graphqlChanges: false
        integrationTestPlan:
          - id: INT-2-3
            scenario: >
              POST signOut mutation with a valid JWT returns success true

  - id: US-3
    title: Employee Leave Management
    persona: Employee
    goal: Submit leave requests and track their history and status
    outcome: >
      Employee submits a leave request specifying type, date range, and reason.
      The leave service persists the record and produces a Kafka notification event
      targeting the employee's supervisor. Employee can view all their leave requests
      with computed status PENDING / APPROVED / REJECTED.
    labels:
      - user-story
      - e2e
    acceptanceCriteria:
      - Employee can submit a leave request with type (Annual, Medical, Emergency,
        Unpaid), startDate, endDate, and reason
      - On submission a Kafka notification event is produced targeting the employee's
        assigned supervisor; if no supervisor is assigned the event is skipped and
        no error is returned
      - Employee can view all their leave requests with correct computed status
      - Leave type Unpaid is available in the type dropdown alongside Annual,
        Medical, and Emergency
    e2eTestPlan:
      - id: E2E-3-1
        scenario: Submit leave request
        given: Employee is authenticated and has a supervisor assigned
        when: Employee fills and submits the Apply Leave form
        then: >
          New request appears at the top of the history table with PENDING status;
          green success toast is shown for 3 seconds
      - id: E2E-3-2
        scenario: View leave history with mixed statuses
        given: Employee has approved, rejected, and pending leave requests
        when: Employee navigates to the Leave Requests page
        then: All rows show correct status badges with the specified colours
    features:

      - id: FEAT-7
        title: Submit leave request
        type: fullstack
        description: >
          Employee submits a leave request. Leave service persists a LeaveRequest
          record (employeeId, type, startDate, endDate, reason, requestedAt). After
          persisting, produces a Kafka message on the notification topic with
          recipientEmployeeId set to the employee's supervisorId.
          Frontend: Apply Leave modal — leave type dropdown (Annual, Medical,
          Emergency, Unpaid), start date picker, end date picker, reason textarea.
          Submit shows loading state; on success closes modal and shows green toast.
        component: leave-subgraph.LeaveService.SubmitLeaveRequest
        input: type, startDate, endDate, reason (employeeId from JWT)
        output: LeaveRequest record
        edgeCases:
          - startDate after endDate must return BAD_USER_INPUT error
          - startDate or endDate missing must return BAD_USER_INPUT error
          - Invalid leave type value must return BAD_USER_INPUT error
          - No supervisor assigned — Kafka event skipped, leave request still saved,
            no error returned to client
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Apply Leave button opens modal
          - Leave type dropdown includes Annual, Medical, Emergency, Unpaid
          - Submit shows loading state (opacity 0.6, label "Submitting…")
          - On success modal closes, green toast shown for 3 s, new row prepended to table
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - leave-subgraph
        integrationTestPlan:
          - id: INT-3-1
            scenario: >
              POST submitLeaveRequest mutation with valid input returns LeaveRequest
              record with requestedAt populated
          - id: INT-3-2
            scenario: >
              POST submitLeaveRequest mutation with startDate after endDate returns
              BAD_USER_INPUT error

      - id: FEAT-8
        title: View own leave request history
        type: fullstack
        description: >
          Employee views all their leave requests. The leave service joins LeaveRequest
          records with their LeaveApproval and computes status: PENDING when no
          approval exists, APPROVED when approval.status is true, REJECTED when false.
          Frontend: Leave Requests page — table columns Type, Start, End, Reason,
          Status badge, Submitted. Empty state shows "No leave requests yet."
        component: leave-subgraph.LeaveService.GetMyLeaveRequests
        input: employeeId from JWT
        output: List of LeaveRequest with computed status and linked approval
        edgeCases:
          - Employee with no leave requests returns empty list without error
          - Rejected request must carry rejection reason accessible in the response
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Status badge colours — PENDING: #ca8a04 bg / white text; APPROVED: #16a34a / white;
            REJECTED: #dc2626 / white
          - Empty state centred grey text "No leave requests yet."
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - leave-subgraph
        integrationTestPlan:
          - id: INT-3-3
            scenario: >
              GET myLeaveRequests query returns list with correct computed status for
              approved, rejected, and pending records

  - id: US-4
    title: Supervisor Leave Approval
    persona: Supervisor
    goal: Review and decide on leave requests from managed employees
    outcome: >
      Supervisor sees all leave requests from their direct reports and can approve
      or reject each one. Rejection requires a mandatory reason. Each decision
      produces a Kafka notification event targeting the requesting employee.
    labels:
      - user-story
      - e2e
    acceptanceCriteria:
      - Supervisor can view all leave requests from employees where Employee.supervisorId
        matches the authenticated supervisor's ID
      - Supervisor can approve a request; a LeaveApproval record is created with
        status true and processedAt populated
      - Supervisor can reject a request with a mandatory reason; a LeaveApproval
        record is created with status false, reason, and processedAt populated
      - Each approve or reject action produces a Kafka notification event targeting
        the requesting employee
      - Approved and rejected requests remain visible in the list with their status
    e2eTestPlan:
      - id: E2E-4-1
        scenario: Approve leave request
        given: Supervisor is authenticated and has a pending request from a report
        when: Supervisor opens the request detail and selects Approve then confirms
        then: Row status changes to APPROVED; success toast shown
      - id: E2E-4-2
        scenario: Reject leave request with reason
        given: Supervisor is authenticated and has a pending request from a report
        when: Supervisor opens detail, selects Reject, enters a reason, and confirms
        then: Row status changes to REJECTED; rejection reason visible in detail modal
      - id: E2E-4-3
        scenario: Reject without reason is blocked
        given: Supervisor is on the reject confirm modal
        when: Reason textarea is empty
        then: Confirm button is disabled (opacity 0.5)
    features:

      - id: FEAT-9
        title: View leave requests from managed employees
        type: fullstack
        description: >
          Supervisor views all LeaveRequest records for employees where
          Employee.supervisorId equals the authenticated supervisor's ID. Records
          include computed status and employee name resolved via the employee-subgraph
          reference stub.
          Frontend: Leave Approvals page — table columns Employee, Type, Start, End,
          Reason, Submitted, Status badge. Row click opens detail modal. Empty state
          shows "No pending leave requests from your reports."
        component: leave-subgraph.LeaveService.GetManagedLeaveRequests
        input: supervisorId from JWT
        output: List of LeaveRequest with employee name and computed status
        edgeCases:
          - Supervisor with no reports returns empty list
          - Supervisor with reports but no requests returns empty list
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Table rows are clickable and open the leave detail modal
          - Status badges use same colour scheme as employee leave history
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - leave-subgraph
          - employee-subgraph
        integrationTestPlan:
          - id: INT-4-1
            scenario: >
              GET managedLeaveRequests query returns only requests from employees
              whose supervisorId matches the authenticated supervisor

      - id: FEAT-10
        title: Approve leave request
        type: fullstack
        description: >
          Supervisor approves a pending leave request. Leave service creates a
          LeaveApproval record (status true, processedAt now, supervisorId from JWT).
          After persisting, produces a Kafka notification event targeting the
          requesting employee.
          Frontend: detail modal Actions dropdown → Approve → confirm modal with
          green Approve button.
        component: leave-subgraph.LeaveService.ApproveLeaveRequest
        input: requestId (supervisorId from JWT)
        output: LeaveApproval record
        edgeCases:
          - Request already approved or rejected must return ALREADY_PROCESSED error
          - Request not belonging to supervisor's reports must return FORBIDDEN error
          - requestId not found must return NOT_FOUND error
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Actions ▾ button in detail modal opens dropdown with Approve and Reject options
          - Approve opens confirm modal with green confirm button
          - On success detail modal closes, row status updates to APPROVED, toast shown
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - leave-subgraph
        integrationTestPlan:
          - id: INT-4-2
            scenario: >
              POST approveLeaveRequest mutation with valid requestId returns
              LeaveApproval with status true and processedAt populated
          - id: INT-4-3
            scenario: >
              POST approveLeaveRequest mutation on an already-processed request
              returns ALREADY_PROCESSED error

      - id: FEAT-11
        title: Reject leave request with reason
        type: fullstack
        description: >
          Supervisor rejects a pending leave request with a mandatory reason.
          Leave service creates a LeaveApproval record (status false, reason,
          processedAt now, supervisorId from JWT). After persisting, produces a
          Kafka notification event targeting the requesting employee.
          Frontend: Actions dropdown → Reject → confirm modal with mandatory reason
          textarea. Confirm button disabled while textarea is empty (opacity 0.5).
        component: leave-subgraph.LeaveService.RejectLeaveRequest
        input: requestId, reason (supervisorId from JWT)
        output: LeaveApproval record
        edgeCases:
          - Empty reason string must return BAD_USER_INPUT error
          - Request already processed must return ALREADY_PROCESSED error
          - Request not belonging to supervisor's reports must return FORBIDDEN error
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Reject confirm modal shows reason textarea; button disabled when empty
          - On success detail modal closes, row status updates to REJECTED, toast shown
          - Rejection reason visible in detail modal when the row is reopened
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - leave-subgraph
        integrationTestPlan:
          - id: INT-4-4
            scenario: >
              POST rejectLeaveRequest mutation with valid requestId and non-empty
              reason returns LeaveApproval with status false and reason populated
          - id: INT-4-5
            scenario: >
              POST rejectLeaveRequest mutation with empty reason returns
              BAD_USER_INPUT error

  - id: US-5
    title: Employee Payslip Access
    persona: Employee
    goal: View generated payslips and download them
    outcome: >
      Employee sees a list of all their generated payslips ordered by most recent
      first. Each payslip can be downloaded via a presigned MinIO URL valid for
      5 minutes.
    labels:
      - user-story
      - e2e
    acceptanceCriteria:
      - Employee can view all their payslips ordered by createdAt descending
      - Each row shows month/year (derived from createdAt) and generation date
      - Download button retrieves a presigned MinIO URL and initiates the browser download
    e2eTestPlan:
      - id: E2E-5-1
        scenario: View and download payslip
        given: Employee is authenticated and has at least one generated payslip
        when: Employee navigates to Payslips page and clicks Download on a row
        then: Browser initiates download of the payslip PDF via the presigned URL
    features:

      - id: FEAT-12
        title: View payslip list
        type: fullstack
        description: >
          Payslip service returns all Payslip records for the authenticated employee
          ordered by createdAt descending.
          Frontend: Payslips page — table columns Month (formatted as "June 2026"
          derived from createdAt), Generated Date, Download action button.
        component: payslip-subgraph.PayslipService.GetMyPayslips
        input: employeeId from JWT
        output: List of Payslip records (id, url, createdAt, updatedAt)
        edgeCases:
          - Employee with no payslips returns empty list without error
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Table columns Month, Generated Date, Download button (blue outlined)
          - Month formatted as "June 2026" derived from createdAt
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - payslip-subgraph
        integrationTestPlan:
          - id: INT-5-1
            scenario: >
              GET myPayslips query returns list of Payslip records ordered by
              createdAt descending

      - id: FEAT-13
        title: Download payslip via presigned MinIO URL
        type: fullstack
        description: >
          When employee clicks Download, the payslip service generates a presigned
          MinIO URL from the stored object path (Payslip.url) and returns it.
          Frontend opens the URL to trigger the browser download. URL expires after
          5 minutes.
        component: payslip-subgraph.PayslipService.GetPayslipDownloadURL
        input: payslipId (employeeId from JWT for ownership check)
        output: presigned URL string (5-minute expiry)
        edgeCases:
          - payslipId not belonging to requesting employee must return FORBIDDEN error
          - MinIO object not found must return NOT_FOUND error
          - Presigned URL expiry is fixed at 5 minutes
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Download button calls payslipDownloadURL query and opens resulting URL
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - payslip-subgraph
        integrationTestPlan:
          - id: INT-5-2
            scenario: >
              GET payslipDownloadURL query with valid payslipId owned by the
              authenticated employee returns a non-empty presigned URL string
          - id: INT-5-3
            scenario: >
              GET payslipDownloadURL query with a payslipId belonging to a
              different employee returns FORBIDDEN error

  - id: US-6
    title: Cron Monthly Payslip Generation
    persona: System (cron)
    goal: Automatically generate monthly payslips for all active employees
    outcome: >
      On the first day of each month the cron job iterates all active employees,
      calculates net salary accounting for approved unpaid leave days in the prior
      month, generates a PDF, saves it to MinIO, writes a Payslip record via the
      payslip gRPC service, and produces a Kafka notification event.
    labels:
      - user-story
    acceptanceCriteria:
      - Cron triggers on the 1st of each month targeting the prior calendar month
      - Counts approved unpaid LeaveRequest calendar days within the prior month
        (no weekend or public holiday exclusion)
      - Net salary formula: grossSalary - (salaryPerDay * totalApprovedUnpaidDays)
      - PDF contains employee name, month/year, gross salary, unpaid days deducted,
        deduction amount, net salary, and generated-at timestamp
      - PDF saved to MinIO; returned object URL stored in Payslip record via
        payslip gRPC CreatePayslip
      - Kafka notification event produced to notification topic after successful save
      - MinIO connectivity verified under both docker-compose and Kubernetes
      - Cron is idempotent per employee per month — skips if Payslip record
        already exists for that month
    e2eTestPlan: []
    features:

      - id: FEAT-14
        title: Monthly payslip generation cron job
        type: backend
        description: >
          Long-running standalone cron service exposing only a /health endpoint.
          Scheduled to trigger on the 1st of each month. For each active employee:
          1. Queries leave gRPC for approved Unpaid leaves in the prior month
          2. Computes net salary
          3. Generates a PDF using an embedded template engine (content: employee
             name, month/year, gross salary, unpaid days deducted, deduction amount,
             net salary, generated-at timestamp)
          4. Uploads PDF to MinIO; retrieves object URL
          5. Calls payslip gRPC CreatePayslip (employeeId, url)
          6. Produces Kafka notification event (recipientEmployeeId: employeeId)
          MinIO connectivity tested under both docker-compose and Kubernetes.
        component: cron.CronService.GenerateMonthlyPayslips
        input: none (scheduled; reads active employees from employee gRPC)
        output: Payslip records created, Kafka events produced
        edgeCases:
          - Employee with zero unpaid leaves — deduction is 0, net salary equals gross salary
          - MinIO upload failure — log error, skip employee, continue to next
          - payslip gRPC write failure — log error, skip Kafka event for that employee
          - Kafka produce failure — log error only (Payslip record already saved)
          - Idempotency — skip employee if Payslip record already exists for the month
        claudeDesignURL: null
        uiInteractions: null
        responsiveBreakpoints: null
        graphqlChanges: false
        integrationTestPlan:
          - id: INT-6-1
            scenario: >
              Trigger cron for a test employee with 3 approved Unpaid leave days
              in the prior month; assert Payslip record created with net salary
              equal to grossSalary - (salaryPerDay * 3)
          - id: INT-6-2
            scenario: >
              Trigger cron for a test employee with zero approved Unpaid leaves;
              assert Payslip record created with net salary equal to grossSalary
          - id: INT-6-3
            scenario: >
              MinIO connectivity test — upload a test object and retrieve presigned
              URL; assert URL is non-empty and object is retrievable in both
              docker-compose and Kubernetes environments

  - id: US-7
    title: Notification Service
    persona: All (Employee and Supervisor)
    goal: Receive and view real-time in-portal notifications for relevant events
    outcome: >
      Notification service consumes Kafka events and persists Notification records.
      Users see notifications in the bell dropdown with an unread count badge.
      New notifications are pushed in real time via GraphQL subscription over SSE
      through Apollo Router. Opening the bell dropdown marks all notifications as read.
    labels:
      - user-story
      - e2e
    acceptanceCriteria:
      - Kafka consumer persists Notification records for leave-submitted (to supervisor),
        leave-decided (to employee), and payslip-generated (to employee) events
      - Authenticated user can query their notification list ordered by createdAt desc
      - Unread notifications are visually distinct (bold text, #f7f9ff background)
      - Bell icon shows unread count badge when unreadCount > 0
      - Opening the bell dropdown marks all notifications as read (readAt populated)
      - GraphQL subscription pushes new Notification records in real time via SSE
      - Employee can mark individual notifications as read via mutation
    e2eTestPlan:
      - id: E2E-7-1
        scenario: Supervisor receives real-time notification on leave submission
        given: Supervisor is authenticated with SSE subscription active
        when: An employee under the supervisor submits a leave request
        then: >
          New notification appears in supervisor's bell dropdown without page
          refresh; unread badge increments
      - id: E2E-7-2
        scenario: Employee receives real-time notification on leave decision
        given: Employee is authenticated with SSE subscription active
        when: Supervisor approves or rejects the employee's leave request
        then: New notification appears in employee's bell dropdown
      - id: E2E-7-3
        scenario: Mark all as read on dropdown open
        given: Employee has unread notifications
        when: Employee opens the bell dropdown
        then: All notifications are marked read and the unread badge disappears
    features:

      - id: FEAT-15
        title: Kafka consumer — persist notification records
        type: backend
        description: >
          Notification service subscribes to the notification Kafka topic.
          Each message payload contains recipientEmployeeId, title, shortDesc,
          and desc. Consumer persists a Notification record (employeeId, title,
          shortDesc, desc, createdAt; readAt null initially).
        component: notification-subgraph.NotificationService.ConsumeKafkaEvents
        input: "Kafka message: { recipientEmployeeId, title, shortDesc, desc }"
        output: Notification record persisted to database
        edgeCases:
          - Malformed Kafka message must be dead-lettered (logged, skipped, not crashed)
          - recipientEmployeeId not found — log warning and persist anyway
          - Consumer must be idempotent (deduplicate by Kafka offset / message key)
        claudeDesignURL: null
        uiInteractions: null
        responsiveBreakpoints: null
        graphqlChanges: false
        integrationTestPlan:
          - id: INT-7-1
            scenario: >
              Produce a test notification message to the Kafka topic; assert a
              Notification record is created in the database with correct fields

      - id: FEAT-16
        title: Serve notification list per employee
        type: fullstack
        description: >
          Notification subgraph exposes a query returning the authenticated
          employee's notifications ordered by createdAt descending. Response
          includes id, title, shortDesc, desc, readAt, createdAt, updatedAt.
          Frontend: bell dropdown — unread rows bold with #f7f9ff background,
          read rows normal weight on white. Max visible height 320 px with scroll.
          Bell shows unread count badge (red) when unreadCount > 0.
        component: notification-subgraph.NotificationService.GetMyNotifications
        input: employeeId from JWT
        output: List of Notification records ordered by createdAt desc
        edgeCases:
          - Employee with no notifications returns empty list
          - Dropdown renders up to 320 px height then scrolls
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Bell button (38×38 px circle) with red unread count badge top-right
          - Badge hidden when unreadCount is 0
          - Dropdown 320 px wide, max 320 px tall with scroll, 10 px border-radius
          - Unread row — bold text, #f7f9ff background
          - Read row — normal weight, white background
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - notification-subgraph
        integrationTestPlan:
          - id: INT-7-2
            scenario: >
              GET myNotifications query returns list ordered by createdAt desc
              with correct readAt values for read and unread records

      - id: FEAT-17
        title: Mark notifications as read
        type: fullstack
        description: >
          Opening the bell dropdown fires markAllNotificationsRead, setting readAt
          to now on all unread Notification records for the authenticated employee.
          A markNotificationRead mutation is also exposed for individual mark-as-read.
          Frontend: badge count drops to 0 after mutation resolves.
        component: notification-subgraph.NotificationService.MarkNotificationsRead
        input: employeeId from JWT (mark all) or notificationId (mark one)
        output: Updated Notification records
        edgeCases:
          - Already-read notification is a no-op (idempotent)
          - notificationId not belonging to authenticated employee returns FORBIDDEN
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Opening bell dropdown fires markAllNotificationsRead mutation
          - Unread badge count drops to 0 after mutation resolves
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - notification-subgraph
        integrationTestPlan:
          - id: INT-7-3
            scenario: >
              POST markAllNotificationsRead mutation sets readAt on all unread
              Notification records for the authenticated employee

      - id: FEAT-18
        title: Real-time notification push via GraphQL subscription over SSE
        type: fullstack
        description: >
          Notification subgraph exposes a Subscription type (notificationAdded)
          that pushes new Notification records to the authenticated subscriber.
          Apollo Router transports the subscription as SSE to the frontend.
          Frontend subscribes on login and appends incoming notifications to the
          dropdown, incrementing the unread badge. Subscription torn down on logout.
        component: notification-subgraph.NotificationService.NotificationSubscription
        input: employeeId from JWT (subscription scoped to authenticated user)
        output: Stream of Notification records pushed on creation
        edgeCases:
          - Client disconnect must clean up the server-side subscription (no leak)
          - Employee receives only their own notifications — never another user's
          - Apollo Router must be configured for SSE subscription forwarding
        claudeDesignURL: "https://claude.ai/design/p/172c2a11-5f37-4fa7-8a42-5dd734ebf3a1?file=HR+Portal.dc.html&via=share"
        uiInteractions:
          - Frontend opens SSE subscription after successful login
          - Incoming notification increments bell badge and prepends to dropdown list
          - Subscription torn down on logout
        responsiveBreakpoints: null
        graphqlChanges: true
        affectedSubgraphs:
          - notification-subgraph
        integrationTestPlan:
          - id: INT-7-4
            scenario: >
              Open GraphQL subscription via Apollo Router SSE; produce a Kafka
              notification event; assert subscription receives the new Notification
              record within 5 seconds
