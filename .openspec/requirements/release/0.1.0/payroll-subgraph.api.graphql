# Apollo Federation v2 SDL — payroll-subgraph
# Release: 0.1.0
# Feature references: FEAT-3, FEAT-4, FEAT-6, FEAT-9, FEAT-13

extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.0", import: [
    "@key", "@shareable", "@external",
    "@requires", "@provides", "@override", "@inaccessible"
  ])

# Owned by employee-subgraph
type Employee @key(fields: "id") {
  """Internal ID — used to associate payslips with an employee."""
  id: ID! @external
}

"""
Represents a generated payslip record stored in Minio.
"""
type Payslip @key(fields: "id") {
  """Unique internal identifier for the payslip record."""
  id: ID!

  """The employee this payslip was generated for."""
  employee: Employee!

  """Calendar month the payslip covers (1–12)."""
  month: Int!

  """Calendar year the payslip covers (e.g. 2026)."""
  year: Int!

  """Minio object key where the PDF is stored (e.g. payslips/{employeeId}/{year}/{month}.pdf)."""
  minioObjectKey: String!

  """Timestamp when the payslip PDF was generated and stored."""
  generatedAt: String!
}

"""
Result of triggering the monthly payslip generation job.
"""
type GeneratePayslipsResult {
  """List of successfully generated payslip records."""
  generated: [Payslip!]!

  """List of employee IDs for which generation failed. Empty if all succeeded."""
  failed: [ID!]!
}

"""
A short-lived presigned Minio URL for downloading a payslip PDF.
"""
type PayslipDownloadURL {
  """The presigned URL. Valid for 15 minutes from generation."""
  url: String!

  """Timestamp when the presigned URL expires."""
  expiresAt: String!
}

"""
An in-app notification record for an employee.
"""
type Notification @key(fields: "id") {
  """Unique internal identifier for the notification."""
  id: ID!

  """The employee this notification is addressed to."""
  employee: Employee!

  """Human-readable notification message (e.g. 'Your January 2026 payslip is ready')."""
  message: String!

  """Whether the employee has read/dismissed this notification."""
  read: Boolean!

  """Timestamp when the notification was created."""
  createdAt: String!
}

"""
Input for triggering the monthly payslip generation job.
"""
input GeneratePayslipsInput {
  """Month to generate payslips for (1–12)."""
  month: Int!

  """Year to generate payslips for (e.g. 2026)."""
  year: Int!
}

"""
Input for fetching a payslip presigned download URL.
"""
input GetPayslipURLInput {
  """Internal ID of the employee."""
  employeeId: ID!

  """Month of the payslip (1–12)."""
  month: Int!

  """Year of the payslip (e.g. 2026)."""
  year: Int!
}

type Query {
  """
  List all payslips for a given employee, sorted by year and month descending.
  """
  payslips(employeeId: ID!): [Payslip!]!

  """
  Generate and return a short-lived presigned Minio URL for downloading a specific payslip PDF.
  URL is valid for 15 minutes.
  """
  payslipDownloadURL(input: GetPayslipURLInput!): PayslipDownloadURL!

  """
  Fetch all notifications for a given employee.
  Sorted by createdAt descending. Includes read and unread.
  """
  notifications(employeeId: ID!): [Notification!]!
}

type Mutation {
  """
  Trigger monthly payslip generation for all active employees.
  Called by the cron server. Generates a PDF per employee, uploads to Minio,
  persists records to Postgres, and creates a notification per employee.
  Returns lists of succeeded and failed employee IDs.
  """
  generatePayslips(input: GeneratePayslipsInput!): GeneratePayslipsResult!

  """
  Mark a specific notification as read.
  """
  markNotificationRead(id: ID!): Notification!
}
