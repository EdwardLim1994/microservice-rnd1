services:
  {{ name }}:
    build:
      context: ../..
      dockerfile: {{ location }}/{{ name }}/Dockerfile
      args:
        # Build-time only — see Dockerfile's comment on why this can't be a plain `environment:`
        # entry below. Points at the Apollo Router's Docker service name/port, not localhost.
        PUBLIC_GRAPHQL_URL: http://router:4000/graphql
    container_name: {{ name }}_web
    ports:
      - "{{ port }}:{{ port }}"
    env_file:
      - .env
    networks:
      - graphql
    depends_on:
      - router
    restart: unless-stopped

networks:
  graphql:
