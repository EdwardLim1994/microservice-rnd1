apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{name}}
  namespace: \{{ .Values.namespace }}
spec:
  replicas: \{{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{name}}
  template:
    metadata:
      labels:
        app: {{name}}
    spec:
      containers:
        - name: {{name}}
          image: {{name}}:latest
          envFrom:
            - configMapRef:
                name: {{name}}-log-env
