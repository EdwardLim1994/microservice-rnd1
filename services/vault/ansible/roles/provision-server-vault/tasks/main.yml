---
# Every task here is written to be safely re-runnable — Vault dev mode wipes all of this on
# restart (see services/vault/CLAUDE.md), so this isn't a one-shot setup, it's the thing you run
# every time Vault comes back up empty.
#
# Two independent things get provisioned per server, each optional:
#   - database/* (Postgres dynamic creds) — only when db_name is defined (a DB-backed server)
#   - pki_int/*  (short-lived TLS leaf certs, for the mTLS story — see packages/server/CLAUDE.md's
#     TLS section) — controlled by provision_tls (defaults true, see defaults/main.yml), so a
#     GraphQL-only server with no DB (e.g. servers/auth) still gets a TLS identity.
# Both land on the SAME AppRole/policy for the server — one credential pair, however many secrets
# engines it's allowed to touch.

- name: Read current secret engine mounts
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: sys/mounts
  register: current_mounts

- name: Enable the database secrets engine
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: sys/mounts/database
    data:
      type: database
  when: db_name is defined and 'database/' not in current_mounts.data.data

- name: Enable the PKI secrets engine
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: sys/mounts/pki_int
    data:
      type: pki
      config:
        # The mount's own max_lease_ttl is a hard ceiling on *everything* issued from it —
        # including the "Generate this mount's internal root CA" task below, which explicitly
        # requests vault_pki_root_ttl (1yr default). Capping this at vault_pki_max_ttl (a leaf
        # cert's own 24h ceiling) silently truncated the root CA to 24h too, so a leaf issued
        # near the end of that window failed with "TTL would result in notAfter ... beyond the
        # expiration of the CA certificate". Must be at least vault_pki_root_ttl.
        max_lease_ttl: "{{ vault_pki_root_ttl }}"
  when: provision_tls | default(true) and 'pki_int/' not in current_mounts.data.data

# Single self-signed root on this one mount — real intermediate-signed-by-offline-root chains are
# out of scope for a dev-mode Vault that wipes on every restart anyway (same "prototype, not
# production PKI hygiene" acceptance as this repo's other Vault-issued secrets).
- name: Generate this mount's internal root CA
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: pki_int/root/generate/internal
    data:
      common_name: "microservice-rnd1 dev root CA"
      ttl: "{{ vault_pki_root_ttl }}"
  when: provision_tls | default(true) and 'pki_int/' not in current_mounts.data.data

- name: Read currently enabled auth methods
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: sys/auth
  register: current_auth_methods

- name: Enable AppRole auth
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: sys/auth/approle
    data:
      type: approle
  when: "'approle/' not in current_auth_methods.data.data"

- name: Configure the database connection for this server's Postgres
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: "database/config/{{ server_name }}-db"
    data:
      plugin_name: postgresql-database-plugin
      connection_url: "postgresql://{% raw %}{{username}}:{{password}}{% endraw %}@{{ db_host }}:{{ db_port }}/{{ db_name }}?sslmode=disable"
      username: "{{ db_admin_username }}"
      password: "{{ db_admin_password }}"
      allowed_roles: ["{{ server_name }}-role"]
  when: db_name is defined

- name: Create the dynamic-credential database role
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: "database/roles/{{ server_name }}-role"
    data:
      db_name: "{{ server_name }}-db"
      # GRANT ALL PRIVILEGES ON DATABASE only covers database-level rights (CONNECT/CREATE/TEMP)
      # — it does NOT cascade to tables already created by db_admin_username (Prisma migrations
      # run as the static superuser, not as a Vault-issued dynamic user). Without the two grants
      # below, every dynamic credential hits "permission denied for table <X>" on its first real
      # query, table creation timing notwithstanding — these grants apply to whatever tables/
      # sequences already exist in schema public at the moment each dynamic user is created, which
      # is always after migrations have run (a fresh Vault-issued lease is only ever requested at
      # server boot, never before `prisma migrate deploy`).
      creation_statements: >-
        CREATE ROLE "{% raw %}{{name}}{% endraw %}" WITH LOGIN PASSWORD '{% raw %}{{password}}{% endraw %}' VALID UNTIL '{% raw %}{{expiration}}{% endraw %}';
        GRANT ALL PRIVILEGES ON DATABASE "{{ db_name }}" TO "{% raw %}{{name}}{% endraw %}";
        GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO "{% raw %}{{name}}{% endraw %}";
        GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO "{% raw %}{{name}}{% endraw %}";
      default_ttl: "{{ vault_db_default_ttl }}"
      max_ttl: "{{ vault_db_max_ttl }}"
  when: db_name is defined

# allowed_domains left open to any CN this role is asked to issue for (server_name itself, plus
# its docker-compose/k8s Service DNS names) — allow_bare_domains/allow_subdomains cover the
# "<name>", "<name>.<namespace>.svc.cluster.local" shapes this repo's services actually use.
- name: Create this server's TLS leaf-cert role
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: "pki_int/roles/{{ server_name }}-tls-role"
    data:
      allow_any_name: true
      allow_subdomains: true
      client_flag: true
      server_flag: true
      default_ttl: "{{ vault_pki_default_ttl }}"
      max_ttl: "{{ vault_pki_max_ttl }}"
  when: provision_tls | default(true)

- name: Write the policy scoping this server to only its own Vault-issued secrets
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: "sys/policy/{{ server_name }}-policy"
    data:
      policy: |-
        {% if db_name is defined %}
        path "database/creds/{{ server_name }}-role" {
          capabilities = ["read"]
        }
        {% endif %}
        {% if provision_tls | default(true) %}
        path "pki_int/issue/{{ server_name }}-tls-role" {
          capabilities = ["create", "update"]
        }
        {% endif %}

- name: Create the AppRole bound to this server's policy
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: "auth/approle/role/{{ server_name }}-role"
    data:
      token_policies: ["{{ server_name }}-policy"]
      token_ttl: "{{ vault_approle_token_ttl }}"
      token_max_ttl: "{{ vault_approle_token_max_ttl }}"

- name: Read this server's AppRole role_id
  community.hashi_vault.vault_read:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: "auth/approle/role/{{ server_name }}-role/role-id"
  register: role_id_result

- name: Generate a fresh secret_id for this server's AppRole
  community.hashi_vault.vault_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    path: "auth/approle/role/{{ server_name }}-role/secret-id"
    data: {}
  register: secret_id_result

- name: Set facts for the resulting AppRole credentials
  ansible.builtin.set_fact:
    resolved_role_id: "{{ role_id_result.data.data.role_id }}"
    resolved_secret_id: "{{ secret_id_result.data.data.secret_id }}"

# server_env_dir defaults to servers/<name> (every DB-backed server's own shape) but is
# overridable — e.g. services/apollo for the Router's own TLS-client identity, which isn't a
# "server" under servers/ at all.
- name: Check whether the server's real .env exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../../{{ server_env_dir | default('servers/' ~ server_name) }}/.env"
  register: dotenv_stat

# Only ever written into .env (gitignored, real-secret territory) — never .env.sample (committed).
# Vault-issued role_id/secret_id are per-provisioning-run secrets, not template defaults, so
# there's nothing sensible to commit; requires a developer to have already copied .env.sample to
# .env themselves, same convention DatabaseGenerator.ts's appendDatabaseEnv follows for its own
# .env-only writes.
- name: Write VAULT_ROLE_ID into the server's .env, if it exists
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/../../../{{ server_env_dir | default('servers/' ~ server_name) }}/.env"
    regexp: "^VAULT_ROLE_ID="
    line: "VAULT_ROLE_ID={{ resolved_role_id }}"
  when: dotenv_stat.stat.exists

- name: Write VAULT_SECRET_ID into the server's .env, if it exists
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/../../../{{ server_env_dir | default('servers/' ~ server_name) }}/.env"
    regexp: "^VAULT_SECRET_ID="
    line: "VAULT_SECRET_ID={{ resolved_secret_id }}"
  when: dotenv_stat.stat.exists
