# Layered on top of values.yaml for any non-dev apply (services/terraform's
# `environment != "dev"` — sit, uat, staging, prod).
devMode: false

persistence:
  size: 10Gi

# authentik's values-nondev.yaml turns on authentik-postgresql's TLS listener (tls.autoGenerated) —
# this makes db-provision-job.yaml's connection actually encrypt the wire instead of silently
# staying plaintext.
dbSslMode: require

# rootToken is unused once devMode is false — nothing in prod mode ever reads
# VAULT_DEV_ROOT_TOKEN_ID (vault-init-job.yaml mints its own root token via `vault operator
# init`, k8s-auth-provision-job.yaml and every provisioning job authenticate via Kubernetes auth
# instead), but the key stays declared so `helm template`/`--set` overrides don't need a schema
# change. Left as the same placeholder value on purpose — swap it in real usage only if something
# still reads it directly, which nothing here does. Same for every non-dev environment (sit, uat,
# staging, prod), not just prod.
