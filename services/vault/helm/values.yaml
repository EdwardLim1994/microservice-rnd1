namespace: infra

image: hashicorp/vault:1.18

# dev mode: in-memory storage, auto-unsealed, wiped on every restart, single static root token.
# Fine for minikube, not for a real cluster — values-prod.yaml sets this false, switching
# statefulset.yaml to Raft storage + configmap.yaml's vault.hcl, and requires vault-init-job.yaml
# to actually initialize/unseal it.
devMode: true

# Fallback only for `helm template`/local rendering — a real install ignores this and generates
# a random token instead (see templates/secret.yaml). Override this to something else and that
# explicit value is what's used, no randomization.
rootToken: vaultroottoken

persistence:
  size: 1Gi

# Every provisioning Job in this chart (pki/oidc/db-provision, vault-init, k8s-auth-provision)
# uses this. Never, not OnFailure: OnFailure restarts a failed container in place, and once
# backoffLimit is exhausted the Job controller deletes that pod as part of failing the Job —
# leaving nothing to `kubectl logs` after the fact. Never creates a distinct pod per attempt, and
# a failed Never-policy Job's pods stick around for a post-mortem instead of disappearing with
# the failure.
jobRestartPolicy: Never

# db-provision-job.yaml's connection to authentik-postgresql. "disable" only works because dev
# mode's bundled Postgres doesn't offer TLS at all — values-prod.yaml sets "require" (encrypts
# the wire) once authentik's values-prod.yaml also turns TLS on for that Postgres. Known gap:
# this is "require", not "verify-full" — it stops passive wire sniffing but doesn't authenticate
# the server's certificate, so it doesn't stop an on-path attacker impersonating the DB. Getting
# to verify-full needs a CA both sides trust signing that Postgres's cert (e.g. cert-manager +
# services/vault's own pki_int) — a real chunk of work on its own, left for later.
dbSslMode: disable

# Native OIDC login against Authentik (https://integrations.goauthentik.io/vault) — must match
# services/authentik/helm/values.yaml's vaultOidcClientSecret.
oidcClientSecret: vaultoidcclientsecret

# Server-side discovery fetch — see oidc-provision-job.yaml's own comment for why this must
# resolve to the same browser-reachable authority as oidcRedirectUris below, not the in-cluster
# Service DNS name.
oidcDiscoveryUrl: "http://authentik.lan:8080/application/o/vault/"

# oidc/role/default's own allowed_redirect_uris (see oidc-provision-job.yaml) — Vault enforces
# this allow-list independently of whatever Authentik's own vault-provider registers, so this
# must list the exact same hosts as services/authentik/helm/values.yaml's vaultRedirectUris.
# https:8443 entries alongside the http:8080 ones (not replacing) — Vault's UI builds its own
# callback from window.location, so whichever scheme/port the browser used to reach vault.lan
# needs to be in this list.
oidcRedirectUris:
  - http://vault.localhost/ui/vault/auth/oidc/oidc/callback
  - http://vault.lan/ui/vault/auth/oidc/oidc/callback
  - http://vault.lan:8080/ui/vault/auth/oidc/oidc/callback
  - https://vault.lan:8443/ui/vault/auth/oidc/oidc/callback
  - https://vault.localhost:8443/ui/vault/auth/oidc/oidc/callback

# Empty by default — statefulset.yaml's hostAliases falls back to a `lookup` of
# traefik-web-8080's ClusterIP (works fine for a real `helm install`/Terraform). Tilt's own
# helm() is "offline-only" templating with no live cluster access at all, so `lookup` always
# returns nothing there — services/vault/Tiltfile explicitly overrides this to the real,
# already-live ClusterIP it reads itself via `kubectl`, bypassing `lookup` entirely for local dev.
traefikClusterIp: ""
