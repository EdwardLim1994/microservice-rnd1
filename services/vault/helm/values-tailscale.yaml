# Layered on top of values.yaml (see services/terraform/main.tf) alongside
# services/authentik/helm/values-tailscale.yaml's vaultRedirectUris, which must list the exact
# same hosts — Vault enforces its own allow-list independently of whatever Authentik's own
# vault-provider registers.
#
# oidc_discovery_url's own authorization_endpoint response is what actually drives the browser
# redirect (see oidc-provision-job.yaml's comment) — plain http, not https: this fetch resolves
# to Traefik's ClusterIP in-cluster (see the tailnet hostAliases entry in statefulset.yaml), which
# only ever serves plain HTTP, same as the LAN default below.
oidcDiscoveryUrl: "http://raspberrypi94.tail60240b.ts.net:8080/application/o/vault/"

# Helm list values replace rather than merge — this repeats values.yaml's five LAN entries
# alongside the new one rather than losing them, so LAN-direct login keeps working too.
oidcRedirectUris:
  - http://vault.localhost/ui/vault/auth/oidc/oidc/callback
  - http://vault.lan/ui/vault/auth/oidc/oidc/callback
  - http://vault.lan:8080/ui/vault/auth/oidc/oidc/callback
  - https://vault.lan:8443/ui/vault/auth/oidc/oidc/callback
  - https://vault.localhost:8443/ui/vault/auth/oidc/oidc/callback
  # Port 8090 — scripts/port-forward.sh's own APPS map.
  - https://raspberrypi94.tail60240b.ts.net:8090/ui/vault/auth/oidc/oidc/callback
