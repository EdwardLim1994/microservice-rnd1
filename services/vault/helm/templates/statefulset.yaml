apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      {{- include "vault.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vault.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      # Lets the container resolve "authentik.lan" to Traefik's ClusterIP — `vault write
      # auth/oidc/config` (see oidc-provision-job.yaml) validates the discovery URL by fetching
      # it from *this* pod, not from the Job that issues the write, so the hostAlias has to live
      # here too. See services/minio/helm/templates/statefulset.yaml's identical hostAliases for
      # the full reasoning.
      {{- $traefikSvc := lookup "v1" "Service" "infra" "traefik-web-8080" }}
      hostAliases:
        - ip: {{ if .Values.traefikClusterIp }}{{ .Values.traefikClusterIp }}{{ else if $traefikSvc }}{{ $traefikSvc.spec.clusterIP }}{{ else }}127.0.0.1{{ end }}
          hostnames:
            - authentik.lan
      containers:
        - name: vault
          image: "{{ .Values.image }}"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 512Mi
          ports:
            - name: vault
              containerPort: 8200
          {{- if .Values.devMode }}
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: vault-secret
                  key: VAULT_DEV_ROOT_TOKEN_ID
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: vault
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: vault
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /vault/data
          {{- else }}
          command: ["vault", "server", "-config=/vault/config/vault.hcl"]
          # "vault status" exits 0 unsealed/active, 1 on a real error, 2 sealed — sealed is the
          # expected state until vault-init-job.yaml's unseal step runs (or after any pod
          # restart, since Vault always reseals on restart and this repo doesn't wire auto-unseal
          # — see that job's own comment), so readiness (not liveness) is what should key off it:
          # this pod is genuinely alive while sealed, just not able to serve requests yet.
          readinessProbe:
            exec:
              command: ["vault", "status"]
            initialDelaySeconds: 5
            periodSeconds: 10
          # Deliberately NOT an exec/httpGet probe on sys/health: a sealed Vault answers that
          # with a non-2xx/non-zero-exit response too, which would make Kubernetes restart-loop a
          # perfectly healthy-but-sealed process forever. TCP-only liveness just confirms the
          # vault binary is still up and listening.
          livenessProbe:
            tcpSocket:
              port: vault
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /vault/data
            - name: config
              mountPath: /vault/config
      {{- end }}
  {{- if not .Values.devMode }}
      volumes:
        - name: config
          configMap:
            name: vault-config
  {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
