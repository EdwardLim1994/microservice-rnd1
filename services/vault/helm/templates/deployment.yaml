apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  # Always 1 — dev mode is in-memory storage, a second replica would be its own independent Vault
  # with none of the first's configuration. Not a real HA setup, same scope as the docker-compose
  # single container.
  replicas: 1
  selector:
    matchLabels:
      {{- include "vault.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vault.labels" . | nindent 8 }}
    spec:
      # See services/kafka/helm/templates/schema-registry-deployment.yaml's comment — an
      # auto-injected <SVC>_PORT env var crashed that image outright; disabling Service env var
      # injection here too, defensively, same as every other infra pod in this repo.
      enableServiceLinks: false
      containers:
        - name: vault
          image: "{{ .Values.image }}"
          args: ["server", "-dev"]
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          ports:
            - name: vault
              containerPort: 8200
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: vault-secret
                  key: VAULT_DEV_ROOT_TOKEN_ID
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: vault
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: vault
            initialDelaySeconds: 10
            periodSeconds: 20
