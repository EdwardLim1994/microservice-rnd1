# No forward-auth middleware here — Vault gates itself via its own OIDC auth method against
# Authentik (see services/vault/helm/templates/oidc-provision-job.yaml and
# services/authentik/helm/templates/proxy-blueprint-configmap.yaml's vault-provider), same as
# minio.localhost/grafana.localhost.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    - host: vault.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault
                port:
                  number: 8200
    - host: vault.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault
                port:
                  number: 8200
