apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vault.labels" . | nindent 4 }}
  ports:
    - name: vault
      port: 8200
      targetPort: vault
