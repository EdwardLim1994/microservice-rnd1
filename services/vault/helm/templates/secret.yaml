{{/*
A fixed, committed rootToken value (values.yaml's default) is public to anyone who's ever cloned
this repo, forever — fine as long as nothing built on Vault ever gets exposed beyond
"kubectl port-forward" bound to 127.0.0.1 (its own default), but a single "--address 0.0.0.0" to
test from another device on the network turns that public string into full root access for
anyone on the LAN. Generate a real random one at first install instead, and reuse it (via
`lookup`) on every subsequent `helm upgrade` — same idiom Bitnami's postgresql subchart already
uses for its own auto-generated superuser password (see authentik/charts/postgresql/templates/
secrets.yaml). values.yaml's rootToken value is only a fallback for `helm template`/local
rendering, where `lookup` always returns empty.
*/}}
{{- $existing := lookup "v1" "Secret" .Values.namespace "vault-secret" }}
{{- $rootToken := .Values.rootToken }}
{{- if $existing }}
{{- $rootToken = index $existing.data "VAULT_DEV_ROOT_TOKEN_ID" | b64dec }}
{{- else if eq .Values.rootToken "vaultroottoken" }}
{{- $rootToken = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: vault-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
stringData:
  VAULT_DEV_ROOT_TOKEN_ID: {{ $rootToken | quote }}
  VAULT_OIDC_CLIENT_SECRET: {{ .Values.oidcClientSecret | quote }}
