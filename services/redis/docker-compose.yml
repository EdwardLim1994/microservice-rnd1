services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis-data:/data
    networks:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redispassword ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis_insight_ui
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:5540"
    networks:
      - redis
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:

networks:
  redis:
    driver: bridge
