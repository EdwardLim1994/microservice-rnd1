services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redispassword
    volumes:
      - redis-data:/data
    networks:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redispassword ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis_commander_ui
    restart: always
    ports:
      - "8091:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:redispassword
    networks:
      - redis
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:

networks:
  redis:
    driver: bridge
