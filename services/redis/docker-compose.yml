services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis-data:/data
    networks:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redispassword ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis_insight_ui
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:5540"
    networks:
      - redis
      - traefik
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.redisinsight.rule=Host(`redis.localhost`)
      - traefik.http.routers.redisinsight.middlewares=admin-auth
      - traefik.http.services.redisinsight.loadbalancer.server.port=5540

volumes:
  redis-data:

networks:
  redis:
    driver: bridge
  # Empty here on purpose — real definition lives in services/traefik/docker-compose.yml (see
  # that file's own comment on this pattern, mirroring services/vault's "adminer" reference).
  traefik:
