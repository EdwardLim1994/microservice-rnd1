# Layered on top of values.yaml (see services/terraform/argocd.tf) for local dev when ArgoCD is
# reached through scripts/port-forward.sh from another device, not the LAN — "argocd.lan"
# (values.yaml's default configs.cm.url) isn't reachable from off-LAN. ArgoCD validates its own
# `return_url` param against this same url, so the browser-facing login redirect needs to point
# at the tailscale tunnel scripts/port-forward.sh already opens for argocd-server instead — see
# values.yaml's own comment on configs.cm.url for the full "protocol/host must match or login
# fails before OIDC is even reached" reasoning.
#
# Same tradeoff as services/monitoring/helm/values-tailscale.yaml: this makes ArgoCD's login
# always redirect through the tailscale hostname, even for LAN-direct access — configs.cm.url is
# one static value, ArgoCD can't pick a different one per how the browser arrived.
#
# Port 8100 — scripts/port-forward.sh's own APPS map. Must also match
# services/authentik/helm/values-tailscale.yaml's argocdRedirectUris exactly.
#
# oidc.config's issuer IS overridden here too (unlike url above, which only needs the browser to
# match) — argocd-server fetches issuer's own discovery document server-side, and the
# "authorization_endpoint" field in that response is what it then redirects the *browser* to (see
# services/vault/helm/templates/oidc-provision-job.yaml's identical oidc_discovery_url comment
# for the full reasoning, and argocd.tf's hostAliases entry that makes this hostname resolvable
# in-cluster at all). http, not https: this fetch resolves to Traefik's ClusterIP in-cluster,
# which only ever serves plain HTTP on this port.
argo-cd:
  configs:
    cm:
      url: https://raspberrypi94.tail60240b.ts.net:8100
      oidc.config: |
        name: Authentik
        issuer: http://raspberrypi94.tail60240b.ts.net:8080/application/o/argocd/
        clientID: argocd
        clientSecret: $oidc.auth.client.secret
        requestedScopes: ["openid", "profile", "email"]
