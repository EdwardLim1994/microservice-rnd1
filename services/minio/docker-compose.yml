services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Host 9000 is taken by services/authentik's authentik-server (real consumers:
      # servers/auth|employee's AUTHENTIK_URL=http://localhost:9000, plus
      # services/authentik/tests/integration/*). No server's .env.sample sets MINIO_PORT yet, so
      # remapping the host side here is safe — MinioPlugin's own default (MINIO_PORT=9000) would
      # need an explicit override once a server actually consumes it from outside the Docker
      # network. Container-internal port stays 9000, so in-network access (minio:9000) is
      # unaffected.
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - minio
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio.rule=Host(`minio.localhost`)
      - traefik.http.routers.minio.middlewares=admin-auth
      - traefik.http.services.minio.loadbalancer.server.port=9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio-data:

networks:
  minio:
    driver: bridge
  # Empty here on purpose — real definition lives in services/traefik/docker-compose.yml (see
  # that file's own comment on this pattern, mirroring services/vault's "adminer" reference).
  traefik:
