apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      {{- include "minio.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "minio.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      # Lets the container resolve "authentik.lan" (see secret.yaml's
      # MINIO_IDENTITY_OPENID_CONFIG_URL, which points at port 8080 to match the browser-facing
      # `kubectl port-forward ... 8080:80` — Authentik echoes back whatever authority the request
      # arrived on, so the discovery fetch needs ":8080" too) to the traefik-web-8080 Service (see
      # services/traefik/helm/templates/web-8080-service.yaml) — not a real Service name CoreDNS
      # knows about, and *.localhost/*.lan can't be relied on to resolve to anything but loopback
      # (or nothing) from inside the pod's own network namespace.
      {{- $traefikSvc := lookup "v1" "Service" "infra" "traefik-web-8080" }}
      hostAliases:
        - ip: {{ if $traefikSvc }}{{ $traefikSvc.spec.clusterIP }}{{ else }}127.0.0.1{{ end }}
          hostnames:
            - authentik.lan
      containers:
        - name: minio
          image: "{{ .Values.image }}"
          args: ["server", "/data", "--console-address", ":9001"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 512Mi
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          envFrom:
            - secretRef:
                name: minio-secret
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
