services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    command:
      - --providers.docker=true
      # Only routes containers that explicitly opt in via `traefik.enable=true` — without this,
      # Traefik would auto-create a router for every container it can see (including ones on
      # networks it only joined to reach one target, e.g. servers' own Postgres containers on the
      # "adminer" network), none of which have a sensible Host() rule.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      # Dashboard is routed through the "web" entrypoint (Host(`traefik.localhost`), see labels
      # below) behind basic auth, not the separate insecure :8080 API port — no extra host port,
      # no unauthenticated dashboard.
      - --api.insecure=false
      - --log.level=INFO
    ports:
      - "80:80"
    volumes:
      # Read-only: Traefik only needs to observe container/label state, never mutate it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      # A single dedicated network, owned here — every routed container joins it too (in addition
      # to its own stack's own network, e.g. services/vault's vault service is on both "vault" and
      # "traefik"), rather than Traefik joining each of the other eight stacks' own isolated
      # networks. This means onboarding a new routed service never touches this file: it only adds
      # "traefik" to its own networks: list plus its own routing labels.
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.localhost`)
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.middlewares=admin-auth
      # Shared basic-auth middleware, consumed by every admin-tool router defined in this repo's
      # other docker-compose.yml files (services/adminer, services/redis, services/meilisearch,
      # services/vault, services/kafka, services/monitoring) via
      # `traefik.http.routers.<name>.middlewares=admin-auth`. Defining it here (rather than
      # duplicating it per file) works because Traefik's Docker provider merges router/middleware
      # labels from every container with `traefik.enable=true` into one shared dynamic
      # configuration — it isn't scoped to the container that declared it.
      #
      # The htpasswd (apr1) hash is inlined directly here rather than pulled from `.env` via
      # `${TRAEFIK_ADMIN_AUTH}` — Compose interpolates `.env` values a second time when they're
      # substituted into a label, so a literal `$` inside the hash (e.g. `$apr1$...`) gets
      # misread as *another* `${VAR}` reference and silently resolves to an empty string
      # (confirmed by inspecting the label docker compose actually applies to the running
      # container — `${VAR}`-from-`.env` came out blank, a hardcoded `$$`-escaped label did not).
      # A literal `$` inside a label value written directly in this file only goes through
      # Compose's interpolation once, so `$$` here becomes the intended single `$` at runtime.
      # Default below is user "admin" / password "admin" (`openssl passwd -apr1 admin`) — replace
      # this hash (regenerate via `openssl passwd -apr1`) before anything but local dev.
      - traefik.http.middlewares.admin-auth.basicauth.users=admin:$$apr1$$5EawF5g4$$.0wFGpORt05Nrai5i7vlw/
    restart: unless-stopped

networks:
  traefik:
    driver: bridge
