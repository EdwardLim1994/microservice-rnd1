# Cluster-scoped, same reasoning as clusterrole.yaml — an IngressClass isn't namespaced. Every
# routed Ingress object in this repo sets `spec.ingressClassName: {{ .Values.ingressClassName }}`
# to opt into this specific controller (moot today, since Traefik is the only ingress controller
# in this cluster, but keeps every Ingress object spec-correct rather than relying on
# "only one controller exists" as an implicit assumption).
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: {{ .Values.ingressClassName }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
spec:
  controller: traefik.io/ingress-controller
