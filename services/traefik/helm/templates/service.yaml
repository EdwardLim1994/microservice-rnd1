# ClusterIP, not NodePort — unlike a frontend (see frontends/mfe1/helm's own comment on why it's
# NodePort), nothing needs to reach Traefik's Service directly from outside the cluster: every
# routed hostname resolves through Traefik because it's the Ingress *controller* watching those
# Ingress objects, not because a browser dials this Service's address. Reached today only via
# `kubectl port-forward` (see services/traefik/CLAUDE.md's Kubernetes section) for both the `web`
# entrypoint and the dashboard.
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "traefik.labels" . | nindent 4 }}
  ports:
    - name: web
      port: {{ .Values.webPort }}
      targetPort: web
    - name: dashboard
      port: {{ .Values.dashboardPort }}
      targetPort: dashboard
