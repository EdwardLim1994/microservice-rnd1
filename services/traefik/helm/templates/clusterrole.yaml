# Cluster-scoped (not a namespaced Role) because the Kubernetes Ingress provider must discover
# Ingress objects across every namespace that has a routed service — infra (apollo-router,
# grafana, authentik-server), plus each frontend's own namespace (see services/traefik/CLAUDE.md's
# Kubernetes section for the full routed set). A namespaced Role bound only in "infra" would leave
# Traefik blind to Ingress objects created anywhere else.
#
# "secrets" read access is required even though nothing routed here sets `spec.tls` — confirmed
# the hard way against a real cluster: omitting it doesn't just disable TLS cert lookups, it
# breaks routing entirely. Traefik's Kubernetes Ingress provider starts a Secret informer
# unconditionally as part of the same shared informer factory as the Ingress/Service/Endpoints
# informers; without list/watch on Secrets cluster-wide, that informer's reflector fails
# continuously (`secrets is forbidden ... at the cluster scope`, logged every ~30s) and the whole
# provider never reports its cache as synced — every request 404s, not just ones needing a TLS
# cert. This is a real, meaningful privilege (blanket read access to every Secret in every
# namespace, including Vault's and Authentik's own credentials) for a capability nothing routed
# here actually uses — accepted only because the alternative (no routing at all) is worse for
# this prototype. Revisit if this cluster ever needs a hard boundary around Traefik's own
# blast radius (e.g. Traefik's own CRD-based provider, or a namespace-scoped secrets-store proxy).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
  labels:
    {{- include "traefik.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    # "nodes" is the same story as "secrets" above — discovered by the same live-cluster failure
    # mode (a reflector error: `nodes is forbidden ... at the cluster scope`), not because
    # anything routed here is topology-aware. Traefik's Ingress provider watches Nodes
    # unconditionally as part of the same informer factory.
    resources: ["services", "endpoints", "secrets", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses", "ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
