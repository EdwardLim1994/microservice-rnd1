namespace: infra

image: traefik:v3.3

# Matches services/traefik/docker-compose.yml's own entrypoint — every routed Ingress in the
# cluster is plain HTTP, no TLS termination configured (a minikube prototype concern, not
# hardened for anything beyond local dev).
webPort: 80

# The Kubernetes Ingress provider only routes objects whose `spec.ingressClassName` matches this
# — see templates/ingressclass.yaml, which registers the IngressClass resource itself. Every
# routed chart in this repo (services/apollo, services/monitoring, services/authentik,
# frontends/*, apps/*) sets `ingressClassName: traefik` on its own Ingress object.
ingressClassName: traefik

# Traefik's own dashboard/API, served on a separate port with no auth (`--api.insecure=true`) —
# safe only because templates/service.yaml exposes it as ClusterIP, never NodePort, so the sole
# way to reach it is an explicit `kubectl port-forward` (same trust model as every other admin UI
# in this cluster, e.g. Vault/Meilisearch — see services/traefik/CLAUDE.md's Kubernetes section).
# There's no in-cluster equivalent of docker-compose's Host(`traefik.localhost`) + basic-auth
# route for it: that requires Traefik's own IngressRoute/Middleware CRDs, deliberately not
# installed here — see that same CLAUDE.md section for why.
dashboardPort: 8080
