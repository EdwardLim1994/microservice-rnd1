traefik:
  ports:
    # Pinned (not auto-assigned) so the local cluster tool's own loadbalancer/driver can map
    # fixed host ports to them at cluster-creation time (k3d:
    # `k3d cluster create dev -p "8080:30080@server:0" -p "8443:30443@server:0"`) — LAN
    # devices then reach Traefik directly via the host's real network interface, no
    # `kubectl port-forward` process needed. Host-side 8080/8443 intentionally match what's
    # already baked into every app's OIDC redirect_uris/hostAliases (grafana.lan:8080, etc.), so
    # this swap needs no changes anywhere else.
    web:
      nodePort: 30080
    websecure:
      nodePort: 30443

  # NOT forcing a global http->https redirect (tried it, reverted) — every OIDC redirect_uri and
  # discovery-URL fetch in this repo is deliberately plain http://*.lan:8080 (see
  # services/authentik/helm/templates/proxy-blueprint-configmap.yaml, services/minio/helm/
  # templates/secret.yaml, services/vault/helm/templates/oidc-provision-job.yaml) — an
  # entrypoint-level redirect catches those pod-to-pod calls too, not just browser traffic, and
  # breaks every login flow that isn't already registered for https. https on :8443/websecure is
  # available for whoever wants it; :8080/web keeps working exactly as it always did.

  # Default cert for every route that doesn't declare its own tls: block — issued by
  # services/cert-manager-config/helm's Certificate (vault-issuer, pki_int). No per-app Ingress
  # edit needed to get https on grafana/vault/authentik/minio/argocd — just visit the :8443 form
  # if you want it; existing :8080 OIDC flows are untouched.
  tlsStore:
    default:
      defaultCertificate:
        secretName: traefik-default-tls
