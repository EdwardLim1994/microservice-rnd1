# pki/cert/ca is an unauthenticated Vault read (it's a public cert, not a secret) — no
# VAULT_TOKEN, no RBAC, no hook Job needed, just an initContainer dropping the file into a
# volume nginx then serves as-is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ca-distribution
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ca-distribution
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ca-distribution
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ca-distribution
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: fetch-ca
          image: "{{ .Values.vaultImage }}"
          env:
            - name: VAULT_ADDR
              value: "http://vault:8200"
          command:
            - sh
            - -c
            - |
              set -e
              until vault status >/dev/null 2>&1; do
                echo "waiting for vault..."
                sleep 2
              done
              vault read -field=certificate pki/cert/ca > /html/local-dev-root-ca.crt
          volumeMounts:
            - name: html
              mountPath: /html
      containers:
        - name: nginx
          image: "{{ .Values.nginxImage }}"
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          emptyDir: {}
