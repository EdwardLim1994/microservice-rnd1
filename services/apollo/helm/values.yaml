namespace: infra

image: ghcr.io/apollographql/router:v2.15.0

# Uses the image's own documented env vars — no extra CLI args needed.
routerConfigPath: /etc/router.yaml
supergraphPath: /etc/supergraph.graphql

# Rendered into helm/files/supergraph.graphql's join__graph URLs via `tpl` (see
# templates/configmap.yaml) — the routing address for each subgraph, kept as a Helm value instead
# of hardcoded into the checked-in schema file so it can differ per environment (and per
# Terraform override, see terraform/module/variables.tf) without hand-editing the schema file
# itself. Defaults are this repo's actual in-cluster addresses (minikube, "infra"/test1/test2
# namespaces, ports matching each server's own Service — see `kubectl get svc -n test1`/`-n
# test2`) — see servers/demo1/helm/values.yaml's kafka/redis comments for the identical
# in-cluster-FQDN reasoning.
subgraphs:
  test1:
    url: http://test1.test1.svc.cluster.local:4001
  test2:
    url: http://test2.test2.svc.cluster.local:4002
