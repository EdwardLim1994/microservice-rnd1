apiVersion: apps/v1
kind: Deployment
metadata:
  name: apollo-router
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "router.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "router.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "router.labels" . | nindent 8 }}
    spec:
      # See services/kafka/helm/templates/schema-registry-deployment.yaml's comment — an
      # auto-injected <SVC>_PORT env var crashed that image outright; disabling Service env var
      # injection here too avoids relying on the router image never hitting a similar collision.
      enableServiceLinks: false
      # No use of the Kubernetes API from within this pod.
      automountServiceAccountToken: false
      initContainers:
        # Issues this Router's short-lived mTLS client identity from Vault's PKI secrets engine
        # and writes it into the "tls" emptyDir, mounted read-only by the main container below —
        # same idea as the docker-compose side's `bun run tls:provision` pre-start script (see
        # services/apollo/src/scripts/provision_tls.sh.ts), just run as a pod init step instead of
        # a host-side script, since there's no equivalent "run this before `docker compose up`"
        # step in Kubernetes.
        #
        # ponytail: curl + grep/sed JSON field extraction, not jq (curlimages/curl doesn't bundle
        # it) — works because Vault's JSON response here is flat, single-line, and the PEM values
        # never contain a literal `"`. Fragile if that ever changes; swap for a jq-bundled image
        # if so.
        - name: vault-tls-init
          image: curlimages/curl:8.11.0
          env:
            - name: VAULT_ADDR
              value: {{ .Values.vault.addr | quote }}
            - name: VAULT_TLS_ROLE
              value: {{ .Values.vault.tlsRole | quote }}
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: apollo-router-vault-secret
                  key: VAULT_ROLE_ID
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: apollo-router-vault-secret
                  key: VAULT_SECRET_ID
          command:
            - sh
            - -c
            - |
              set -eu
              TOKEN=$(curl -sf -X POST -d "{\"role_id\":\"$VAULT_ROLE_ID\",\"secret_id\":\"$VAULT_SECRET_ID\"}" \
                "$VAULT_ADDR/v1/auth/approle/login" \
                | grep -o '"client_token":"[^"]*"' | sed -e 's/.*:"//' -e 's/"$//')
              curl -sf -X POST -H "X-Vault-Token: $TOKEN" \
                -d '{"common_name":"apollo-router"}' \
                "$VAULT_ADDR/v1/pki_int/issue/$VAULT_TLS_ROLE" -o /tmp/resp.json
              extract() {
                grep -o "\"$1\":\"[^\"]*\"" /tmp/resp.json | sed -e 's/.*:"//' -e 's/"$//' -e 's/\\n/\n/g'
              }
              extract certificate > /shared/cert.pem
              extract private_key > /shared/key.pem
              extract issuing_ca > /shared/ca.pem
          volumeMounts:
            - name: tls
              mountPath: /shared
      containers:
        - name: apollo-router
          image: "{{ .Values.image }}"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 256Mi
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: APOLLO_ROUTER_CONFIG_PATH
              value: {{ .Values.routerConfigPath | quote }}
            - name: APOLLO_ROUTER_SUPERGRAPH_PATH
              value: {{ .Values.supergraphPath | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/router.yaml
              subPath: router.yaml
            - name: config
              mountPath: /etc/supergraph.graphql
              subPath: supergraph.graphql
            - name: tls
              mountPath: /etc/tls
              readOnly: true
          # tcpSocket, not an HTTP path — router.yaml doesn't enable Apollo Router's health_check
          # endpoint (a separate port, off by default), and the main :4000 listener only answers
          # actual GraphQL POST requests, not a plain GET health check.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: apollo-router-config
        - name: tls
          emptyDir: {}
