apiVersion: v1
kind: ConfigMap
metadata:
  name: apollo-router-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "router.labels" . | nindent 4 }}
data:
  # helm/files/router.yaml and helm/files/supergraph.graphql are both plain copies — Helm's
  # .Files.Get can only read files inside the chart's own directory tree. supergraph.graphql is
  # generated by `bun run supergraph` (rover, see ../../rover.yaml), which bakes each subgraph's
  # real routing_url directly into the composed schema — no Helm templating needed here, just
  # re-run `bun run supergraph` (writes straight to helm/files/supergraph.graphql) after editing
  # rover.yaml or any subgraph's schema.
  router.yaml: |
{{ .Files.Get "files/router.yaml" | indent 4 }}
  supergraph.graphql: |
{{ .Files.Get "files/supergraph.graphql" | indent 4 }}
