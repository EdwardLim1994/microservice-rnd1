apiVersion: v1
kind: ConfigMap
metadata:
  name: apollo-router-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "router.labels" . | nindent 4 }}
data:
  # Real copies of services/apollo/src/config/router.yaml and dist/supergraph.graphql, under
  # helm/files/ — Helm's .Files.Get can only read files inside the chart's own directory tree, so
  # these can't be referenced from the actual source location directly. Re-copy manually if either
  # changes (`bun run supergraph` regenerates dist/supergraph.graphql — re-copy after, but see the
  # note below before overwriting the copy wholesale).
  #
  # NOTE: do not write literal double-curly-brace expressions inside this file's own comments —
  # Helm's Go-template engine parses this whole file before it's treated as YAML, so a template
  # expression typed out for documentation purposes (rather than executed) still gets parsed, and
  # anything not valid Go-template syntax inside it (e.g. a "<name>" placeholder) breaks the whole
  # chart with a cryptic "bad character" parse error. Confirmed the hard way — see git blame.
  #
  # supergraph.graphql's join__graph URLs are template expressions referencing
  # Values.subgraphs.<name>.url, not literal addresses — rendered here via `tpl` (unlike
  # router.yaml below, a plain .Files.Get) so each environment's actual routing address comes from
  # values.yaml/Terraform instead of being hand-edited into the checked-in file. This is why
  # `bun run supergraph`'s freshly composed dist/supergraph.graphql (docker-compose hostnames, no
  # placeholders) can't be copied over this file verbatim — re-apply the Values.subgraphs
  # substitution for each join__graph line after copying over everything else. See
  # services/terraform/CLAUDE.md for the full story on why this was needed (demo1/demo2's actual
  # in-cluster addresses aren't knowable at schema-compose time).
  router.yaml: |
{{ .Files.Get "files/router.yaml" | indent 4 }}
  supergraph.graphql: |
{{ tpl (.Files.Get "files/supergraph.graphql") . | indent 4 }}
