apiVersion: v1
kind: Secret
metadata:
  name: apollo-router-vault-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "router.labels" . | nindent 4 }}
stringData:
  # Filled in manually after running services/vault/ansible's provisioning role (with
  # services/apollo/ansible/vars.yml) against the in-cluster Vault — see values.yaml's
  # vault.roleId/vault.secretId. Consumed by the vault-tls-init initContainer in
  # templates/deployment.yaml.
  VAULT_ROLE_ID: {{ .Values.vault.roleId | quote }}
  VAULT_SECRET_ID: {{ .Values.vault.secretId | quote }}
