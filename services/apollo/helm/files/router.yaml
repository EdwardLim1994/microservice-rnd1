supergraph:
  listen: 0.0.0.0:4000
  path: /graphql
  introspection: true

# mTLS to every https:// subgraph (see values.yaml's subgraphs.*.url) — CA + this Router's own
# Vault-issued client cert, written to /etc/tls by the vault-tls-init initContainer (see
# templates/deployment.yaml). Same NOTE as services/apollo/src/config/router.yaml's docker-compose
# copy — verify this block's exact keys against the deployed Router image's TLS reference.
tls:
  subgraph:
    subgraphs:
      auth:
        certificate_authorities: "${file:/etc/tls/ca.pem}"
        client_authentication:
          certificate_chain: "${file:/etc/tls/cert.pem}"
          key: "${file:/etc/tls/key.pem}"

cors:
  policies:
    # Local dev frontends: frontend1's own dev server (3001) and portal (3000),
    # which loads frontend1 as a Module Federation remote.
    - origins:
        - http://localhost:3000
        - http://localhost:3001
      allow_headers:
        - content-type
      methods:
        - GET
        - POST
        - OPTIONS
    # Router default — Apollo Sandbox UI (enabled via `sandbox.enabled` above)
    # queries this router directly from studio.apollographql.com.
    - origins:
        - https://studio.apollographql.com

sandbox:
  enabled: true

homepage:
  enabled: false

include_subgraph_errors:
  all: true
