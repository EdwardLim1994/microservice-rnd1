supergraph:
  listen: 0.0.0.0:4000
  path: /graphql
  introspection: true

# mTLS to the auth subgraph (routing_url in supergraph.yaml is https://) — CA + this Router's own
# Vault-issued client cert, written by `bun run tls:provision` (see package.json /
# src/scripts/provision_tls.sh.ts) into dist/, mounted below by docker-compose.yml.
# certificate_authorities/certificate_chain/key all take inline PEM *content*, not a file path
# (confirmed via `router config schema`) — "${file.<path>}" is Router's expansion syntax to read
# a file's content in. Note the dot, not a colon: "${file:<path>}" (what earlier versions of this
# file used) fails at startup with "APOLLO_ROUTER_CONFIG_SUPPORTED_MODES must be of the format
# env,file,..." regardless of that env var's value — confirmed empirically against a live
# ghcr.io/apollographql/router:v2.15.0 container, since this block was never actually booted
# before.
tls:
  subgraph:
    subgraphs:
      auth:
        certificate_authorities: "${file./etc/tls/ca.pem}"
        client_authentication:
          certificate_chain: "${file./etc/tls/cert.pem}"
          key: "${file./etc/tls/key.pem}"

cors:
  policies:
    # Local dev frontends: frontend1's own dev server (3001) and portal (3000),
    # which loads frontend1 as a Module Federation remote.
    - origins:
        - http://localhost:3000
        - http://localhost:3001
      allow_headers:
        - content-type
      methods:
        - GET
        - POST
        - OPTIONS
    # Router default — Apollo Sandbox UI (enabled via `sandbox.enabled` above)
    # queries this router directly from studio.apollographql.com.
    - origins:
        - https://studio.apollographql.com

sandbox:
  enabled: true

homepage:
  enabled: false

include_subgraph_errors:
  all: true
