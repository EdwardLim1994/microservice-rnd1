supergraph:
  listen: 0.0.0.0:4000
  path: /graphql
  introspection: true

# mTLS to the auth subgraph (routing_url in supergraph.yaml is https://) — CA + this Router's own
# Vault-issued client cert, written by `bun run tls:provision` (see package.json /
# src/scripts/provision_tls.sh.ts) into dist/, mounted below by docker-compose.yml.
# NOTE: verify this block's exact keys against the ghcr.io/apollographql/router:v2.15.0 TLS
# reference before relying on it in anything beyond local dev — written from Apollo Router's
# documented subgraph TLS config shape, not confirmed against a live Router yet.
tls:
  subgraph:
    subgraphs:
      auth:
        certificate_authorities: "${file:/etc/tls/ca.pem}"
        client_authentication:
          certificate_chain: "${file:/etc/tls/cert.pem}"
          key: "${file:/etc/tls/key.pem}"

cors:
  policies:
    # Local dev frontends: frontend1's own dev server (3001) and portal (3000),
    # which loads frontend1 as a Module Federation remote.
    - origins:
        - http://localhost:3000
        - http://localhost:3001
      allow_headers:
        - content-type
      methods:
        - GET
        - POST
        - OPTIONS
    # Router default — Apollo Sandbox UI (enabled via `sandbox.enabled` above)
    # queries this router directly from studio.apollographql.com.
    - origins:
        - https://studio.apollographql.com

sandbox:
  enabled: true

homepage:
  enabled: false

include_subgraph_errors:
  all: true
