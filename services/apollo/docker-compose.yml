services:
  router:
    image: ghcr.io/apollographql/router:v2.15.0
    container_name: apollo-router
    ports:
      - 4000:4000
    networks:
      - graphql
      - traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/config/router.yaml:${APOLLO_ROUTER_CONFIG_PATH:-/etc/router.yaml}
      - ./dist/supergraph.graphql:${APOLLO_ROUTER_SUPERGRAPH_PATH:-/etc/supergraph.graphql}
      # Written by `bun run tls:provision` (host-side, before `docker compose up` — same "spawn
      # before the real thing starts" pattern as `bun run supergraph`) — see
      # src/scripts/provision_tls.sh.ts.
      - ./dist/ca.pem:/etc/tls/ca.pem
      - ./dist/cert.pem:/etc/tls/cert.pem
      - ./dist/key.pem:/etc/tls/key.pem
    env_file:
      - .env
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.apollo-router.rule=Host(`graphql.localhost`)
      - traefik.http.services.apollo-router.loadbalancer.server.port=4000

networks:
  graphql:
    driver: bridge
  # Empty here on purpose — real definition lives in services/traefik/docker-compose.yml (see
  # that file's own comment on this pattern, mirroring services/vault's "adminer" reference).
  traefik:
