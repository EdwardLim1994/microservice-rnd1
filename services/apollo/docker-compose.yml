services:
  router:
    image: ghcr.io/apollographql/router:v2.15.0
    container_name: apollo-router
    ports:
      - 4000:4000
    networks:
      - graphql
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/config/router.yaml:${APOLLO_ROUTER_CONFIG_PATH:-/etc/router.yaml}
      - ./dist/supergraph.graphql:${APOLLO_ROUTER_SUPERGRAPH_PATH:-/etc/supergraph.graphql}
    env_file:
      - .env
    restart: unless-stopped

networks:
  graphql:
    driver: bridge
