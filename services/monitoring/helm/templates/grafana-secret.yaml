apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
stringData:
  GF_SECURITY_ADMIN_USER: {{ .Values.grafana.adminUser | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ .Values.grafana.adminPassword | quote }}
  GF_SERVER_ROOT_URL: {{ .Values.grafana.rootUrl | quote }}
  GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
  GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {{ .Values.grafana.oidcClientSecret | quote }}
  GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
  # See services/minio/helm/templates/secret.yaml's MINIO_IDENTITY_OPENID_CONFIG_URL comment —
  # same reasoning: these are fetched server-side but Grafana redirects the browser straight to
  # AUTH_URL, so the authority has to be browser-reachable (hostAliases in
  # grafana-statefulset.yaml), not the in-cluster Service DNS name.
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: "http://authentik.lan:8080/application/o/authorize/"
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://authentik.lan:8080/application/o/token/"
  GF_AUTH_GENERIC_OAUTH_API_URL: "http://authentik.lan:8080/application/o/userinfo/"
  GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
  # ponytail: every authenticated user becomes a Grafana org Admin — matches minio-provider's
  # consoleAdmin-for-everyone default (see the blueprint's minio-policy-mapping comment). Switch
  # to role_attribute_path reading the "groups" claim if per-user roles are ever needed.
  GF_AUTH_GENERIC_OAUTH_AUTO_ASSIGN_ORG_ROLE: "Admin"
