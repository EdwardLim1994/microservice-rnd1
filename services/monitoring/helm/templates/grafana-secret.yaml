apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
stringData:
  GF_SECURITY_ADMIN_USER: {{ .Values.grafana.adminUser | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ .Values.grafana.adminPassword | quote }}
  GF_SERVER_ROOT_URL: {{ .Values.grafana.rootUrl | quote }}
  GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
  GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {{ .Values.grafana.oidcClientSecret | quote }}
  GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
  # AUTH_URL is where Grafana redirects the *browser* — https:8443 to match GF_SERVER_ROOT_URL's
  # own redirect_uri, now that traefik's default TLS cert covers authentik.lan too. TOKEN_URL/
  # API_URL stay plain http:8080: those are Grafana's own backend fetching token/userinfo
  # directly (server-to-server, hostAliases in grafana-statefulset.yaml), unaffected by what
  # scheme the browser used and not worth trusting the CA inside the pod for.
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://authentik.lan:8443/application/o/authorize/"
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://authentik.lan:8080/application/o/token/"
  GF_AUTH_GENERIC_OAUTH_API_URL: "http://authentik.lan:8080/application/o/userinfo/"
  GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
  # ponytail: every authenticated user becomes a Grafana org Admin — matches minio-provider's
  # consoleAdmin-for-everyone default (see the blueprint's minio-policy-mapping comment). Switch
  # to role_attribute_path reading the "groups" claim if per-user roles are ever needed.
  GF_AUTH_GENERIC_OAUTH_AUTO_ASSIGN_ORG_ROLE: "Admin"
