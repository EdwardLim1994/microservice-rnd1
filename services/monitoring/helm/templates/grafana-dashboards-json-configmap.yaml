apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-json
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  # Real copy of apps/servers/server1-grpc/grafana-dashboard.json — lives there since it's that
  # server's own dashboard, not generic monitoring-stack config, but Helm's .Files.Get can only
  # read files inside this chart's own directory tree (see prometheus-configmap.yaml's comment
  # for the same restriction), so a mirror has to stay here too. Re-copy manually after editing
  # the source. Each key here becomes a file in dashboards.yaml's provisioned path (see
  # grafana-statefulset.yaml's volume mount) — add one key per dashboard, not a directory tree,
  # since ConfigMap volumes are always flat.
  server1-grpc.json: |
{{ .Files.Get "files/grafana-dashboard-server1-grpc.json" | indent 4 }}
  # Real copy of apps/servers/server2-grpc/grafana-dashboard.json — same convention as
  # server1-grpc.json above.
  server2-grpc.json: |
{{ .Files.Get "files/grafana-dashboard-server2-grpc.json" | indent 4 }}
