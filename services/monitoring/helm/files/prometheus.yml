global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # No Kubernetes service discovery configured in this repo yet (see root CLAUDE.md) — each
  # per-server exporter gets a manually-added static target here, cross-namespace via its own
  # chart's Service FQDN (<service>.<namespace>.svc.cluster.local:<port>).
  - job_name: server1-grpc-postgres
    static_configs:
      - targets: ["server1-grpc-db.server1-grpc-infra.svc.cluster.local:9187"]

  - job_name: server1-grpc-redis
    static_configs:
      - targets: ["server1-grpc-redis.server1-grpc-infra.svc.cluster.local:9121"]
