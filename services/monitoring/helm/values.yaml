namespace: infra

prometheus:
  image: prom/prometheus:v3.1.0
  persistence:
    size: 5Gi

loki:
  image: grafana/loki:3.3.2
  persistence:
    size: 5Gi

tempo:
  image: grafana/tempo:2.6.1
  persistence:
    size: 5Gi

grafana:
  image: grafana/grafana-oss:11.4.0
  adminUser: admin
  adminPassword: admin
  persistence:
    size: 1Gi
  # Native OIDC login against Authentik (https://integrations.goauthentik.io/grafana) — must
  # match services/authentik/helm/values.yaml's grafanaOidcClientSecret.
  oidcClientSecret: grafanaoidcclientsecret
  # Grafana's own redirect_uri is always "<rootUrl>/login/generic_oauth" — must be one of the
  # registered entries on the Authentik side (see the blueprint's grafana-provider redirect_uris).
  # https + :8443 because traefik's default TLS cert (services/traefik/helm/values.yaml's
  # tlsStore) now covers grafana.lan — switch to grafana.localhost (no port) for same-machine
  # access once the `kubectl port-forward -n infra svc/traefik --address 0.0.0.0 8080:80
  # 8443:443` LAN path is no longer running.
  rootUrl: https://grafana.lan:8443/

otelCollector:
  image: otel/opentelemetry-collector-contrib:0.116.1
