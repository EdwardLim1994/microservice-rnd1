---
# Registers one server's Debezium Postgres connector with Kafka Connect. Unlike Vault dev mode
# (services/vault/ansible/provision.yml), Kafka Connect's connector configs live in a Kafka topic
# (CONNECT_CONFIG_STORAGE_TOPIC), so they survive a kafka-connect container restart — this
# playbook is re-run-safe (the REST API's PUT is idempotent, a no-op restart if config is
# unchanged) but not something you need to re-run routinely the way Vault provisioning is. Run via
# each server's own `bun run cdc:provision` (see servers/test1/package.json), which runs this
# inside the "debezium-ansible" one-off runner container (services/debezium/docker-compose.yml)
# and passes that server's own ansible/vars.yml as extra-vars:
#
#   docker compose run --rm debezium-ansible ansible-playbook services/debezium/ansible/provision.yml \
#     -e @servers/<name>/ansible/vars.yml
- name: Register a server's Debezium Postgres connector with Kafka Connect
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - provision-server-cdc
