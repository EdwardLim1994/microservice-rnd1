---
# A connector task can end up FAILED without anything here having changed it — e.g. Postgres
# restarted and invalidated the replication slot, or a transient network blip during a snapshot.
# Kafka Connect doesn't retry a FAILED task on its own; catch and recover it here so `cdc:provision`
# doubles as the "is CDC actually still running for this server?" check, not just a config-push.
- name: Check this connector's current status, if it's already registered
  ansible.builtin.uri:
    url: "{{ kafka_connect_addr }}/connectors/{{ server_name }}-cdc/status"
    method: GET
    status_code: [200, 404]
  register: connector_status

- name: Restart any failed tasks for this connector
  ansible.builtin.uri:
    url: "{{ kafka_connect_addr }}/connectors/{{ server_name }}-cdc/restart?includeTasks=true&onlyFailed=true"
    method: POST
    status_code: [200, 204]
  when: >-
    connector_status.status == 200 and
    (connector_status.json.connector.state == 'FAILED' or
     connector_status.json.tasks | selectattr('state', 'equalto', 'FAILED') | list | length > 0)

- name: Check whether this server's publication already exists
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_port: "{{ db_port }}"
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
    db: "{{ db_name }}"
    query: SELECT 1 FROM pg_publication WHERE pubname = %(pubname)s
    named_args:
      pubname: "{{ publication_name }}"
  register: publication_lookup

# Only reconcile membership for a publication that already exists — on a server's very first
# provisioning run there's nothing to reconcile yet (Debezium auto-creates the publication itself,
# already scoped to cdc_tables, the first time the connector starts below). Also protects against
# a FOR ALL TABLES publication (cdc_tables was empty on an earlier run): Postgres rejects
# ALTER PUBLICATION ... ADD/DROP TABLE against one of those outright, so this whole block would
# error out for a server that's never actually been scoped to specific tables.
- name: Reconcile the publication's table membership against cdc_tables, if it already exists
  when: publication_lookup.rowcount > 0 and cdc_tables | length > 0
  block:
    - name: Read the publication's current table membership
      community.postgresql.postgresql_query:
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ db_admin_username }}"
        login_password: "{{ db_admin_password }}"
        db: "{{ db_name }}"
        query: SELECT schemaname, tablename FROM pg_publication_tables WHERE pubname = %(pubname)s
        named_args:
          pubname: "{{ publication_name }}"
      register: current_publication_tables

    - name: Compute which tables to add/drop so the publication matches cdc_tables exactly
      ansible.builtin.set_fact:
        current_tables: >-
          {{ current_publication_tables.query_result
             | map(attribute='schemaname')
             | zip(current_publication_tables.query_result | map(attribute='tablename'))
             | map('join', '.') | list }}

    - name: Add newly-desired tables to the publication
      # schema/table come from cdc_tables (developer-supplied, via turbo gen cdc's prompt or a
      # hand-edited ansible/vars.yml — not external/user input), so direct interpolation into DDL
      # here is the same trust level as server_name elsewhere in this role, not a SQL-injection
      # concern. Table names are double-quoted (Prisma's default table name is the exact,
      # case-sensitive model name, e.g. "Test1") — the schema itself never needs quoting here
      # ("public" only).
      community.postgresql.postgresql_query:
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ db_admin_username }}"
        login_password: "{{ db_admin_password }}"
        db: "{{ db_name }}"
        query: >-
          ALTER PUBLICATION {{ publication_name }} ADD TABLE
          {{ item.split('.')[0] }}."{{ item.split('.')[1] }}"
      loop: "{{ cdc_tables | difference(current_tables) }}"

    - name: Drop no-longer-desired tables from the publication
      community.postgresql.postgresql_query:
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ db_admin_username }}"
        login_password: "{{ db_admin_password }}"
        db: "{{ db_name }}"
        query: >-
          ALTER PUBLICATION {{ publication_name }} DROP TABLE
          {{ item.split('.')[0] }}."{{ item.split('.')[1] }}"
      loop: "{{ current_tables | difference(cdc_tables) }}"

- name: Build the base connector config for this server
  ansible.builtin.set_fact:
    connector_config:
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      database.hostname: "{{ db_host }}"
      database.port: "{{ db_port }}"
      database.user: "{{ db_admin_username }}"
      database.password: "{{ db_admin_password }}"
      database.dbname: "{{ db_name }}"
      # Topics come out named "{{ server_name }}.<schema>.<table>" — keep this distinct from any
      # topic name a server's own KafkaDriver produces to directly (see
      # packages/server/CLAUDE.md's KafkaDriver section), so CDC topics never collide with
      # application-level ones.
      topic.prefix: "{{ server_name }}"
      plugin.name: pgoutput
      slot.name: "{{ server_name }}_slot"
      publication.name: "{{ publication_name }}"
      publication.autocreate.mode: "{{ publication_autocreate_mode }}"
      snapshot.mode: "{{ cdc_snapshot_mode }}"
      key.converter: io.confluent.connect.avro.AvroConverter
      key.converter.schema.registry.url: "{{ schema_registry_addr }}"
      value.converter: io.confluent.connect.avro.AvroConverter
      value.converter.schema.registry.url: "{{ schema_registry_addr }}"
      # Framework-level error handling (applies to any Kafka Connect connector, not
      # Debezium-specific) — one bad message quarantines to this topic instead of failing the
      # whole task, so the rest of this server's tables keep flowing.
      errors.tolerance: "{{ cdc_errors_tolerance }}"
      errors.deadletterqueue.topic.name: "{{ cdc_dlq_topic }}"
      errors.deadletterqueue.topic.replication.factor: "{{ cdc_dlq_replication_factor }}"
      errors.deadletterqueue.context.headers.enable: true

- name: Scope the connector's own forwarding to specific tables, if given
  ansible.builtin.set_fact:
    connector_config: "{{ connector_config | combine({'table.include.list': cdc_tables | join(',')}) }}"
  when: cdc_tables | length > 0

- name: Exclude noisy internal tables when capturing every table
  ansible.builtin.set_fact:
    connector_config: "{{ connector_config | combine({'table.exclude.list': cdc_default_exclude_list}) }}"
  when: cdc_tables | length == 0 and cdc_default_exclude_list | length > 0

# Kafka Connect's PUT /connectors/<name>/config is idempotent on its own (it diffs the incoming
# config against the stored one and only restarts the connector if something actually changed) —
# unlike Vault's sys/mounts or auth/approle writes (services/vault/ansible/roles/
# provision-server-vault/tasks/main.yml), there's no "already exists" error case to guard against
# with a read-then-conditionally-write dance. One task is enough.
- name: Register/update the Debezium Postgres connector for this server
  ansible.builtin.uri:
    url: "{{ kafka_connect_addr }}/connectors/{{ server_name }}-cdc/config"
    method: PUT
    body_format: json
    body: "{{ connector_config }}"
    status_code: [200, 201]
