apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "debezium.labels" . | nindent 4 }}
spec:
  # Always 1 — Kafka Connect's own distributed-mode state (connector configs/offsets/status) lives
  # in Kafka topics, not in this pod, but a second replica would just be a second worker in the
  # same "kafka-connect-cluster" group doing nothing useful without more brokers/partitions to
  # split across. Not a real HA setup, same scope as every other single-instance infra chart here.
  replicas: 1
  selector:
    matchLabels:
      {{- include "debezium.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "debezium.labels" . | nindent 8 }}
    spec:
      # Kubernetes auto-injects <SVC>_PORT env vars into every pod in this namespace (here, that'd
      # be KAFKA_CONNECT_PORT); disabling Service env var injection avoids relying on this image's
      # entrypoint never hitting a similar collision, same as every other infra pod in this repo.
      enableServiceLinks: false
      # No use of the Kubernetes API from within this pod.
      automountServiceAccountToken: false
      # Kubernetes has no docker-compose-style `depends_on: condition: service_healthy` — gate
      # startup explicitly rather than rely solely on Kafka Connect's own client retry.
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
      containers:
        - name: kafka-connect
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 256Mi
          ports:
            - name: http
              containerPort: 8083
          # This image's own entrypoint (debezium/container-images' connect-base) reads a set of
          # unprefixed shorthand vars (BOOTSTRAP_SERVERS, GROUP_ID, *_STORAGE_TOPIC, *_CONVERTER,
          # etc.) and unconditionally re-exports them as CONNECT_* — setting CONNECT_* directly for
          # any of these gets silently overwritten with the (empty-by-default) shorthand value.
          # Only unprefixed here; anything without a shorthand (replication factors, log level)
          # still passes through as plain CONNECT_* via the entrypoint's generic passthrough.
          env:
            - name: BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: ADVERTISED_HOST_NAME
              value: "kafka-connect"
            - name: ADVERTISED_PORT
              value: "8083"
            - name: REST_PORT
              value: "8083"
            - name: GROUP_ID
              value: "kafka-connect-cluster"
            # Single broker (services/kafka/helm), so replication factor 1 for all three internal
            # topics — same reasoning as services/debezium/docker-compose.yml's own env block.
            - name: CONFIG_STORAGE_TOPIC
              value: "_connect-configs"
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: OFFSET_STORAGE_TOPIC
              value: "_connect-offsets"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: STATUS_STORAGE_TOPIC
              value: "_connect-status"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            # JSON, not Avro — the official Debezium image can't carry Confluent's proprietary
            # AvroConverter (that was the previous custom image's whole reason to exist). The
            # image bundles Apicurio's own converter (ENABLE_APICURIO_CONVERTERS=true) as an
            # alternative if schema-registry integration is needed again; JSON is this image's
            # own default (matched explicitly here rather than left implicit) and needs no
            # registry wiring.
            - name: KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_LOG4J_ROOT_LOGLEVEL
              value: "INFO"
          # The official image scans every bundled connector (postgres, mysql, mongodb, oracle,
          # sqlserver, db2, spanner, vitess, informix, ibmi, jdbc, mariadb...) on startup, ~90s
          # here — vs. the old single-connector custom image's near-instant start.
          readinessProbe:
            httpGet:
              path: /connectors
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /connectors
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
