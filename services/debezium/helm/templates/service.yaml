apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "debezium.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "debezium.labels" . | nindent 4 }}
  ports:
    - name: http
      port: 8083
      targetPort: http
