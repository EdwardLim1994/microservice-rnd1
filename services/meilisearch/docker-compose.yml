services:
  meilisearch:
    image: getmeili/meilisearch:v1.14
    container_name: meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-meilimasterkey}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - meilisearch
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.meilisearch.rule=Host(`search.localhost`)
      - traefik.http.routers.meilisearch.middlewares=admin-auth
      - traefik.http.services.meilisearch.loadbalancer.server.port=7700
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meilisearch-data:

networks:
  meilisearch:
    driver: bridge
  # Empty here on purpose — real definition lives in services/traefik/docker-compose.yml (see
  # that file's own comment on this pattern, mirroring services/vault's "adminer" reference).
  traefik:
