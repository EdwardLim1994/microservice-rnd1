services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # This name appears in the UI Sidebar
      KAFKA_CLUSTERS_0_NAME: local-cluster
      # Use the INTERNAL listener port (9092) since this is inside Docker
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # Allows you to delete messages or topics from the UI
      AUTH_TYPE: DISABLED
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - kafka
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.kafka-ui.rule=Host(`kafka.localhost`)
      - traefik.http.routers.kafka-ui.middlewares=admin-auth
      - traefik.http.services.kafka-ui.loadbalancer.server.port=8080

  kafka:
    image: confluentinc/cp-kafka:8.2.2
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
      - "29092:29092"
      - "29093:29093"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "q1Sh-6xeT1el6Ghiu7VO9A"
      # PLAINTEXT_MINIKUBE exists because Kafka's protocol requires clients to reconnect using
      # whatever address the broker *advertises* in its metadata response — not just whatever
      # address a client used for its initial bootstrap connection. Pods running under minikube's
      # docker driver CAN reach PLAINTEXT_HOST's bootstrap port via host.minikube.internal:29092,
      # but the broker then advertises "localhost:29092" for that listener (correct only for
      # processes sharing the Docker host's own network namespace), so the pod's follow-up
      # connection fails — same root cause services/kafka/CLAUDE.md already documents for mixing
      # PLAINTEXT/PLAINTEXT_HOST within Docker, just a third network context neither listener
      # anticipated. Needs its own port: Kafka listeners are 1:1 with ports, so this can't reuse
      # PLAINTEXT_HOST's 29092.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,PLAINTEXT_MINIKUBE://:29093,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092,PLAINTEXT_MINIKUBE://host.minikube.internal:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_MINIKUBE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    command: >
      bash -c "
        if [ ! -f /tmp/kraft-combined-logs/meta.properties ]; then
          echo 'Formatting storage directory...'
          kafka-storage format \
            --ignore-formatted \
            --cluster-id=q1Sh-6xeT1el6Ghiu7VO9A \
            --config /etc/kafka/kafka.properties
        fi
        /etc/confluent/docker/run
      "
    healthcheck:
      # Checks the broker actually answers requests (not just that the port is open —
      # Kafka can accept TCP connections before it's finished becoming leader/ready).
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092",
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - kafka

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.2
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    networks:
      - kafka

networks:
  kafka:
    driver: bridge
  # Empty here on purpose — real definition lives in services/traefik/docker-compose.yml (see
  # that file's own comment on this pattern, mirroring services/vault's "adminer" reference).
  traefik:
