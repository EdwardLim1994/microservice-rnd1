apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "schemaRegistry.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "schemaRegistry.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "schemaRegistry.labels" . | nindent 8 }}
    spec:
      # Kubernetes auto-injects a SCHEMA_REGISTRY_PORT=tcp://<ip>:8081 env var into every pod in
      # this namespace for our own "schema-registry" Service (the standard <SVC>_PORT convention
      # — same mechanism as DEMO1_PORT etc. seen on servers/demo1's pods). The Confluent image's
      # own entrypoint (/etc/confluent/docker/configure) treats ANY non-empty SCHEMA_REGISTRY_PORT
      # as the deprecated PORT variable and refuses to start ("PORT is deprecated..." exit 1) —
      # confirmed by execing the entrypoint directly and reading that script. Disabling Service
      # env var injection entirely sidesteps it; nothing here relies on it (kafka's own address
      # is passed explicitly via SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS below).
      enableServiceLinks: false
      # Kubernetes has no docker-compose-style `depends_on: condition: service_healthy` — gate
      # startup explicitly rather than rely solely on Schema Registry's own client retry.
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 2; done"]
      containers:
        - name: schema-registry
          image: "{{ .Values.schemaRegistry.image }}"
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: schema-registry
            - name: SCHEMA_REGISTRY_LISTENERS
              value: "http://0.0.0.0:8081"
            # Same-namespace short name is fine here (schema-registry lives alongside kafka in
            # {{ .Values.namespace }}) — unlike a cross-namespace caller, which needs the FQDN.
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: "PLAINTEXT://kafka:9092"
            - name: SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL
              value: "PLAINTEXT"
          readinessProbe:
            httpGet:
              path: /subjects
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /subjects
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
