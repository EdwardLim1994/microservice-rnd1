# Prod-only. Not a workload SA — nothing runs as this identity. It exists purely so Vault's
# Kubernetes auth method has a ServiceAccount to bind the "cert-manager-issuer" role to (see
# services/vault/helm/templates/k8s-auth-provision-job.yaml) and so the Secret below can hold a
# real token for it.
{{- if not .Values.devMode }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-issuer
  namespace: {{ .Values.namespace }}
---
# `kubernetes.io/service-account-token` type + the `kubernetes.io/service-account.name`
# annotation is what tells Kubernetes' own controller to populate this Secret's `token`/`ca.crt`/
# `namespace` keys for the ServiceAccount above — no TokenRequest API call, no extra permissions
# needed on cert-manager's own controller. Known trade-off: unlike the bound, auto-rotated tokens
# pods get today, a token minted this way is long-lived and doesn't rotate itself — acceptable
# here since Vault's own role (see k8s-auth-provision-job.yaml) still only trusts it for the one
# narrow "cert-manager-issuer" policy (sign leaf certs, nothing else), same blast radius either
# way.
apiVersion: v1
kind: Secret
metadata:
  name: cert-manager-issuer-token
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/service-account.name: cert-manager-issuer
type: kubernetes.io/service-account-token
{{- end }}
