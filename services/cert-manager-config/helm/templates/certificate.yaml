# One cert for every host traefik fronts (grafana, vault, authentik, minio, ca-distribution,
# argocd) —
# set as traefik's tlsStore default certificate (see services/traefik/helm/values.yaml), so no
# per-app Ingress needs its own tls: block.
#
# Explicit hostnames, not a "*.lan"/"*.localhost" wildcard: Chrome (and other browsers) reject a
# wildcard SAN whose base domain is a single label as structurally identical to a forbidden
# wildcard-TLD cert (like "*.com") — "*.lan" never gets past name-matching, regardless of CA
# trust, and fails with ERR_CERT_COMMON_NAME_INVALID. `openssl s_client`/`verify` don't enforce
# that policy, which is why the chain looked fine there. Add a new entry here (both the
# .localhost and .lan form) whenever a new app gets its own Ingress host.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: traefik-default
  namespace: {{ .Values.namespace }}
spec:
  secretName: {{ .Values.certificateSecretName }}
  issuerRef:
    name: vault-issuer
    kind: Issuer
  dnsNames:
    - grafana.localhost
    - grafana.lan
    - vault.localhost
    - vault.lan
    - authentik.localhost
    - authentik.lan
    - minio.localhost
    - minio.lan
    - ca.localhost
    - ca.lan
    - argocd.localhost
    - argocd.lan
  duration: 720h
  renewBefore: 240h
