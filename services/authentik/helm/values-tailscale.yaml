# Layered on top of values.yaml (see services/authentik/Tiltfile) alongside
# services/monitoring/helm/values-tailscale.yaml — Grafana's rootUrl there is overridden to the
# tailscale tunnel scripts/port-forward.sh opens, so Authentik's grafana-provider needs a
# matching redirect_uri or the OAuth callback fails with "Invalid redirect URI" after login.
#
# Helm list values replace rather than merge — this repeats values.yaml's four LAN entries
# alongside the new one rather than losing them, so LAN-direct login keeps working too.
grafanaRedirectUris:
  - http://grafana.localhost/login/generic_oauth
  - http://grafana.lan/login/generic_oauth
  - http://grafana.lan:8080/login/generic_oauth
  - https://grafana.lan:8443/login/generic_oauth
  # Must match services/monitoring/helm/values-tailscale.yaml's grafana.rootUrl exactly.
  - https://raspberrypi94.tail60240b.ts.net:8085/login/generic_oauth
