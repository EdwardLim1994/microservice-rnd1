namespace: infra

image: ghcr.io/goauthentik/server:2026.5.4
postgresImage: postgres:16-alpine
redisImage: redis:alpine

# Matches services/authentik/docker-compose.yml's AUTHENTIK_SECRET_KEY default.
secretKey: changeme-generate-a-real-secret-key

postgresql:
  user: authentik
  password: authentikpassword
  db: authentik

bootstrap:
  email: admin@localhost
  password: adminpassword
  # Mints a ready-made akadmin API token at boot (no login step needed) — empty by default;
  # generate via `openssl rand -hex 32` (services/terraform's authentik_bootstrap_token variable
  # sets this via --set when deployed through that root) before running servers/auth/ansible's
  # provisioning role against this cluster's Authentik — see servers/auth/CLAUDE.md's
  # auth:provision section and services/authentik/CLAUDE.md's known-limitations section (still no
  # automated in-cluster trigger for the role itself, just the plumbing to authenticate one).
  token: ""

persistence:
  postgresqlSize: 1Gi
  redisSize: 1Gi
  mediaSize: 1Gi
  certsSize: 1Gi
