# Must match services/minio/helm/values.yaml's oidcClientSecret,
# services/monitoring/helm/values.yaml's grafanaOidcClientSecret,
# services/vault/helm/values.yaml's oidcClientSecret, and
# services/argocd/helm/values.yaml's configs.secret.extra."oidc.auth.client.secret" — separate
# Helm releases, no shared values, so these are duplicated by hand like every other cross-chart
# dev secret here (authentiksecretkey, vaultroottoken, ...).
minioOidcClientSecret: miniooidcclientsecret
grafanaOidcClientSecret: grafanaoidcclientsecret
vaultOidcClientSecret: vaultoidcclientsecret
argocdOidcClientSecret: argocdoidcclientsecret

authentik:
  # akadmin's login — only takes effect on the very first bootstrap (an already-provisioned
  # install, like this one originally was, needs its password set by hand once via
  # `ak shell -c "u = User.objects.get(username='akadmin'); u.set_password(...); u.save()"`).
  global:
    env:
      - name: AUTHENTIK_BOOTSTRAP_PASSWORD
        value: authentikadmin
      - name: AUTHENTIK_BOOTSTRAP_EMAIL
        value: akadmin@authentik.local
  # Registers minio/grafana/vault/argocd as native OIDC apps on boot — see
  # templates/proxy-blueprint-configmap.yaml. The configmap name must match the release's
  # rendered name exactly (Helm doesn't template values.yaml itself).
  blueprints:
    configMaps:
      - authentik-proxy-blueprint
  authentik:
    secret_key: authentiksecretkey
    # Must match postgresql.auth.password below — the chart doesn't auto-wire the
    # bundled Postgres's generated secret, both sides need the same plain value.
    postgresql:
      password: authentikpostgrespassword
  # Chart defaults to no bundled DB (expects external Postgres) — enable the bundled
  # one, matching this repo's other dev infra (vault/kafka run in-cluster too).
  postgresql:
    enabled: true
    auth:
      password: authentikpostgrespassword
      # Fixed, not left to the chart's own randAlphaNum-if-unset default — that default is only
      # stable across a `helm upgrade` as long as its own `lookup`-the-existing-secret-first logic
      # actually finds it every time, and in practice here (repeated `terraform apply` retries
      # during initial setup) it didn't always: the Secret ended up holding a different password
      # than whatever Postgres was actually initialized with at its own first `initdb` — since a
      # secret-volume-mounted file updates live but Postgres only ever reads it once, that
      # silently desyncs the two with no error until something tries to authenticate. A fixed
      # value here is stable across every apply/retry, same as authentik's own custom-user
      # password right above.
      postgresPassword: authentikpostgressuperuserpassword
      # Confirmed by hand (kubectl exec + psql, both via TCP and the local socket): with the
      # chart's own default (usePasswordFiles: true), the custom "authentik" user's password —
      # mounted the same way, via POSTGRES_PASSWORD_FILE — works correctly, but the superuser's
      # (POSTGRES_POSTGRES_PASSWORD_FILE) does not; postgres rejects every value for "postgres"
      # even immediately after a from-scratch initdb where the file's content is provably correct.
      # That's a real asymmetry in this chart/image's own entrypoint script, not a config mistake
      # on this repo's side. Forcing plain env vars instead routes both users through the exact
      # same, simpler, apparently-not-buggy code path — also what every other chart in this repo
      # already uses (none of them use usePasswordFiles).
      usePasswordFiles: false
    # minikube's default hostpath storage class provisions volumes owned by root; the
    # postgres container runs as non-root and can't write to them without this.
    # This chart's shell-image substitution renders "registry-1.docker.io/debian:13-slim"
    # (missing the "library/" namespace segment Docker Hub needs for official images),
    # which containerd can't resolve — pin an explicit, correct repository instead.
    volumePermissions:
      enabled: true
      image:
        repository: library/debian
        tag: 13-slim
