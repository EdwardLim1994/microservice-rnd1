apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-postgresql
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "authentik.postgresql.labels" . | nindent 4 }}
spec:
  serviceName: authentik-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "authentik.postgresql.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "authentik.postgresql.labels" . | nindent 8 }}
    spec:
      # See services/kafka/helm/templates/schema-registry-deployment.yaml's comment (also applied
      # to redis/meilisearch/apollo-router) — an auto-injected <SVC>_PORT env var has crashed at
      # least one image outright in this cluster; disabling Service env var injection here too
      # avoids relying on the postgres image never hitting a similar collision.
      enableServiceLinks: false
      containers:
        - name: postgresql
          image: "{{ .Values.postgresImage }}"
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.db | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-d", {{ .Values.postgresql.db | quote }}, "-U", {{ .Values.postgresql.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-d", {{ .Values.postgresql.db | quote }}, "-U", {{ .Values.postgresql.user | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.postgresqlSize }}
