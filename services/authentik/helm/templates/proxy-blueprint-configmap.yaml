# Declaratively registers a native-OIDC Provider + Application per admin UI this repo puts
# behind Authentik (minio/grafana/vault/argocd) — no ansible/terraform provider needed, the
# chart applies blueprints on boot. All four now integrate this way (see each entry's own
# comment for the app-specific wiring); the original shared forward_single/embedded-outpost
# gate (services/traefik's authentik-forward-auth Middleware) was retired once argocd — the
# last app still using it — moved to native OIDC. kafka-ui was removed (no longer part of this
# repo) before that happened.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-proxy-blueprint
  namespace: {{ .Release.Namespace }}
data:
  proxy-apps.yaml: |
    version: 1
    metadata:
      name: proxy-apps
    entries:
      # MinIO integrates via native OIDC (https://integrations.goauthentik.io/minio) — it
      # understands per-user identity and a "policy" claim MinIO maps to its own RBAC. See
      # services/minio/helm for the client secret + MINIO_IDENTITY_OPENID_* wiring.
      - model: authentik_providers_oauth2.scopemapping
        id: minio-policy-mapping
        identifiers:
          name: minio-policy-mapping
        attrs:
          scope_name: minio
          description: MinIO policy claim
          # ponytail: every authenticated user maps to consoleAdmin (single fixed policy) —
          # switch to a group-based expression (e.g. "minio-readonly" group -> "readonly" policy)
          # if per-user MinIO permissions are ever needed.
          expression: "return {'policy': 'consoleAdmin'}"
      - model: authentik_providers_oauth2.oauth2provider
        id: minio-provider
        identifiers:
          name: minio-provider
        attrs:
          client_type: confidential
          client_id: minio
          client_secret: {{ .Values.minioOidcClientSecret | quote }}
          # No signing_key means Authentik falls back to HS256 (client-secret-signed, no "kid"
          # header) — MinIO's OIDC library insists on RS256 + a JWKS-resolvable kid and fails
          # with "Invalid kid value <nil>" otherwise.
          signing_key: !Find [authentik_crypto.certificatekeypair, [managed, "goauthentik.io/crypto/jwt-managed"]]
          # Defaults to an empty list (no grants allowed at all) — without this the token
          # endpoint rejects MinIO's authorization_code exchange with a bare "invalid_request",
          # no more specific error.
          grant_types:
            - authorization_code
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
            - !KeyOf minio-policy-mapping
          redirect_uris:
            - matching_mode: strict
              url: http://minio.localhost/oauth_callback
              redirect_uri_type: authorization
            - matching_mode: strict
              url: http://minio.lan/oauth_callback
              redirect_uri_type: authorization
            # :8080 matches the temporary port-forward used for LAN device access — see
            # services/minio/helm/templates/secret.yaml's MINIO_IDENTITY_OPENID_REDIRECT_URI.
            - matching_mode: strict
              url: http://minio.lan:8080/oauth_callback
              redirect_uri_type: authorization
            # :8443 https — MINIO_IDENTITY_OPENID_REDIRECT_URI now points here (see
            # secret.yaml); the plain-http entries above are kept for anyone still on the
            # docker-compose backup / bare-nodePort path, not actually requested by MinIO anymore.
            - matching_mode: strict
              url: https://minio.lan:8443/oauth_callback
              redirect_uri_type: authorization
      - model: authentik_core.application
        id: minio-app
        identifiers:
          slug: minio
        attrs:
          name: minio
          provider: !KeyOf minio-provider
      # Grafana integrates via native OIDC too (https://integrations.goauthentik.io/grafana),
      # generic_oauth — see services/monitoring/helm for the client secret + GF_AUTH_GENERIC_OAUTH_*
      # wiring, and grafana-ingress.yaml for why forward-auth was dropped from grafana.localhost.
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        identifiers:
          name: grafana-provider
        attrs:
          client_type: confidential
          client_id: grafana
          client_secret: {{ .Values.grafanaOidcClientSecret | quote }}
          signing_key: !Find [authentik_crypto.certificatekeypair, [managed, "goauthentik.io/crypto/jwt-managed"]]
          grant_types:
            - authorization_code
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
          # Grafana's redirect_uri is fixed as "<root_url>/login/generic_oauth" (not user
          # configurable) — one entry per host GF_SERVER_ROOT_URL might be pointed at, values-driven
          # (see this chart's own values.yaml's grafanaRedirectUris) so an overlay like
          # values-tailscale.yaml can add another host without editing this template.
          redirect_uris:
            {{- range .Values.grafanaRedirectUris }}
            - matching_mode: strict
              url: {{ . }}
              redirect_uri_type: authorization
            {{- end }}
      - model: authentik_core.application
        id: grafana-app
        identifiers:
          slug: grafana
        attrs:
          name: grafana
          provider: !KeyOf grafana-provider
      # Vault integrates via its own OIDC auth method (https://integrations.goauthentik.io/vault)
      # instead of the forward-auth gate — see services/vault/helm/templates/oidc-provision-job.yaml
      # for the `vault write auth/oidc/...` side (Vault has no chart-values-level OIDC config, it's
      # provisioned through Vault's own API/CLI), and templates/ingress.yaml for why forward-auth
      # was dropped from vault.localhost.
      - model: authentik_providers_oauth2.oauth2provider
        id: vault-provider
        identifiers:
          name: vault-provider
        attrs:
          client_type: confidential
          client_id: vault
          client_secret: {{ .Values.vaultOidcClientSecret | quote }}
          signing_key: !Find [authentik_crypto.certificatekeypair, [managed, "goauthentik.io/crypto/jwt-managed"]]
          grant_types:
            - authorization_code
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
          # Vault UI's OIDC callback is fixed as "<addr>/ui/vault/auth/<mount path>/oidc/callback"
          # (mount path is "oidc", see the provisioning Job) — one entry per host, same
          # three-host pattern as minio/grafana.
          redirect_uris:
            - matching_mode: strict
              url: http://vault.localhost/ui/vault/auth/oidc/oidc/callback
              redirect_uri_type: authorization
            - matching_mode: strict
              url: http://vault.lan/ui/vault/auth/oidc/oidc/callback
              redirect_uri_type: authorization
            - matching_mode: strict
              url: http://vault.lan:8080/ui/vault/auth/oidc/oidc/callback
              redirect_uri_type: authorization
            # :8443 https — matches oidc/role/default's allowed_redirect_uris (see
            # oidc-provision-job.yaml).
            - matching_mode: strict
              url: https://vault.lan:8443/ui/vault/auth/oidc/oidc/callback
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://vault.localhost:8443/ui/vault/auth/oidc/oidc/callback
              redirect_uri_type: authorization
      - model: authentik_core.application
        id: vault-app
        identifiers:
          slug: vault
        attrs:
          name: vault
          provider: !KeyOf vault-provider
      # ArgoCD integrates via native OIDC too (https://argo-cd.readthedocs.io/en/stable/operator-manual/user-management/#existing-oidc-provider)
      # — see services/argocd/helm/values.yaml for the client secret + configs.cm."oidc.config"
      # wiring, and why the argocd.localhost Ingress no longer carries forward-auth.
      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        identifiers:
          name: argocd-provider
        attrs:
          client_type: confidential
          client_id: argocd
          client_secret: {{ .Values.argocdOidcClientSecret | quote }}
          signing_key: !Find [authentik_crypto.certificatekeypair, [managed, "goauthentik.io/crypto/jwt-managed"]]
          grant_types:
            - authorization_code
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
          # ArgoCD's redirect_uri is fixed as "<url>/auth/callback" (not user configurable) — one
          # entry per host configs.cm.url might be pointed at, same as minio/grafana/vault.
          redirect_uris:
            - matching_mode: strict
              url: http://argocd.localhost/auth/callback
              redirect_uri_type: authorization
            - matching_mode: strict
              url: http://argocd.lan/auth/callback
              redirect_uri_type: authorization
            - matching_mode: strict
              url: http://argocd.lan:8080/auth/callback
              redirect_uri_type: authorization
            # :8443 https — configs.cm.url now points here (see argocd values.yaml).
            - matching_mode: strict
              url: https://argocd.lan:8443/auth/callback
              redirect_uri_type: authorization
      - model: authentik_core.application
        id: argocd-app
        identifiers:
          slug: argocd
        attrs:
          name: argocd
          provider: !KeyOf argocd-provider
      # Restricts all four apps to "authentik Admins" (built-in, akadmin is a member by default)
      # or "internal-users" members only — an Application with zero access bindings is open to
      # any authenticated user; adding bindings switches it to allow-listed. policy_engine_mode
      # defaults to "any" per Application, so either group independently grants access (OR, not
      # AND). Add non-admin users to "internal-users" via Authentik's own UI (Directory > Groups
      # > internal-users > Users) — blueprints don't manage group *membership* declaratively here
      # since that'd mean hardcoding specific users' PKs into checked-in YAML.
      - model: authentik_core.group
        id: internal-users-group
        identifiers:
          name: internal-users
        attrs: {}
      {{- range tuple "minio" "grafana" "vault" "argocd" }}
      - model: authentik_policies.policybinding
        id: {{ . }}-access-admins
        identifiers:
          target: !KeyOf {{ . }}-app
          group: !Find [authentik_core.group, [name, "authentik Admins"]]
        attrs:
          order: 0
      - model: authentik_policies.policybinding
        id: {{ . }}-access-internal-users
        identifiers:
          target: !KeyOf {{ . }}-app
          group: !KeyOf internal-users-group
        attrs:
          order: 1
      {{- end }}
