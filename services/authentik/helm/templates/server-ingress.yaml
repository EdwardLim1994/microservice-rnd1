# Same Host() as services/authentik/docker-compose.yml's `traefik.http.routers.authentik.rule`
# label — not behind Traefik's admin-auth middleware there either, since Authentik is itself the
# login provider (see services/traefik/CLAUDE.md's Kubernetes section for why no equivalent
# middleware exists in-cluster anyway).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "authentik.server.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    - host: auth.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik-server
                port:
                  number: 9000
