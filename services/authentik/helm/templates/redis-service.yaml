apiVersion: v1
kind: Service
metadata:
  name: authentik-redis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "authentik.redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "authentik.redis.labels" . | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
