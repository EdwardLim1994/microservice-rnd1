# Shared between authentik-server and authentik-worker (both mount /media and /certs — same as
# services/authentik/docker-compose.yml's authentik-media/authentik-certs volumes). Deployments
# can't use volumeClaimTemplates like the postgresql/redis StatefulSets above, so these are
# standalone PVCs referenced by both. ReadWriteOnce is enough only because both Deployments'
# single replica each land on minikube's one node — a multi-node cluster would need an RWX-capable
# StorageClass instead.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-media
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "authentik.server.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.persistence.mediaSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-certs
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "authentik.server.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.persistence.certsSize }}
