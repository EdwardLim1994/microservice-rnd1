apiVersion: v1
kind: Service
metadata:
  name: authentik-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "authentik.server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "authentik.server.labels" . | nindent 4 }}
  ports:
    - name: http
      port: 9000
      targetPort: http
    - name: https
      port: 9443
      targetPort: https
