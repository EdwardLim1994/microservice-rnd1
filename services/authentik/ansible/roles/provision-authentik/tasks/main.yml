---
# Every task here is written to be safely re-runnable — unlike Vault dev mode, Authentik's
# Postgres is persistent (services/authentik/CLAUDE.md), so this is a one-shot-per-fresh-deployment
# script, not a "run every restart" one — but idempotency still matters for iterating on this role
# itself, and for re-running after rotating servers/auth/.env by hand.

- name: Look up the OAuth2 provider authorization flow (default-provider-authorization-implicit-consent)
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/flows/instances/?slug=default-provider-authorization-implicit-consent"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: authorization_flow_result

- name: Look up the OAuth2 provider invalidation flow (default-provider-invalidation-flow)
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/flows/instances/?slug=default-provider-invalidation-flow"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: invalidation_flow_result

- name: Set facts for the resolved flow UUIDs
  ansible.builtin.set_fact:
    resolved_authorization_flow: "{{ authorization_flow_result.json.results[0].pk }}"
    resolved_invalidation_flow: "{{ invalidation_flow_result.json.results[0].pk }}"

- name: Look up an existing OAuth2 provider by name
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/providers/oauth2/?name={{ oauth2_provider_name }}"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: oauth2_provider_lookup

# Without explicit property_mappings, a provider grants NO scopes at all (confirmed empirically —
# Authentik logs "Application requested scopes not configured, setting to overlap" with
# scope_allowed: set()) — the openid/email/profile claims end up empty, and critically no
# offline_access means no refresh_token is ever issued, breaking signOut (which revokes the
# refresh token). Authentik ships these four as pre-existing managed scope mappings; look them up
# by name rather than assuming their UUIDs.
- name: Look up the standard OpenID scope property mappings
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/propertymappings/provider/scope/?scope_name={{ item }}"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: scope_mapping_lookups
  loop: ["openid", "email", "profile", "offline_access"]

- name: Set fact for the resolved scope property mapping pks
  ansible.builtin.set_fact:
    resolved_scope_mappings: "{{ scope_mapping_lookups.results | map(attribute='json.results') | map('first') | map(attribute='pk') | list }}"

# With no signing_key set, Authentik signs tokens HS256 using the Provider's own client_secret —
# fine for a single consumer that already holds that secret (servers/auth itself, decoding its own
# id_token), but wrong for AuthentikAuthInterceptor's use case: *other* servers verifying tokens
# they never issued, with no reason to hold servers/auth's OAuth2 client_secret at all. Switching
# to RS256 (a real asymmetric keypair) means any server can fetch the public JWKS
# (/application/o/<slug>/jwks/) and verify independently — no secret distribution needed. Reuses
# Authentik's own pre-existing default self-signed CertificateKeyPair rather than generating a
# dedicated one — sufficient for this prototype; a production deployment would likely want its own.
- name: Look up Authentik's default self-signed certificate keypair
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/crypto/certificatekeypairs/?name=authentik+Self-signed+Certificate"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: signing_cert_lookup

- name: Set fact for the resolved signing key pk
  ansible.builtin.set_fact:
    resolved_signing_key: "{{ signing_cert_lookup.json.results[0].pk }}"

# grant_types is "authorization_code" + "refresh_token" — NOT "password". Authentik's OAuth2
# "password" grant does not check a user's real account password; it's implemented as a
# client-credentials-style lookup against a separate "App Password" Token
# (authentik/providers/oauth2/views/token.py's __post_init_client_credentials_creds), and Token
# creation for a user other than the caller itself is hardcoded to require is_superuser
# (authentik/core/api/tokens.py's perform_create) — not grantable via ordinary RBAC permissions.
# So real username+password authentication goes through the same path a browser would: driving
# the authorization_flow's stages via the Flow Executor API (which DOES validate the real
# set_password'd password), then completing a normal Authorization Code exchange once the session
# is authenticated. See AuthentikClient.signIn()'s own comment for the full client-side sequence,
# and servers/auth/CLAUDE.md for why this replaced the originally-planned ROPC approach.
#
# redirect_uris' url must match EXACTLY what AuthentikClient sends as its own redirect_uri query
# param (strict matching_mode) — never actually dereferenced, since the client reads the
# authorization code from the 302's Location header directly instead of following it.
- name: Create the OAuth2 provider, if it doesn't already exist
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/providers/oauth2/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      name: "{{ oauth2_provider_name }}"
      client_type: confidential
      grant_types: ["authorization_code", "refresh_token"]
      authorization_flow: "{{ resolved_authorization_flow }}"
      invalidation_flow: "{{ resolved_invalidation_flow }}"
      redirect_uris:
        - matching_mode: strict
          url: "{{ oauth2_redirect_uri }}"
      property_mappings: "{{ resolved_scope_mappings }}"
      signing_key: "{{ resolved_signing_key }}"
    status_code: 201
  register: oauth2_provider_create
  when: oauth2_provider_lookup.json.pagination.count == 0

- name: Reconcile the OAuth2 provider's client_type/grant_types/flows/redirect_uris/scopes/signing_key, if it already existed
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/providers/oauth2/{{ oauth2_provider_lookup.json.results[0].pk }}/"
    method: PATCH
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      client_type: confidential
      grant_types: ["authorization_code", "refresh_token"]
      authorization_flow: "{{ resolved_authorization_flow }}"
      invalidation_flow: "{{ resolved_invalidation_flow }}"
      property_mappings: "{{ resolved_scope_mappings }}"
      redirect_uris:
        - matching_mode: strict
          url: "{{ oauth2_redirect_uri }}"
      signing_key: "{{ resolved_signing_key }}"
    status_code: 200
  register: oauth2_provider_patch
  when: oauth2_provider_lookup.json.pagination.count > 0

- name: Set facts for the resolved OAuth2 provider
  ansible.builtin.set_fact:
    resolved_provider_pk: "{{ (oauth2_provider_create.json | default(oauth2_provider_patch.json)).pk }}"
    resolved_client_id: "{{ (oauth2_provider_create.json | default(oauth2_provider_patch.json)).client_id }}"
    resolved_client_secret: "{{ (oauth2_provider_create.json | default(oauth2_provider_patch.json)).client_secret }}"

- name: Look up an existing Application by slug
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/core/applications/?slug={{ application_slug }}"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: application_lookup

- name: Create the Application bound to the OAuth2 provider, if it doesn't already exist
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/core/applications/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      name: "{{ application_name }}"
      slug: "{{ application_slug }}"
      provider: "{{ resolved_provider_pk }}"
    status_code: 201
  when: application_lookup.json.pagination.count == 0

- name: Reconcile the Application's provider binding, if it already existed
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/core/applications/{{ application_slug }}/"
    method: PATCH
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      provider: "{{ resolved_provider_pk }}"
    status_code: 200
  when: application_lookup.json.pagination.count > 0

- name: Look up an existing service-account user by username
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/core/users/?username={{ service_account_username }}"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: service_account_lookup

# Plain /core/users/ create (type: service_account) rather than the /core/users/service_account/
# convenience endpoint — that endpoint mints a token as a side effect every time it's called, with
# no idempotent "already exists" behavior, which would create a fresh duplicate service account on
# every re-run of this role. Managing the user and its Token (below) as ordinary resources, each
# looked up before creation, keeps the whole role safely re-runnable.
- name: Create the service-account user, if it doesn't already exist
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/core/users/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      username: "{{ service_account_username }}"
      name: "{{ service_account_username }}"
      is_active: true
      type: service_account
    status_code: 201
  register: service_account_create
  when: service_account_lookup.json.pagination.count == 0

- name: Set fact for the resolved service-account user pk
  ansible.builtin.set_fact:
    resolved_service_account_pk: >-
      {{ (service_account_create.json | default(service_account_lookup.json.results[0])).pk }}

# A freshly created service-account user has NO permissions by default (confirmed against the
# live API — the Admin API's /core/users/ create returns 403 for a token belonging to a
# permission-less service account) — Authentik does not treat "service_account" as implicitly
# privileged the way, say, akadmin is. Rather than granting is_superuser (broad, unscoped), this
# role creates a dedicated Role carrying exactly the three permissions AuthentikClient actually
# needs (add_user for signUp's create call, reset_user_password for its set_password call,
# view_user so the create-then-lookup round trip works) and adds the service account to it.
- name: Look up an existing RBAC role by name
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/rbac/roles/?name={{ service_account_role_name }}"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: rbac_role_lookup

- name: Create the RBAC role, if it doesn't already exist
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/rbac/roles/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      name: "{{ service_account_role_name }}"
    status_code: 201
  register: rbac_role_create
  when: rbac_role_lookup.json.pagination.count == 0

- name: Set fact for the resolved RBAC role uuid
  ansible.builtin.set_fact:
    resolved_role_uuid: >-
      {{ (rbac_role_create.json | default(rbac_role_lookup.json.results[0])).pk }}

# Idempotent by construction — Authentik's assign endpoint is additive (assigning an
# already-assigned permission is a no-op, not an error), so this doesn't need its own lookup step
# first the way the resources above do.
- name: Grant the RBAC role the permissions AuthentikClient needs
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/rbac/permissions/assigned_by_roles/{{ resolved_role_uuid }}/assign/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      permissions:
        - authentik_core.add_user
        - authentik_core.view_user
        - authentik_core.reset_user_password
    status_code: 200

- name: Add the service-account user to the RBAC role
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/rbac/roles/{{ resolved_role_uuid }}/add_user/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      pk: "{{ resolved_service_account_pk }}"
    status_code: [200, 204]

- name: Check whether the API token already exists
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/core/tokens/{{ api_token_identifier }}/"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: [200, 404]
  register: api_token_lookup

- name: Create the API token, if it doesn't already exist
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/core/tokens/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      identifier: "{{ api_token_identifier }}"
      user: "{{ resolved_service_account_pk }}"
      intent: api
      expiring: false
    status_code: 201
  when: api_token_lookup.status == 404

# view_key works regardless of whether the token was just created or already existed — Authentik
# stores tokens in a form the admin API can still surface on demand, unlike a typical hashed-secret
# design where only the create response ever carries the plaintext value. This is what makes the
# whole role re-runnable without needing to cache the token anywhere itself.
- name: Read back the API token's plaintext key
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/core/tokens/{{ api_token_identifier }}/view_key/"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: api_token_view

- name: Set fact for the resolved API token
  ansible.builtin.set_fact:
    resolved_api_token: "{{ api_token_view.json.key }}"

- name: Check whether the server's real .env exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../../servers/{{ server_name }}/.env"
  register: dotenv_stat

# Only ever written into .env (gitignored, real-secret territory) — never .env.sample. Same
# convention as services/vault/ansible/roles/provision-server-vault/tasks/main.yml's closing tasks.
- name: Write AUTHENTIK_OAUTH_CLIENT_ID into the server's .env, if it exists
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/../../../servers/{{ server_name }}/.env"
    regexp: "^AUTHENTIK_OAUTH_CLIENT_ID="
    line: "AUTHENTIK_OAUTH_CLIENT_ID={{ resolved_client_id }}"
  when: dotenv_stat.stat.exists

- name: Write AUTHENTIK_OAUTH_CLIENT_SECRET into the server's .env, if it exists
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/../../../servers/{{ server_name }}/.env"
    regexp: "^AUTHENTIK_OAUTH_CLIENT_SECRET="
    line: "AUTHENTIK_OAUTH_CLIENT_SECRET={{ resolved_client_secret }}"
  when: dotenv_stat.stat.exists

- name: Write AUTHENTIK_API_TOKEN into the server's .env, if it exists
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/../../../servers/{{ server_name }}/.env"
    regexp: "^AUTHENTIK_API_TOKEN="
    line: "AUTHENTIK_API_TOKEN={{ resolved_api_token }}"
  when: dotenv_stat.stat.exists

# --- Self-service enrollment flow (backs RegisterUseCase's real signup, replacing the old
# Admin-API createUser() bypass) ---------------------------------------------------------------
#
# A single ak-stage-prompt stage collecting `username`/`password`, then a UserWriteStage. The
# submitted email is deliberately written as the account's Authentik *username* (no separate
# `email` field) — Authentik's User model requires a unique, non-blank username, and reusing it as
# the email means identification-by-email in the authentication flow (AuthentikClient.signIn())
# just works with no extra plumbing, and a duplicate-email registration surfaces for free as a
# username uniqueness IntegrityError. See AuthentikClient.enroll()'s own comment for the exact
# three challenge shapes this flow can return, confirmed empirically against a running
# 2026.5.4 instance (GET/POST against /api/v3/flows/executor/{{ enrollment_flow_slug }}/).

- name: Look up the enrollment email prompt field by name
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/stages/prompt/prompts/?name={{ enrollment_field_email_name }}"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: enrollment_field_email_lookup

# field_key is `username`, not `email` — see this block's header comment for why. `type: email`
# still gives real client- and server-side email-format validation on submission.
- name: Create the enrollment email prompt field, if it doesn't already exist
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/stages/prompt/prompts/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      name: "{{ enrollment_field_email_name }}"
      field_key: username
      label: Email
      type: email
      required: true
      placeholder: "you@example.com"
      placeholder_expression: false
      order: 0
    status_code: 201
  register: enrollment_field_email_create
  when: enrollment_field_email_lookup.json.pagination.count == 0

- name: Set fact for the resolved enrollment email prompt field pk
  ansible.builtin.set_fact:
    resolved_enrollment_field_email: >-
      {{ (enrollment_field_email_create.json | default(enrollment_field_email_lookup.json.results[0])).pk }}

- name: Look up the enrollment password prompt field by name
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/stages/prompt/prompts/?name={{ enrollment_field_password_name }}"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: enrollment_field_password_lookup

- name: Create the enrollment password prompt field, if it doesn't already exist
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/stages/prompt/prompts/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      name: "{{ enrollment_field_password_name }}"
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      placeholder_expression: false
      order: 1
    status_code: 201
  register: enrollment_field_password_create
  when: enrollment_field_password_lookup.json.pagination.count == 0

- name: Set fact for the resolved enrollment password prompt field pk
  ansible.builtin.set_fact:
    resolved_enrollment_field_password: >-
      {{ (enrollment_field_password_create.json | default(enrollment_field_password_lookup.json.results[0])).pk }}

# Reuses Authentik's own built-in default-password-change-password-policy (min length 8 +
# zxcvbn strength check) rather than defining a second, parallel policy — see that policy's own
# `error_message` for exactly what RegisterUseCase surfaces on a weak password.
- name: Look up the default password policy
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/policies/password/?name=default-password-change-password-policy"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: password_policy_lookup

- name: Set fact for the resolved password policy pk
  ansible.builtin.set_fact:
    resolved_password_policy: "{{ password_policy_lookup.json.results[0].pk }}"

- name: Look up the enrollment prompt stage by name
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/stages/prompt/stages/?name={{ enrollment_prompt_stage_name }}"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: enrollment_prompt_stage_lookup

- name: Create the enrollment prompt stage, if it doesn't already exist
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/stages/prompt/stages/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      name: "{{ enrollment_prompt_stage_name }}"
      fields:
        - "{{ resolved_enrollment_field_email }}"
        - "{{ resolved_enrollment_field_password }}"
      validation_policies:
        - "{{ resolved_password_policy }}"
    status_code: 201
  register: enrollment_prompt_stage_create
  when: enrollment_prompt_stage_lookup.json.pagination.count == 0

- name: Reconcile the enrollment prompt stage's fields/validation policy, if it already existed
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/stages/prompt/stages/{{ enrollment_prompt_stage_lookup.json.results[0].pk }}/"
    method: PATCH
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      fields:
        - "{{ resolved_enrollment_field_email }}"
        - "{{ resolved_enrollment_field_password }}"
      validation_policies:
        - "{{ resolved_password_policy }}"
    status_code: 200
  when: enrollment_prompt_stage_lookup.json.pagination.count > 0

- name: Set fact for the resolved enrollment prompt stage pk
  ansible.builtin.set_fact:
    resolved_enrollment_prompt_stage: >-
      {{ (enrollment_prompt_stage_create.json | default(enrollment_prompt_stage_lookup.json.results[0])).pk }}

- name: Look up the enrollment user-write stage by name
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/stages/user_write/?name={{ enrollment_write_stage_name }}"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: enrollment_write_stage_lookup

- name: Create the enrollment user-write stage, if it doesn't already exist
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/stages/user_write/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      name: "{{ enrollment_write_stage_name }}"
      user_creation_mode: always_create
    status_code: 201
  register: enrollment_write_stage_create
  when: enrollment_write_stage_lookup.json.pagination.count == 0

- name: Set fact for the resolved enrollment user-write stage pk
  ansible.builtin.set_fact:
    resolved_enrollment_write_stage: >-
      {{ (enrollment_write_stage_create.json | default(enrollment_write_stage_lookup.json.results[0])).pk }}

- name: Look up the enrollment flow by slug
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/flows/instances/?slug={{ enrollment_flow_slug }}"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: enrollment_flow_lookup

- name: Create the enrollment flow, if it doesn't already exist
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/flows/instances/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      name: "{{ enrollment_flow_name }}"
      slug: "{{ enrollment_flow_slug }}"
      title: Create your account
      designation: enrollment
      authentication: require_unauthenticated
    status_code: 201
  register: enrollment_flow_create
  when: enrollment_flow_lookup.json.pagination.count == 0

- name: Set fact for the resolved enrollment flow pk
  ansible.builtin.set_fact:
    resolved_enrollment_flow: >-
      {{ (enrollment_flow_create.json | default(enrollment_flow_lookup.json.results[0])).pk }}

- name: Look up existing flow-stage bindings for the enrollment flow
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/flows/bindings/?target={{ resolved_enrollment_flow }}"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: enrollment_bindings_lookup

- name: Bind the enrollment prompt stage to the flow (order 10), if not already bound
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/flows/bindings/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      target: "{{ resolved_enrollment_flow }}"
      stage: "{{ resolved_enrollment_prompt_stage }}"
      order: 10
    status_code: 201
  when: resolved_enrollment_prompt_stage not in (enrollment_bindings_lookup.json.results | map(attribute='stage') | list)

- name: Bind the enrollment user-write stage to the flow (order 20), if not already bound
  ansible.builtin.uri:
    url: "{{ authentik_url }}/api/v3/flows/bindings/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      target: "{{ resolved_enrollment_flow }}"
      stage: "{{ resolved_enrollment_write_stage }}"
      order: 20
    status_code: 201
  when: resolved_enrollment_write_stage not in (enrollment_bindings_lookup.json.results | map(attribute='stage') | list)
